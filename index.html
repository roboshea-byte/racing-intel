{id:"19d43362d41aaab7",originalSubject:"Daily AI Analysis [ 31st March ]",from:"IQ Racing <info@iqracing.net>",author:"IQ Racing",emailDate:"2026-03-31T09:25:16Z",tipDate:"2026-03-31",processedAt:"2026-03-31T14:21:36Z",originalBody:"Tuesday 31st March\n\nAnnie Express landed us a nice winner yesterday.\n\nBangor 4.20 - The Scorpion King\nAdvised Odds: 9/2 (Bet365)\nAdvised Bet: 1.5 point win\nPerformance Metrics: Three-time chase winner who showed signs of a return to form when staying on for third at Exeter. Now 4lb below his last winning mark and edging back towards a competitive level, with that latest run suggesting he is building back to peak fitness.\nTrack Characteristics: Bangor's stamina test over this trip should suit, particularly for a horse proven from 2m3f to beyond 3m on soft ground. The track allows runners to build momentum and rewards strong finishers.\nRace Projection: With the yard typically peaking at this time of year and a strong jockey booking back in place, conditions look ideal for a bold showing. If building on the Exeter effort, he has a strong chance of returning to winning ways.\n\nIQ Racing",originalHtml:"",selections:[{race:"Bangor 4.20",horse:"The Scorpion King",odds:"9/2",stake:"1.5 points win",category:"",analysis:"The Scorpion King is a three-time chase winner who showed encouraging signs of a return to form when staying on for third at Exeter on his latest outing. He now finds himself 4lb below his last winning mark, a significant detail that the market may be underestimating. The form received a boost when subsequent events franked the Exeter form, and this stiff Bangor test over an extended trip on testing ground plays directly to his proven stamina credentials. The yard typically peaks at this time of year, and with a strong jockey booking back in place, the stars could be aligning for a return to winning ways. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d433260001c083",originalSubject:"BetRev - Tuesday 31st March",from:"BetRev <admin@bethub.pro>",author:"BetRev",emailDate:"2026-03-31T09:21:07Z",tipDate:"2026-03-31",processedAt:"2026-03-31T14:21:36Z",originalBody:"Daily Digest - Tuesday 31st March 2026:\n\nNewcastle 2.30\nChemoulin showed a really likeable attitude when winning at Haydock, picking up strongly to get on top late on, having been briefly outpaced. That performance suggested there is more to come and this stiffer track should play to his strengths. An opening mark of 109 looks lenient given the level of form behind him and he remains lightly raced with plenty of upside. With the yard in good form and conditions to suit, he looks the one to beat here and i'd be disappointed were he not to go very close.\n\nBangor 3.50\nAnyharminasking has yet to win over fences but has shown enough to suggest his turn is near. His early chasing efforts came in stronger races and he shaped well when second on debut before catching the eye again at Warwick over this trip. The handicapper has given him a real chance, dropping him to a mark that looks very workable based on his hurdles form. With conditions ideal and everything now in place, he should go very well.\n\nBet Summary:\nNewcastle 2.30 - Chemoulin - 3 point win at 5/2 (Bet365)\nBangor 3.50 - Anyharminasking - 1.5 point e/w at 15/2 (Skybet - 4 places)\n\nBe Lucky\nG.J.",originalHtml:"",selections:[{race:"Newcastle 2.30",horse:"Chemoulin",odds:"5/2",stake:"3 points win",category:"",analysis:"Chemoulin showed a thoroughly likeable attitude when making a winning start over hurdles at Haydock, picking up strongly to assert late on having been briefly outpaced in the home straight. That performance suggested there is considerably more to come from this lightly raced sort, and this stiffer Newcastle test should play to his obvious stamina strengths. An opening handicap mark of 109 looks distinctly lenient given the level of form in behind, and the yard continues in excellent form. Everything points to a bold showing and it would be no surprise to see him confirm himself as a horse going places."},{race:"Bangor 3.50",horse:"Anyharminasking",odds:"15/2",stake:"1.5 points e/w (4 places)",category:"",analysis:"Anyharminasking has yet to break his duck over fences but the form book suggests his turn is very near indeed. His early chasing efforts came in stronger company than this, and he shaped with abundant promise when second on his chasing debut before catching the eye again at Warwick over this trip. The handicapper has given him a genuine opportunity, dropping him to a mark that looks very workable on the basis of his hurdles rating alone. The form received a boost when subsequent events confirmed the depth of those earlier contests, and with conditions ideal, he should go very close."}],doubles:"",antePost:""},
{id:"19d4327f43fbe2eb",originalSubject:"Bet Sage - 31st March",from:"BetHub <tips@bethub.pro>",author:"Bet Sage",emailDate:"2026-03-31T09:09:44Z",tipDate:"2026-03-31",processedAt:"2026-03-31T14:21:36Z",originalBody:"BET SAGE\n\nBangor 4.20 - Streamsforth Lad - 1 point e/w at 8/1 (Skybet - 4 places)\nStreamsforth Lad has a bit of a risky profile but there was plenty to like about his latest effort before coming down when moving into contention. He was travelling best at the time and that form has been boosted since, suggesting he would have gone very close. Now off a reduced mark in what looks a weak race, this is a good opportunity if he can put in a clean round. The ability is there and he should be bang there if jumping holds up.\n\nBET SAGE",originalHtml:"<p><span style=\"font-size: 16px;\">BET SAGE</span></p>\n<p>Bangor 4.20 – Streamsforth Lad – 1 point e/w at 8/1 (Skybet – 4 places)<br />\nStreamsforth Lad has a bit of a risky profile but there was plenty to like about his latest effort before coming down when moving into contention. He was travelling best at the time and that form has been boosted since, suggesting he would have gone very close. Now off a reduced mark in what looks a weak race, this is a good opportunity if he can put in a clean round. The ability is there and he should be bang there if jumping holds up.</p>\n<p>BET SAGE</p>",selections:[{race:"Bangor 4.20",horse:"Streamsforth Lad",odds:"8/1",stake:"1 point e/w (4 places)",category:"",analysis:"Streamsforth Lad carries a somewhat risky profile but there was plenty to like about his latest effort before coming down when moving into a challenging position at the business end of a competitive contest. He was travelling best of all at the time and that form has been boosted since, suggesting he would have gone very close had he stood up. Now operating off a reduced mark in what looks a distinctly weak renewal, this represents a golden opportunity if he can put in a clean round of jumping. The raw ability is clearly there and the market is giving him every chance."}],doubles:"",antePost:""},
{id:"19d4320c5307f01d",originalSubject:"BetSeven - 31st March",from:"BetSeven <info@betseven.co.uk>",author:"BetSeven",emailDate:"2026-03-31T09:01:54Z",tipDate:"2026-03-31",processedAt:"2026-03-31T12:00:00Z",originalBody:"BETSEVEN\n\nBangor 2.45 - Golden Prince - 0.75 point e/w at 11/1 (888sport, Skybet, Paddy - 3 places)\nGolden Prince makes considerable appeal on his handicap debut off a mark of 100 that looks potentially lenient given the quality of his sole point-to-point effort. The form of that run, where he finished third to Taurus Bay and Marsiac, now rated 135 and 127 over hurdles respectively, has worked out exceptionally well. The step up to 2m7f looks sure to suit a horse who shaped as a thorough stayer in that point, and the Christian Williams yard is firing on all cylinders with three winners from the last 14 runners. A faster surface should unlock further improvement from this unexposed five-year-old.\n\nBangor 3.50 - The Good Doctor - 0.75 point e/w at 10/1 (Skybet - 4 places)\nThe Good Doctor merits another chance on significantly improved ground at Bangor, conditions far more suitable than those he encountered on his latest outing. He travelled with considerable purpose at Warwick before the demands of forcing the pace took their toll in the closing stages. His earlier Leicester effort confirmed latent ability and he now tumbles to a more lenient mark. With the yard firing on all cylinders and a more restrained tactical approach anticipated, he possesses the requisite tools to dominate from the front. Don't say you weren't warned.\n\nChris Howard\nBetSeven",originalHtml:"",selections:[{race:"Bangor 2.45",horse:"Golden Prince",odds:"11/1",stake:"0.75 points e/w (3 places)",category:"",analysis:"Golden Prince looks an exciting recruit on his handicap debut off a mark of 100 that could significantly underestimate his ability. The form of his sole point-to-point outing, where he finished third to Taurus Bay and Marsiac, now rated 135 and 127 respectively over hurdles, has worked out in spectacular fashion. The step up to two miles seven furlongs looks certain to unlock further improvement from a horse who shaped as a thorough stayer that day. The Christian Williams yard continues in excellent form and this unexposed five-year-old can outrun his price."},{race:"Bangor 3.50",horse:"The Good Doctor",odds:"10/1",stake:"0.75 points e/w (4 places)",category:"",analysis:"The Good Doctor is one to take seriously on significantly improved ground at Bangor, conditions far removed from those he encountered on his latest outing. He travelled with considerable purpose at Warwick before the demands of forcing the pace took their toll in the closing stages, and the Leicester effort beforehand confirmed the ability is very much there. He now tumbles to a more competitive mark and the yard is operating at a high level. A more restrained tactical approach could see him dominate proceedings. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d431c6f3fcff44",originalSubject:"Snowy - 31st March",from:"Snowy (via Rob)",author:"Snowy",emailDate:"2026-03-31T08:57:06Z",tipDate:"2026-03-31",processedAt:"2026-03-31T11:00:00Z",originalBody:"I have just 1 selection for you at BANGOR, these are my views on that and the rest of today's cards.\n\nDan and Harry Skelton are having a fantastic season, they continue in form and have 4 good opportunities at BANGOR today. Since joining them from Ireland earlier this season, Coumeenoole (3/1) has shown little in 4 outings for them, but he's back on a surface that suits, he looks well treated on his best form in Ireland and I expect a good effort from him in the Class 4 H'cap Hurdle (2m7f) at 2.45. Jollie Dame (13/2) has a chance in the Mares Novice Hurdle (2m) at 3.15, but I would expect their runner Service Minimum (13/8) to at least go close in the lucky last. She may not have things her own way though in that Class 5 Mares H'cap Hurdle (2m3f) at 4.50, I think Roaring Home (10/3) will give her a race.\n\nLike Coumeenoole, Palamon has shown very little in 4 outings for Dan Skelton, but his previous Irish form would give him a chance. I was expecting him to be e/w value in the 10 runner, Class 4 H'cap Chase (2m4f) at 3.50, but you had to be quick to grab any value in his price yesterday (15/2, with 2 books, quickly became 9/4, now back out to 4/1). He's been beaten 24 lengths or more in 4 outings for Skelton (another one of his just practicing) and his price has ranged from 14/1 to 50/1. Whilst I like his chance, he does not represent great value, there are several options against him, the likes of Bleu d'Enfer, Busty Boy, Rule Me In, The Good Doctor, Nativehill and Kahavari each have their claims, but I'm backing the O'Neill trained 9yo ANYHARMINASKING e/w.\n\nThis lad was a pretty capable hurdler (won 3 from 21, placed 6), but is still winless at this discipline, however, he's only ran 4 times, either the trip, ground or competition hasn't been right, they look perfectly suitable this time. He was a sound enough 2nd to a 130 rated rival on his chase debut over 2m on good ground in June last year, rain (he gave winner 1lb), track and soft ground didn't suit him then at Cartmel, he gave an odds on Skelton runner a scare over this trip in a Class 3 contest at Warwick next time, then following a winter break (136 days), he shaped encouragingly on ground too slow at Haydock last month (20 lengths 6th of 11, weakened at last). Although he was beaten 20 lengths 7th of 11, he was far from disgraced back over hurdles at Stratford last time, soft ground and 2 miles around that track wasn't for him. He must have decent ground and I feel he now needs this kind of trip, the handicapper has given him a real chance dropping him to 119 (was 127 fences, has been 137 hurdles), with conditions suiting, he makes most e/w appeal.\n\nGood Work could go close in the Class 5 H'cap Chase (3m) at 4.20, I thought about making him an e/w selection, he's certainly well enough treated, but his jumping can be a little erratic and his record over fences is not very good (1 win from 34, placed 17 times). Felton Bellevue is another e/w option in that contest, but he has his quirks, can be a touch moody and isn't the easiest to predict. Whilst the card at Newcastle is quite competitive, it does include a number of modest Class 5 contests (3.30, 4.30, 5.00 and 5.35), I don't have any views on those or the Class 4 H'cap Hurdle at 2.30 as well. The feature Class 3 H'cap Hurdle (2m4f) at 4.00 isn't a bad contest, but there are only 6 runners and it's quite a trappy affair. Smokeringinthedark and Fingal's Hill are probably the main players, but if I was to bet in this race, it would be either Rare Edition or Bold Light. I don't fancy flicking a coin between that pair, as I'm bound to make the wrong choice.\n\nBet recap\n\nBANGOR\n3.50 - ANYHARMINASKING (5/10 e/w) 8/1 (2.5pts W, 2.5pts Pl)\n\nSnowy",originalHtml:"",selections:[{race:"Bangor 3.50",horse:"Anyharminasking",odds:"8/1",stake:"2.5 points e/w",category:"",analysis:"Anyharminasking represents the shrewdest play on a card where Dan Skelton's string dominates the entries but offers precious little value. A capable hurdler in his previous life with three wins and six placings from 21 starts, he remains winless over fences after just four attempts, though the excuses have been legitimate on each occasion. A creditable second on chase debut to a 130-rated rival over an inadequate two miles gave early encouragement, and he caught the eye when pressing an odds-on Skelton runner over this trip in Class 3 company at Warwick. The handicapper has shown considerable leniency, dropping him to a mark of 119 having previously operated off 127 over fences and as high as 137 over timber. The ground, the trip and the track all align in his favour for the first time. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d431be7f176c83",originalSubject:"Will Lattimore - 31st March",from:"Will Lattimore (via Rob)",author:"Will Lattimore",emailDate:"2026-03-31T08:56:30Z",tipDate:"2026-03-31",processedAt:"2026-03-31T11:00:00Z",originalBody:"0.75pts win Say What You See (SP ADVISED) 4.05 Doncaster\n\n1pt e/way Hard Dealt (4/1 Generally 3-Places) 4.15 Ascot\n\n1pt e/way Irish Nectar (14/1 5-Places Generally) 5.15 Doncaster\n\n0.75pts e/way Dramactic Encore (6/1 Generally 3-Places) 5.25 Doncaster\n\nWill Lattimore.",originalHtml:"",selections:[{race:"Doncaster 4.05",horse:"Say What You See",odds:"SP",stake:"0.75 points win",category:"",analysis:""},{race:"Ascot 4.15",horse:"Hard Dealt",odds:"4/1",stake:"1 point e/w (3 places)",category:"",analysis:""},{race:"Doncaster 5.15",horse:"Irish Nectar",odds:"14/1",stake:"1 point e/w (5 places)",category:"",analysis:""},{race:"Doncaster 5.25",horse:"Dramactic Encore",odds:"6/1",stake:"0.75 points e/w (3 places)",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d431b83965ad2d",originalSubject:"Declan Phelan - 31st March",from:"Declan Phelan (via Rob)",author:"Declan Phelan",emailDate:"2026-03-31T08:56:06Z",tipDate:"2026-03-29",processedAt:"2026-03-31T11:00:00Z",originalBody:"Daily Report Sunday 29th March\n\nDownpatrick\n\n5.30\n\nMagic Sadler is entitled to be the warm favourite if one takes into account his super point record which is leagues above his rivals. He has amassed nine points wins in recent campaigns, five in the current one, all at Open level, the most recent at the beginning of the month from the front at Lismore. For whatever reason, he does appear to be jinxed in hunter chases. Aside from an honest second in one at Clonmel in January, he failed to take advantage of basic open goals twice at Thurles in maiden hunters, losing the jockey at the first in one and worryingly bursting and pulling up in another. The form is in the book to score, at evens I look elsewhere.\n\nWest Of Idaho trades as third favourite. Busy this winter, his form was regressive before Christmas. He has managed to pick up two races at Tyrella in 2026, shedding his maiden tag at the end of January and earlier in the month he made very heavy weather of winning a weak winners race. Said victory was on good ground and I gather he was sore for more than a week post race. I want to be firmly against him, and he rates almost maximum lay material in the win market and at short odds, there is juice to be extracted opposing him in the place market or even in match bets.\n\nYewtree Hill joined the Cian Collins stable during last summer and has acquitted himself with distinction of late. He has won points either side of Christmas and was a creditable 4th in Hunter Chase company to Cons Roc in November. He was placed in a similar C&D hunter chase last May and will be fighting for a top 3 or 4 finish.\n\nCause For Comment was due to run at Down Royal on March 17th but was a late scratching as the ground was deemed too quick. In the preview for said race, I mentioned the Mullins home bred had shaped with promise during 2025 in points and hunter chases. Returning to action for a maiden point at Punchestown in February, he togged out a much stronger model and duly won his race with loads in hand. In 2025 as a rather raw individual he was caught in the dying strides in the corresponding hunter chase by a stablemate. That outing has bestowed upon him valuable track experience.\n\nPatrick Mullins has been seeking out a candidate to fill his hunter chase void left by the retirement of Billaway. Although a slow burn, Cause For Comment could be the ticket if he continues his steady rate of progression. He ought to be capable of winning a couple of hunter chases this spring if placed astutely.\n\nI had the race down as coin toss between Cause For Comment and Magic Sadler. The former is too big a price at 7/4 on the outright, alternatively, the offering of 10/11 without Magic is more than sufficient for those more cautious. I can imagine Mullins making the running and gradually inflicting pain on his rivals in the closing mile.\n\nDeclan P",originalHtml:"",selections:[{race:"Downpatrick 5.30",horse:"Cause For Comment",odds:"7/4",stake:"1 point win",category:"",analysis:"Cause For Comment has been the subject of a patient campaign from the Mullins team, and this could be where the plan comes to fruition. A homebred who shaped with promise throughout 2025 in points and hunter chases, he returned from a break to demolish a maiden point field at Punchestown in February, looking a transformed model. The fact he was scratched from Down Royal on March 17th due to quick ground tells you connections know exactly what they want underfoot. Previous track experience here is a significant asset, having been caught only in the dying strides of the corresponding hunter chase last season by a stablemate. Patrick Mullins continues to seek a successor to the retired Billaway in the hunter chase division. This progressive sort looks the type to fill that void handsomely."}],doubles:"",antePost:""},
{id:"19d4309c92db11bd",originalSubject:"From The Stables - 31/03/2026",from:"From The Stables",author:"From The Stables",emailDate:"2026-03-31T08:36:44Z",tipDate:"2026-03-31",processedAt:"2026-03-31T09:30:00Z",originalBody:"Tuesday, 31st March, 2026\n\nTODAY'S FEATURED STABLES\nB Pauling, C Longsdon, D Cunha, FM O'Brien, J Portman, N Richards, O Sangster, T Clover\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS FROM TODAY'S RUNNERS\n\nTONY'S NAP\n2.30 Newcastle: Chemoulin\nChemoulin may have been lucky to win last time, but Charlie's lightly-raced type also seems fortunate to have been given a nice opening rating. The two that finished behind him both had higher marks than his 109 and he'll love the track and trip.\n\nTONY'S NEXT BEST\n4.50 Bangor: Eastern Shores\nEastern Shores has been consistent, finishing around seven lengths behind the winner in her last three starts. The extra distance can hold the key for Fergal's mare.\n\nTONY'S TREBLE\n5.30 Wolverhampton: Overbudget\nAt 125k, Overbudget probably was just that for her owners. She's quick though and I take her to prove the better of Dylan's two speedsters here.\n\nTODAY'S FTS RUNNERS\n\n2.15 Bangor - Molly's Lad (5/2)\nTrainer: \"Molly's Lad is a lovely horse who has posted two good hurdles efforts in similar events. He has been beaten by decent sorts each time and could well have bumped into another here in the Henderson runner. He has a penalty though and we're clearly best of the rest.\"\n\n2.15 Bangor - Pippin's Legend (40/1)\nTrainer: \"Pippin's Legend showed promise in a bumper and again 1st time over hurdles but then stopped quickly last time and we've given him a wind-op since. This looks a tough examination even if the surgery works as intended.\"\n\n2.30 Newcastle - Chemoulin (9/4)\nTrainer: \"Chemoulin may well have been a lucky winner as the leader was a long way clear at Haydock when falling two out. Our boy did well though to get up and win from being a few lengths behind the eventual runner-up and this stiff track should be to his liking.\"\n\n2.30 Newcastle - Jehol De Thaix (5/2)\nTrainer: \"Jehol De Thaix ran a nice race at Haydock. If he puts in a repetition of that he shouldn't be far away in this company.\"\n\n3.15 Bangor - Highland Haven (5/1)\nTrainer: \"Highland Haven was a good bumper mare and she has the raw ability to win a race of this nature. She hasn't been straightforward though in two runs over hurdles and is returning from a break. Will be winning soon if not today.\"\n\n3.50 Bangor - The Good Doctor (11/1)\nTrainer: \"The Good Doctor ran very well on his comeback at Sandown in November, but has been disappointing in both outings since. Freshened up for today, he would have an each-way chance if recapturing his best form.\"\n\n3.50 Bangor - Nativehill (6/1)\nTrainer: \"Nativehill has his first run for the yard. It hasn't been plain sailing getting him here as the long absence would suggest. A lovely horse though but maybe a watching brief for today.\"\n\n4.00 Newcastle - Rare Edition (9/1)\nTrainer: \"Rare Edition has been coming down the weights but his form has dropped off alarmingly after a promising comeback at Kelso in the autumn. Needs to find his old swagger if he can arrest the decline.\"\n\n4.00 Newcastle - Smokeringinthedark (6/4)\nTrainer: \"Smokeringinthedark got completely stuck in the mud at Doncaster last time. Now on better ground which will be much more to his liking he can go well on a track that he should enjoy too.\"\n\n4.50 Bangor - Eastern Shores (5/1)\nTrainer: \"Eastern Shore has been a work in progress. The step up in trip should suit and while there's plenty of dangers, we're expecting a very good run.\"\n\n5.30 Wolverhampton - Overbudget (13/8)\nTrainer: \"Our two girls dominate the market on this 3yo fillies' maiden and it might be close between them. Overbudget has the better draw and showed speed in both her starts when finishing 2nd on good to soft last October. Hollie is very good at the gate and will give her every chance.\"\n\n5.30 Wolverhampton - Skip To Victory (6/5)\nTrainer: \"Skip To Victory is hard fit after three runs already this year over at Southwell and she too is fast. Whether she has the class of her stablemate is the issue. We'll find out.\"\n\n5.30 Wolverhampton - Zoulette (16/1)\nTrainer: \"Zoulette is a nice filly by Zoustar but she's been slow to come to hand. She'll probably find the two Dylan Cunha runners going too fast for her.\"\n\n6.00 Wolverhampton - Ammoony (7/1)\nTrainer: \"Ammoony wasn't right after her last race at Leicester which arguably she should have won. It's a trappy four-runner race and although she's one of the two outsiders, she isn't out of it by any means.\"\n\n7.00 Wolverhampton - Bizou (6/1)\nTrainer: \"Bizou had lots of issues last year when everything went wrong. Now on a reasonable mark, she hopefully has an each-way chance although if the problems recur, she could easily be tailed off! Fingers crossed they don't!\"\n\n7.30 Wolverhampton - Artista (12/1)\nTrainer: \"I thought Artista ran quite well from a wide draw first time back over the CD two weeks ago. I'd prefer her to be in a slightly lower grade, but she does have an each-way chance here.\"\n\n8.00 Wolverhampton - Tuba (15/8)\nTrainer: \"Tuba has generally been very consistent since being switched to the flat. He has won off a lower mark and has not quite managed to get his head in front since. Sure to run well in what looks a modest race.\"\n",originalHtml:"",selections:[{race:"Newcastle 2.30",horse:"Chemoulin",odds:"9/4",stake:"Tony's NAP",category:"NAP",analysis:"Chemoulin may have benefited from fortune when that leader departed at the second last at Haydock, but the manner in which he picked up and overhauled the runner-up from a few lengths adrift told its own story about this lightly-raced novice. The form received a boost when connections identified Newcastle as his next port of call, a stiff, galloping track that should play to every one of his strengths. An opening mark of 109 looks generous when the two horses who chased him home were both rated higher, and Charlie Longsdon's yard continues to fire on all cylinders this spring. Don't say you weren't warned."},{race:"Bangor 4.50",horse:"Eastern Shores",odds:"5/1",stake:"Tony's Next Best",category:"NB",analysis:"Eastern Shores has been a model of consistency without quite getting her head in front, finishing around seven lengths behind the winner in each of her last three outings. The step up to this longer trip looks the key that could unlock her potential, and Fergal O'Brien clearly has this target in mind for a mare who has been crying out for an extra half mile. The form of those placed efforts reads solidly enough against this field, and the booking of a claimer to offset the weight only strengthens the case that connections mean business at this venue."},{race:"Wolverhampton 5.30",horse:"Overbudget",odds:"13/8",stake:"Tony's Treble",category:"",analysis:"Overbudget was a 125,000 guinea purchase who showed plenty of raw speed on both starts as a juvenile, finishing a close second on good to soft ground last October. Dylan Cunha has elected to bring her back on the all-weather where the even surface should allow that natural gate speed to shine, and with Hollie Doyle booked to ensure a sharp break from a favourable draw, the pieces fall neatly into place. The trainer runs a stablemate in Skip To Victory but has made no secret that this is the one they believe possesses the greater class. A taking reappearance looks on the cards."}],doubles:"",antePost:""},
{id:"19d405c995f5c2fc",originalSubject:"Timeform - 31st March",from:"Timeform (via Rob)",author:"Timeform",emailDate:"2026-03-30T20:08:22Z",tipDate:"2026-03-31",processedAt:"2026-03-30T20:13:29Z",originalBody:"Bangor 16:50 - Service Minimum can build on latest promise\n\nService Minimum (Fr)\nJ: Harry Skelton T: Dan Skelton\nF: 12140747\nSBK 7/4\n\nService Minimum, a dual winner in novice hurdles, has been disappointing since going handicapping, though she did shape better than the result would suggest when beaten around five and a half lengths in seventh at Market Rasen last time.\n\nService Minimum could never get competitive after meeting trouble early in the straight when trying to make headway, but she kept on and left the impression that she would have been closer with a clear run.\n\nThat effort earned Service Minimum the 'Horse In Focus' Flag from Timeform's reporter, marking her out as one likely to be of firm interest next time, and she's an especially noteworthy runner in this lower grade and less competitive race. Harry Skelton taking back over in the saddle has also generated Timeform's 'Jockey Uplift' Flag.\n\nRecommended Bet: Back Service Minimum in the 16:50 at Bangor @ 9/4\n\nNewcastle 17:00 - Tyson should benefit from step up in trip\n\nTyson (Ger)\nJ: Tristan Durrell T: Dan Skelton\nF: 0-44889P5\nSBK 11/4\n\nTyson has failed to make an impact in four starts since joining Dan Skelton from Paul Nolan in Ireland, but he shaped with more encouragement when fifth over a sharp two miles at Wincanton last time.\n\nTyson lacked the pace to get competitive but he caught the eye with some good late headway, earning the Horse In Focus Flag and leaving the impression that he would benefit from stepping back up in trip.\n\nHe duly returns to two and a half miles here and looks capable of taking advantage of a mark that has fallen 9 lb since he joined Skelton.\n\nRecommended Bet: Back Tyson in the 17:00 at Newcastle @ 7/2\n\nWolverhampton 18:30 - Sectionals suggest Habrdi's latest effort can be upgraded\n\nHabrdi (Ire)\nJ: James Sullivan T: Ruth Carr\nF: 000-43914\nSBK 5/1\n\nHabrdi was only fourth at Southwell last time when bidding to follow up a win over this course and distance eight days earlier. However, he shaped well at Southwell in a race that wasn't run to suit and he should be treated as if still in top form.\n\nHabrdi was held up off the pace, just as he had been when successful in a smaller field at Wolverhampton, but he was caught further back than ideal and despite sticking to his task couldn't overhaul a trio who raced handily.\n\nThat eye-catching effort earned Habrdi the Horse In Focus Flag, and sectional times back up the view that he shaped better than the bare result, earning a sectional upgrade 7 lb higher than any of the first trio home.\n\nRecommended Bet: Back Habrdi in the 18:30 at Wolverhampton @ 4/1",originalHtml:"",selections:[{race:"Bangor 4.50",horse:"Service Minimum",odds:"9/4",stake:"1 point win",category:"",analysis:"Service Minimum has been a shade disappointing in handicap hurdles but shaped much better than the bare result when seventh at Market Rasen last time. She met trouble early in the straight and kept on in a manner that suggested a clear run would have seen her finish much closer to the principals. That effort earned the Horse In Focus flag and she looks particularly well placed dropping into this lower grade. Harry Skelton resuming in the saddle adds further conviction."},{race:"Newcastle 5.00",horse:"Tyson",odds:"7/2",stake:"1 point win",category:"",analysis:"Tyson has been struggling since joining Dan Skelton from Paul Nolan but offered significant encouragement when fifth over an inadequate two miles at Wincanton last time. He lacked the speed to get competitive over that sharp trip but caught the eye with some strong late headway, leaving the clear impression that he wants every yard of this longer distance. A mark that has tumbled 9 lb since arriving at the yard gives him every chance of rewarding the patience shown."},{race:"Wolverhampton 6.30",horse:"Habrdi",odds:"4/1",stake:"1 point win",category:"",analysis:"Habrdi was only fourth at Southwell last time but shaped considerably better than the finishing position. Held up off the pace in a race not run to suit, he was caught further back than ideal and despite sticking to his task could not peg back a trio who raced prominently throughout. Sectional analysis supports this reading, with Habrdi earning an upgrade 7 lb higher than any of the first three home. He returns to his winning course and distance here and should be treated as if still in top form."}],doubles:"",antePost:""},
{id:"19d404d4ef90d595",originalSubject:"Robbie Wilders - 31st March",from:"Robbie Wilders (via Rob)",author:"Robbie Wilders",emailDate:"2026-03-30T19:51:37Z",tipDate:"2026-03-31",processedAt:"2026-03-30T20:06:14.069Z",originalBody:"Robbie Wilders' best bets from across the Tuesday cards\n\nGolden Prince\n2.45 Bangor\n1pt win\n\nThe Scorpion King\n4.20 Bangor\n1pt win\n\nService Minimum\n4.50 Bangor\n1pt win\n\nIt is always worth paying attention to when Christian Williams hits form and the trainer appears to be gearing up for a big spring. Williams has saddled three winners and three seconds from his past 14 runners and all three of his representatives at Bangor have chances.\n\nGolden Prince looks the most interesting of them in the 2m7f handicap hurdle (2.45) and gives the impression he can leave previous efforts well behind. The five-year-old returns from a 64-day break after he was never really a factor in three novice hurdles over trips around 2m. That was never going to be his game and he looks well treated off an opening mark of 100 based on the form of his sole point-to-point start 13 months ago. My selection was third to Taurus Bay and Marsiac, who are now rated 135 and 127 over hurdles, while back in fourth was the 112-rated Cavalier du Luy. Golden Prince looked a dour stayer in his point and gets the chance to prove his stamina under rules over an extra 7f. With his yard going great guns and the switch to a faster surface likely to unlock some improvement, Golden Prince can show what he's made of.\n\nI wouldn't put anyone off Parliamo either. The Mel Rowley-trained six-year-old has been plying his trade over shorter trips as well and is a brother to Iron Bridge, so staying is sure to be his game.\n\nIt would come as little surprise if the Williams-trained Three Zambezi's bounced back to form following 48 days off in the 3m handicap chase (4.20) later at Bangor. He is yet to run over this distance under rules and may benefit for it, but preference is for proven stayer The Scorpion King. Oliver Signy has had a quiet season, but we often see the best of his horses at this time of year and The Scorpion King's recent staying-on third at Exeter suggested he was coming back to himself. The eight-year-old was in a good place at the end of 2024, finishing second to the thrown-in Aworkinprogress at Stratford before winning two staying handicap chases at Ffos Las. His last win came under the excellent Ben Jones, who is back aboard for the first time since and has a good record when riding for Signy (27 per cent, +11.38 level-stakes profit). Despite The Scorpion King's recent resurgence at Exeter, the handicapper has eased him another 3lb and that puts him 4lb below his previous winning mark. He may prove too classy for these.\n\nThe final wager is Service Minimum in the 2m3.5f mares' handicap hurdle (4.50) on the same card. The topweight is one of Dan Skelton's lesser lights, but she's more than capable at this level and I suspect we'll see a better performance on her first start in a 0-105 handicap with Harry Skelton taking over in the saddle. She may have only been seventh at Market Rasen last time, but it paid to be up with the pace in that much stronger contest and she recorded the fastest closing sectional, having been held up under Tristan Durrell. Service Minimum's Racing Post Ratings have been on the rise in 2026 despite her BHA mark dropping and this could be the time to catch her with the return to a sound surface in her favour. If would be a surprise if she left the season behind without a win for her top team.",originalHtml:"",selections:[{race:"Bangor 2.45",horse:"Golden Prince",odds:"TBC",stake:"1 point win",category:"",analysis:"Golden Prince makes considerable appeal on his handicap debut off a mark of 100 that looks potentially lenient given the quality of his sole point-to-point effort. The form of that run, where he finished third to Taurus Bay and Marsiac, now rated 135 and 127 over hurdles respectively, has worked out exceptionally well. The step up to 2m7f looks sure to suit a horse who shaped as a thorough stayer in that point, and the Christian Williams yard is firing on all cylinders with three winners from the last 14 runners. A faster surface should unlock further improvement from this unexposed five-year-old."},{race:"Bangor 4.20",horse:"The Scorpion King",odds:"TBC",stake:"1 point win",category:"",analysis:"The Scorpion King has been gradually working his way back to form and that staying-on third at Exeter served as a timely reminder of what this horse can produce. Oliver Signy's runners traditionally peak during the spring months, a pattern that holds true season after season. The return of Ben Jones to the saddle is particularly significant given his outstanding 27 per cent strike rate when riding for the yard. Now 4lb below his last winning mark following another ease from the handicapper, the conditions look tailor-made for a bold showing over this stamina-testing trip."},{race:"Bangor 4.50",horse:"Service Minimum",odds:"TBC",stake:"1 point win",category:"",analysis:"Service Minimum drops into a 0-105 contest for the first time and the booking of Harry Skelton to replace Tristan Durrell speaks volumes about connections' intentions. The closing sectional analysis from Market Rasen reveals she was the fastest finisher in a race where prominent runners dominated throughout. Her Racing Post Ratings have been trending upward in 2026 even as the handicapper has relented, creating a scenario where she could be significantly ahead of her mark. The return to a sound surface further enhances her claims in what looks a winnable assignment."}],doubles:"",antePost:""},
{id:"19d404cccba32793",originalSubject:"Dennis Harney (Racing Post) - 31st March",from:"Denis Harney (via Rob)",author:"Denis Harney",emailDate:"2026-03-30T19:51:05Z",tipDate:"2026-03-31",processedAt:"2026-03-30T20:06:14.069Z",originalBody:"Denis Harney has two tips at Limerick\n\nThisain'tthat\n5.10 Limerick\n2pts win\n\nSophia Rose\n6.12 Limerick\n1pt win\n\nThisain'tthat is right on the border of being too good for the 2m maiden hurdle at Limerick (5.10). The Mark Molloy-trained six-year-old runs in a contest restricted to horses who have finished outside the top four in their races, and has filled the fifth spot in his two starts. His debut effort was his best when 13 and a half lengths behind the winner and beaten by some decent prospects trained by Willie Mullins and Gordon Elliott. He recorded a Racing Post Rating of 109, which is the best on offer in this race. Upped to 2m4f last time back at Punchestown, the trip probably stretched him at this stage of his career when beaten 26 lengths, but he didn't disgrace himself and the third has won comfortably since.\n\nSophia Rose was wonderfully consistent until a blip last time and she is worth another chance in the 2m3.5f handicap chase (6.12). She was placed in three of her first four runs over fences and ran solid races in two handicap chases, including at Limerick when fourth over an extended 2m1f. She went to Punchestown following that effort and filled the runner-up spot, pressing the leader at two out before the 2m6f trip stretched her stamina. There were excuses for her failure to finish at Navan last month as she was found to have lost a shoe and was also blowing hard post-race. The first-time cheekpieces tried that day have now been discarded. A return to her earlier level of form would see Sophia Rose firmly in contention and she is fancied to get back on track.",originalHtml:"",selections:[{race:"Limerick 5.10",horse:"Thisain'tthat",odds:"TBC",stake:"2 points win",category:"",analysis:"Thisain'tthat looks primed to shed his maiden tag in this restricted contest at Limerick where his Racing Post Rating of 109, earned when fifth on debut behind some high-class Willie Mullins and Gordon Elliott prospects, stands head and shoulders above the opposition. The drop back to two miles looks a shrewd tactical move by connections after the stamina demands of 2m4f proved beyond him at Punchestown last time. The form behind the winner that day has been franked by the third winning comfortably since, lending further substance to this horse's claims. The step forward from that initial experience should prove decisive."},{race:"Limerick 6.12",horse:"Sophia Rose",odds:"TBC",stake:"1 point win",category:"",analysis:"Sophia Rose has valid excuses for her Navan disappointment, where she was found to have lost a shoe and returned blowing hard post-race. Prior to that setback she had been the model of consistency, placing in three of her first four starts over fences including a creditable runner-up effort at Punchestown where only the stamina demands of 2m6f found her out. The return to 2m3f looks ideal for this mare, and the decision to remove the cheekpieces suggests connections are content to let her natural ability carry the day. A return to her earlier form puts her right in the mix."}],doubles:"",antePost:""},
{id:"19d40497307b4fe3",originalSubject:"Giglio - 31st March",from:"Rob",author:"Giglio",emailDate:"2026-03-30T19:47:25Z",tipDate:"2026-03-31",processedAt:"2026-03-30T20:06:14.069Z",originalBody:"Wolves 5.30 - Skip To Victory (10/11)\nWolves 6.30 - Farasi Lane (5/4)\nWolves 6.30 - He's A Gentleman (8/1)\nWolves 6.30 - Al Muqdad (11/1)\nWolves 7.00 - Danehill Star (11/4)\nWolves 7.00 - Bizou (11/1)\nWolves 7.00 - Tiger Beetle (9/1)\nWolves 8.00 - Three Yorkshireman (22/1)\nWolves 8.30 - Jane Of The Jungle (3/1)",originalHtml:"",selections:[{race:"Wolverhampton 5.30",horse:"Skip To Victory",odds:"10/11",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 6.30",horse:"Farasi Lane",odds:"5/4",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 6.30",horse:"He's A Gentleman",odds:"8/1",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 6.30",horse:"Al Muqdad",odds:"11/1",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 7.00",horse:"Danehill Star",odds:"11/4",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 7.00",horse:"Bizou",odds:"11/1",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 7.00",horse:"Tiger Beetle",odds:"9/1",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 8.00",horse:"Three Yorkshireman",odds:"22/1",stake:"1 point win",category:"",analysis:""},{race:"Wolverhampton 8.30",horse:"Jane Of The Jungle",odds:"3/1",stake:"1 point win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d404a5262246bf",originalSubject:"Boom - 31st March",from:"Boom Doctor (via Rob)",author:"Boom Doctor",emailDate:"2026-03-30T19:48:21Z",tipDate:"2026-03-31",processedAt:"2026-03-30T19:51:25Z",originalBody:"Wolverhampton 7.00 - The Pug - 0.75 point e/w at 12/1 (Bet365 - 4 places)\n\nThe Pug is not the most reliable but he does have the ability to be competitive at this level when things fall right. His recent fourth at Newcastle came in a stronger race over a slightly longer trip and that effort suggests he is capable of being involved here. He has also run well over this course and distance in the past and is now on a very workable mark. With most of his wins coming on the all weather and in weaker company, this looks the sort of race where he can outrun his price.",originalHtml:"",selections:[{race:"Wolverhampton 7.00",horse:"The Pug",odds:"12/1",stake:"0.75 points e/w (4 places)",category:"",analysis:"The Pug may not be the most consistent performer in training but there is undeniable ability lurking within this profile when circumstances conspire in his favour. A recent fourth at Newcastle in a race of stronger calibre over a slightly extended trip confirmed he retains the capacity to compete at this level, and the return to a more suitable course and distance combination looks a shrewd tactical move. Now operating from a very workable handicap mark with a proven affinity for artificial surfaces and contests of this nature, the suspicion remains that he can outperform market expectations. Those prepared to take the each-way price may find themselves handsomely rewarded."}],doubles:"",antePost:""},
{id:"19d3fb21539ca066",originalSubject:"New Horse Racing Tip",from:"Ben from The Racing Analyst <contact@theracinganalyst.com>",author:"Ben",emailDate:"2026-03-30T17:02:05Z",tipDate:"2026-03-31",processedAt:"2026-03-30T19:47:50.142Z",originalBody:"31ST MARCH 2026\n\nI said last night that RUM DIAMOND had absolutely no form to recommend him on and he possibly ran as you'd expect. However, on return, he looked very rusty and he certainly would be one to follow now he's had a run. Fallon wasn't very hard on him either, suggesting he was there for no more than to get a run under his belt this season and the drift suggested the same.\n\nWITH NO TIPS TOMORROW, THAT IS US DONE FOR MARCH. IT'S BEEN ANOTHER EXCELLENT MONTH, LANDING A FAIR FEW DOUBLES THROUGHOUT AND STACKS OF PROFIT.\n\nThis great run since the start of November will have to come to an end at some point and April, with the flat season starting and the jumps ending, is always a tough one.\n\nBecause of that it will be a month that I'll only be tipping if there are bets worthy of getting involved, and fewer bets than normal. I get so many moans for taking a couple of days off every week, but the results have proven its a strategy worth sticking with and I'll not be pressured into changing that.\n\nWell done on the month that has been, good luck with the next...\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst\n\nANTE POST ALREADY ADVISED\nThe bets below are our Ante-Post book, so far...\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN",originalHtml:"",selections:[{race:"Lincoln Handicap (Ante-Post)",horse:"Eternal Force",odds:"10/1",stake:"1 point win",category:"",analysis:"Eternal Force represents a shrewd ante-post play in the Lincoln Handicap, a race that has long rewarded those willing to take an early position. The selection was advised on March 28th and the price of 10/1 reflected genuine each-way value in a race where progressive types from the all-weather frequently make their mark. Those who followed the advice will be watching developments with quiet confidence as the race approaches."},{race:"Grand National (Ante-Post)",horse:"Captain Cody",odds:"25/1",stake:"1 point win",category:"",analysis:"Captain Cody at 25/1 for the Grand National is the kind of speculative ante-post wager that can yield handsome returns. The selection forms part of a carefully curated ante-post portfolio that has been building throughout the season. With the Aintree showpiece approaching on April 11th, the groundwork has been laid and the hope remains that this bold stayer can reward the patience shown in taking an early price."}],doubles:"",antePost:"Lincoln Handicap - Eternal Force 10/1 1pt win (advised 28th March)\nGrand National - Captain Cody 25/1 1pt win (advised for 11th April)"},
{id:"19d3f613ce9b2f47",originalSubject:"GM - 30th March",from:"The Inside Rail <info@theinsiderail.co.uk>",author:"GM",emailDate:"2026-03-30T15:33:50Z",tipDate:"2026-03-30",processedAt:"2026-03-30T16:36:46Z",originalBody:"Yesterday Review\n\nTowcester\nThe Other Chief ran poorly and finished fourth of four runners. My bet fell foul of a dreaded non runner in his race which meant we got 13/8 instead of early 3/1 that was advised. No matter what I always advise to cash out if you can when we have a non runner in a race. The whole race make-up changes from what you original worked out. In this case it was already a five dog race and became a four dog race.\n\nNothing much appeals at Nottingham for bets this evening. The opens are of a poor standard but the maiden final at 8.01 is of interest. Hasslebomb ran well without a look round last week in the heats and with normal improvement for that look can go close to winning this evening.\n\nTonight's Bet\nNottingham 8.01 Hasslebomb 1.5 points win @ 4/1 Bet 365",originalHtml:"",selections:[{race:"Nottingham 8.01",horse:"Hasslebomb",odds:"4/1",stake:"1.5 points win",category:"",analysis:"Hasslebomb shaped with considerable promise when running without being asked a serious question in last week's maiden heats, finishing with plenty left in reserve. The step up to the final represents a natural progression and, with the improvement that typically accompanies a second competitive outing, this one looks set to take a good deal of beating. The overall quality of the open races on this Nottingham card leaves much to be desired, but this maiden final stands out as the event of the evening. The form received a boost from how strongly the selection travelled without coming under any real pressure. Don't say you weren't warned."}],doubles:"",antePost:""},

{id:"19d3f378d9f093f1",originalSubject:"S Harris - 31st March",from:"Stephen Harris (via Rob)",author:"Stephen Harris",emailDate:"2026-03-30T14:48:15Z",tipDate:"2026-03-31",processedAt:"2026-03-30T14:49:55Z",originalBody:"Bangor 3.50 - The Good Doctor - 1 point win at TBC\n\nThe Good Doctor gets one final chance here on much better ground which should suit far more than the conditions he faced last time. He travelled strongly for a long way at Warwick before fading after forcing the pace, and that effort is easy enough to forgive. His earlier run at Leicester suggested there is still ability there and he is now dropping to a more workable mark. With the yard in form and a more controlled ride likely, he has the tools to make all if settling into a better rhythm.\n\nBangor 4.20 - Streamsforthlad - 1 point win at TBC\n\nStreamsforthlad is risky given his recent record but there was plenty to like about his latest effort before coming down two out when moving into contention. He was travelling best at the time and looked set to play a major role, with that form already boosted since. Now off a low mark and in a weak race, this looks a good opportunity if he can put in a clean round of jumping. If doing so, he has the ability to finally get off the mark.",originalHtml:"",selections:[{race:"Bangor 3.50",horse:"The Good Doctor",odds:"TBC",stake:"1 point win",category:"",analysis:"The Good Doctor merits another chance on significantly improved ground at Bangor, conditions far more suitable than those he encountered on his latest outing. It is worth noting that he travelled with considerable purpose at Warwick before the demands of forcing the pace took their toll in the closing stages. His earlier Leicester effort confirmed latent ability and he now tumbles to a more lenient mark. With the yard firing on all cylinders and a more restrained tactical approach anticipated, he possesses the requisite tools to dominate from the front. Don\u0027t say you weren\u0027t warned."},{race:"Bangor 4.20",horse:"Streamsforthlad",odds:"TBC",stake:"1 point win",category:"",analysis:"Streamsforthlad represents something of a calculated gamble on recent evidence, yet his latest effort before departing two out when moving into a challenging position was full of encouragement. It is worth noting that he was travelling best of all at the time, a run that has since received a significant form boost. Now operating from a reduced mark in what appears a modest contest, this represents an ideal opportunity to shed his maiden tag provided he can navigate his obstacles cleanly. The ability is clearly there for all to see."}],doubles:"",antePost:""},
