{id:"19d3e398e54fcdb0",originalSubject:"Bet Sage - 30th March",from:"BetHub <tips@bethub.pro>",author:"Bet Sage",emailDate:"2026-03-30T10:10:51Z",tipDate:"2026-03-30",processedAt:"2026-03-30T10:20:30Z",originalBody:"BET SAGE\n\nPina Sonata landed us another winner on Saturday to continue the excellent month.\n\nKempton 2.10 - Mehmas Engine - 2 point win at 5/2 (General)\nMehmas Engine was sent off at just 5/6 for her racecourse introduction at Southwell last month, a market position that reveals the esteem in which she is held by the James Tate operation. She was denied a clear passage on that occasion and had to switch a furlong from the finish, yet still kept on gamely to claim third. The step up to six furlongs here at Kempton should unlock significant improvement, and the seven pound weight concession she receives from the market principal Barefoot Beach tilts conditions firmly in her favour.\n\nBET SAGE",originalHtml:"<p><strong>BET SAGE</strong></p>\n<p><strong>Pina Sonata</strong> landed us another winner on Saturday to continue the excellent month.</p>\n<p><strong>Kempton 2.10 – Mehmas Engine – 2 point win at 5/2 (General)</strong><br />\nMehmas Engine was sent off at just 5/6 for her racecourse introduction at Southwell last month, a market position that reveals the esteem in which she is held by the James Tate operation. She was denied a clear passage on that occasion and had to switch a furlong from the finish, yet still kept on gamely to claim third. The step up to six furlongs here at Kempton should unlock significant improvement, and the seven pound weight concession she receives from the market principal Barefoot Beach tilts conditions firmly in her favour.</p>\n<p><strong>BET SAGE</strong></p>",selections:[{race:"Kempton 2.10",horse:"Mehmas Engine",odds:"5/2",stake:"2 points win",category:"",analysis:"Mehmas Engine was sent off at just 5/6 for her racecourse introduction at Southwell last month, a market position that reveals the high regard in which she is held by the James Tate operation. The form received a boost when you consider she was denied a clear passage on that occasion and had to switch a furlong from the finish, yet still kept on gamely to claim third. It is worth noting that the step up to six furlongs here at Kempton should unlock significant improvement, and the seven pound weight concession she receives from the market principal tilts conditions firmly in her favour. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d3e35001d7174f",originalSubject:"Zenith Betting - 30th March",from:"The Inside Rail <info@theinsiderail.co.uk>",author:"Zenith Betting",emailDate:"2026-03-30T10:05:54Z",tipDate:"2026-03-30",processedAt:"2026-03-30T10:20:30Z",originalBody:"ZENITH BETTING\n\nNavan 2.48 - Shaftesbury Avenue - 3 point win at 9/4 (General)\nShaftesbury Avenue showed considerable promise when third of twenty three on debut at the Curragh earlier this month, a run that marked him out as one to follow. Aidan O'Brien operation have an exceptional record with runners on their second start, and Wayne Lordan takes the ride for this mile maiden at Navan. The manner in which he shaped on that initial outing suggested there was plenty more to come.\n\nRegards\nThe Inside Rail",originalHtml:"",selections:[{race:"Navan 2.48",horse:"Shaftesbury Avenue",odds:"9/4",stake:"3 points win",category:"",analysis:"Shaftesbury Avenue shaped with considerable promise when third of twenty three on debut at the Curragh earlier this month, a run full of latent ability that immediately marked him out as one to follow. It is worth noting that the Aidan O'Brien operation boasts an exceptional record with runners stepping out for a second time, and Wayne Lordan taking the ride adds further confidence. The manner in which he travelled and stayed on during that initial outing suggested there is significant improvement to come over this mile trip at Navan. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d3e317ca94c568",originalSubject:"BetSeven - 30th March",from:"BetSeven <info@betseven.co.uk>",author:"BetSeven",emailDate:"2026-03-30T10:02:02Z",tipDate:"2026-03-30",processedAt:"2026-03-30T10:15:00Z",originalBody:"BETSEVEN\n\nLudlow 4.27 - Jack Hyde - 2 point win at 11/4 (Unibet)\n\nJack Hyde posted an excellent second off this very mark at Cheltenham back in November, a performance that confirmed his ability to compete at this level when the mood takes him. His Imperial Cup 9th can be forgiven on the grounds that it was a fiercely competitive handicap hurdle, and this represents a significant drop in grade from that assignment. The form of that Cheltenham effort is still head and shoulders above anything else on offer in this field.\n\nChris Howard\nBetSeven",originalHtml:"",selections:[{race:"Ludlow 4.27",horse:"Jack Hyde",odds:"11/4",stake:"2 points win",category:"",analysis:"Jack Hyde posted an excellent second off this very mark at Cheltenham back in November, a performance that confirmed his ability to compete at this level when the mood takes him. It is worth noting that the Imperial Cup ninth can be forgiven on the grounds that it was a fiercely competitive handicap hurdle, and this represents a significant drop in grade from that assignment. The form of that Cheltenham effort stands head and shoulders above anything else on offer in this field and a bold bid is anticipated. Don't say you weren't warned."}],doubles:"",antePost:""},
{id:"19d3e2f1ed343ee7",originalSubject:"Today's Qualifiers [ 30th March ]",from:"BetRate <admin@betrate.co.uk>",author:"BetRate",emailDate:"2026-03-30T09:59:28Z",tipDate:"2026-03-30",processedAt:"2026-03-30T10:15:00Z",originalBody:"Today's Qualifiers\n\nLudlow 3.27 - Oakleys Way (5/2)\n\n(Recommended stakes - win bet (below 6/1), e/w bet (6/1 or bigger)\n\nRemember, although only the selections are posted, there is a lot of work that goes on behind the scenes to build the bets and find genuine value, and it pays dividends long-term. Never judge on a small sample, judge the service over a decent period of time.\n\nBe lucky\nAlex\nBetrate",originalHtml:"",selections:[{race:"Ludlow 3.27",horse:"Oakleys Way",odds:"5/2",stake:"1 point win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d3e2b3ec82c99f",originalSubject:"Daily AI Analysis [ 30th March ]",from:"IQ Racing <info@iqracing.net>",author:"IQ Racing",emailDate:"2026-03-30T09:55:14Z",tipDate:"2026-03-30",processedAt:"2026-03-30T10:15:00Z",originalBody:"Monday 30th March\n\nLudlow 2.57 - Annie Express\nAdvised Odds: 11/4 (Bet365)\nAdvised Bet: 2 point win\n\nPerformance Metrics: Impressive winner on stable debut over C&D earlier in the year, travelling strongly and finishing off well. Subsequent runs can be forgiven due to poor jumping, unsuitable ground and overly aggressive tactics. Remains on a workable mark and now drops in grade.\n\nTrack Characteristics: Ludlow clearly suits, with proven course form and a sharper track that should play to her strengths. The drop back in trip looks a key positive and conditions are much more suitable than recent outings.\n\nRace Projection: A more patient ride is expected and should allow her to travel into the race more smoothly. If returning to her debut level at this track, she looks well placed to bounce back and take this.\n\nIQ Racing",originalHtml:"",selections:[{race:"Ludlow 2.57",horse:"Annie Express",odds:"11/4",stake:"2 points win",category:"",analysis:"Annie Express made a striking impression when winning on stable debut over course and distance earlier in the year, travelling strongly throughout before putting the race to bed in convincing fashion. It is worth noting that subsequent outings have valid excuses ranging from poor jumping to unsuitable ground and overly aggressive tactics. The drop back in trip looks a shrewd move and Ludlow clearly suits, with a sharper track playing to her strengths. A more patient ride is expected to unlock further improvement and if returning anywhere close to her debut level, she looks very well placed to bounce back in this company."}],doubles:"",antePost:""},
{id:"19d3e207ea0d7bd2",originalSubject:"Stephen Harris - 30th March",from:"Stephen Harris (via Rob)",author:"Stephen Harris",emailDate:"2026-03-30T09:43:27Z",tipDate:"2026-03-30",processedAt:"2026-03-30T09:45:00Z",originalBody:"Ludlow 2.57 - Annie Express - 1 point win at TBC\n\nAnnie Express can bounce back returning to this track where she made such an impressive winning debut for the yard, travelling strongly and finishing her race off well. Her subsequent runs can be excused given poor jumping, unsuitable ground and overly aggressive tactics. This drop back in trip looks ideal and a more patient ride should suit much better. With conditions in her favour, a lower grade to contend with and Toby McCain-Mitchell back on board, she has a strong chance of returning to form.\n\nLudlow 3.27 - Oakleys Way - 1 point win at TBC\n\nOakleys Way looks a class above these rivals on the pick of his form and arrives here after a very encouraging run last time where he travelled strongly and was only denied late on. He shapes like a horse still ahead of his mark and the return to a sharper track on good ground should play to his strengths. With a strong travelling style and a top jockey booked, this looks the ideal race set up for him to be delivered late and go one better.",originalHtml:"",selections:[{race:"Ludlow 2.57",horse:"Annie Express",odds:"TBC",stake:"1 point win",category:"",analysis:"Annie Express shaped with considerable promise when making a winning debut at this venue for the yard, travelling with real purpose and putting the race to bed convincingly. It is worth noting that subsequent efforts have valid excuses attached, ranging from sketchy jumping to testing conditions and overly positive tactics. The drop back in trip looks a shrewd move and a more restrained ride should unlock further improvement. With conditions to suit, a drop in grade and the booking of Toby McCain-Mitchell all significant positives, the case for a return to winning form looks compelling. Do not say you were not warned."},{race:"Ludlow 3.27",horse:"Oakleys Way",odds:"TBC",stake:"1 point win",category:"",analysis:"Oakleys Way looks a cut above these opponents on the pick of his form and the recent effort was most encouraging, travelling with real zest before just finding one too good late on. The form suggests a horse operating ahead of his current mark and the switch to a sharper track on decent ground should play directly to his strengths. With a travelling style that lends itself perfectly to being delivered late and a top jockey engaged for the assignment, the race setup could hardly be more accommodating. The form received a boost when you consider the calibre of rival that denied him last time."}],doubles:"",antePost:""},
{id:"19d3e1d813205181",originalSubject:"BetRev - Monday 30th March",from:"BetRev <admin@bethub.pro>",author:"BetRev",emailDate:"2026-03-30T09:40:14Z",tipDate:"2026-03-30",processedAt:"2026-03-30T09:45:00Z",originalBody:"Daily Digest - Monday 30th March 2026:\n\nOne bet for Monday.\n\nKempton 5.10:\nRum Diamond has not exactly set the world alight so far but I know they do think he has a bit of ability and things just have not gone to plan as yet. They have thrown the cheek-pieces on today and stepped him up in trip, all of which is expected to bring about a fair bit of improvement. The yard are in good form and we should see a different horse today, all being well.\n\nBet Summary:\nWins:\nKempton 5.10 - Rum Diamond - 2 point win (11/4) Unibet\n\nBe Lucky\nG.J.",originalHtml:"",selections:[{race:"Kempton 5.10",horse:"Rum Diamond",odds:"11/4",stake:"2 points win",category:"",analysis:"Rum Diamond has yet to show his true colours in a fledgling career but connections are known to hold this individual in some regard and the application of cheekpieces represents a significant tactical intervention. The step up in trip looks a shrewd move that should allow him to settle into a more natural rhythm and it is worth noting that the yard are operating in excellent form at present. The combination of first-time headgear and an extra furlong or two has the potential to unlock marked improvement. Everything points to a much improved showing."}],doubles:"",antePost:""},
{id:"19d3deb663558e6d",originalSubject:"From The Stables - 30/03/2026",from:"From The Stables",author:"From The Stables",emailDate:"2026-03-30T08:45:27Z",tipDate:"2026-03-30",processedAt:"2026-03-30T09:00:00Z",originalBody:"Monday, 30th March, 2026\n\nTODAY'S FEATURED STABLES\nB Pauling, C Fellowes, D Cunha, F M O'Brien, J Morland, J Portman, K Bailey & M Nicholls, N Richards, O Sangster, R Teal, S Dow, W Greatrex\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS FROM TODAY'S RUNNERS\n\nTONY'S NAP\n16:27 Ludlow - Jack Hyde (9/4)\n\"This is a race Jack Hyde can win if running up to his best. He was an excellent 2nd off this mark at Cheltenham in November but needs to bounce back from a disappointing run when 9th in the Imperial Cup. This is a big drop in grade so we're very hopeful.\"\n\nTONY'S NEXT BEST\n14:27 Ludlow - Jimbo Sport (7/4)\n\"Jimbo Sport did it very nicely when getting off the mark at Newcastle. Penalties are never easily carried in novice races but he seems to be improving and I'm very hopeful.\"\n\nTONY'S TREBLE\n15:57 Ludlow - The Kalooki Kid (7/2)\n\"The Kalooki Kid tries three miles for the first time. He has a nice chance and if he stays, which I think he will, we'll be looking at the Perth Gold Cup later in the spring.\"\n\nTODAY'S FTS RUNNERS\n\n14:27 Ludlow - Snatch A Glance (11/4)\nTrainer F M O'Brien: \"Snatch A Glance is returning from a break. He was last seen when winning over the CD in a lesser race. He will run well but has a bit to find with Archie Watson's runner and Ben Pauling's was a good winner at Newcastle. We feel we can find weaker races for him next month.\"\n\n14:27 Ludlow - Jimbo Sport (7/4)\nTrainer B Pauling: \"Jimbo Sport did it very nicely when getting off the mark at Newcastle. Penalties are never easily carried in novice races but he seems to be improving and I'm very hopeful.\"\n\n14:27 Ludlow - Golden Garden (50/1)\nTrainer W Greatrex: \"There was a lot to like about Golden Garden's only hurdle start but his wind caught him out that day. He has had a further wind-op since and we're looking forward to his continuing his education over jumps.\"\n\n15:10 Kempton Park - Holy Fire (12/1)\nTrainer C Fellowes: \"Holy Fire ran well upped in trip last time and hit the line very hard after looking in trouble 2f out. Small fields suit her and she looks a picture. She will be thereabouts.\"\n\n15:40 Kempton Park - Liveinthelight (66/1)\nTrainer O Sangster: \"Liveinthelight is drastically up in trip for only her 2nd start after her September debut. Probably best watched.\"\n\n15:57 Ludlow - Destroytheevidence (9/2)\nTrainer K Bailey & M Nicholls: \"Destroytheevidence is probably still in the grip of the handicapper. He's not the easiest to get going, but if he is on a going day, place chances and not without the ability to go close.\"\n\n15:57 Ludlow - The Kalooki Kid (7/2)\nTrainer N Richards: \"The Kalooki Kid tries three miles for the first time. He has a nice chance and if he stays, which I think he will, we'll be looking at the Perth Gold Cup later in the spring.\"\n\n15:57 Ludlow - Your Darling (3/1)\nTrainer F M O'Brien: \"Your Darling has been quite lightly raced of late but he goes well fresh and has won on good ground and in the spring in the past. This looks a decent opportunity.\"\n\n16:27 Ludlow - Jack Hyde (9/4)\nTrainer F M O'Brien: \"This is a race Jack Hyde can win if running up to his best. He was an excellent 2nd off this mark at Cheltenham in November but needs to bounce back from a disappointing run when 9th in the Imperial Cup. This is a big drop in grade so we're very hopeful.\"\n\n16:27 Ludlow - Roysse (10/1)\nTrainer B Pauling: \"Roysse put up some very good performances from the front over hurdles earlier in his career and we're returning to the smaller obstacles after some lesser efforts over fences. If he has retained his ability, he might make them all go round here.\"\n\n16:40 Kempton Park - Sail On Sailor (40/1)\nTrainer S Dow: \"Sail On Sailor makes his stable debut here and looks the sort to progress as time goes on. Has plenty of size and scope and trains nicely so it depends how much he has improved through the winter. Sure to find his races and not easy to dismiss if he is fit enough and gets a good run round.\"\n\n16:40 Kempton Park - Prancy Peer (8/1)\nTrainer C Fellowes: \"Prancy Peer isn't very reliable. On his best behaviour he might run into a place, but with only seven runners, each-way betting is hardly an attractive proposition.\"\n\n16:40 Kempton Park - Superstorm (8/1)\nTrainer C Fellowes: \"Superstorm has wintered really well and looks to have improved for being gelded. His work has been good and he too looks a picture. I think he will need the run but he is well handicapped and should go close.\"\n\n18:30 Wolverhampton - Patrol (12/1)\nTrainer D Cunha: \"Patrol had a busy year upon joining us, winning three times including around here. He returns from a winter break and while he has been running over further, he does have plenty of speed. Good jockey booking so place chances.\"\n\n19:00 Wolverhampton - Pangbourne (8/1)\nTrainer R Teal: \"Pangbourne ran easily her best race yet when 2nd at 33/1 on handicap debut here early this month. She has another furlong to travel tonight and that might well suit, so I'm surprised she's as big as she is here. Hopeful of a nice run.\"\n\n19:30 Wolverhampton - Saucy Jane (4/1)\nTrainer J Morland: \"Saucy Jane ran a very nice race on her reappearance. I think 5f is her best trip and now from the ideal draw on the rail we think she has a very good chance.\"\n\n20:00 Wolverhampton - Galette (33/1)\nTrainer J Portman: \"Galette is a very limited filly. She's best watched tonight, meeting most of these on unfavourable terms.\"\n\n20:30 Wolverhampton - Brinton (9/1)\nTrainer J Portman: \"It all depends on the break for Brinton who is prone to fluff the start and you never know what she'll do. If she misses the break it's game over, but if she gets away on terms, she'd have a decent chance.\" ",originalHtml:"",selections:[{race:"Ludlow 4.27",horse:"Jack Hyde",odds:"9/4",stake:"Tony's NAP",category:"NAP",analysis:"Jack Hyde posted an excellent second off this very mark at Cheltenham back in November, a performance that confirmed his ability to compete at this level when the mood takes him. It is worth noting that the Imperial Cup ninth can be forgiven on the grounds that it was a fiercely competitive handicap hurdle, and this represents a significant drop in grade from that assignment. The form of that Cheltenham effort stands head and shoulders above anything else on offer in this field, and Tom's five pound claim will be a valuable asset on a horse who has demonstrated he handles these conditions. Don't say you weren't warned."},{race:"Ludlow 2.27",horse:"Jimbo Sport",odds:"7/4",stake:"Tony's Next Best",category:"NB",analysis:"Jimbo Sport did it in the style of a progressive performer when getting off the mark at Newcastle, winning with the kind of authority that suggests there is plenty more to come from this seven year old. It is worth noting that Ben Pauling has identified an ideal follow up opportunity for a horse who appears to be going the right way, and while penalties are never easily carried in novice company, the manner of that Newcastle success suggests this one is more than capable of defying the weight. The yard is operating with confidence and this looks tailor made."},{race:"Ludlow 3.57",horse:"The Kalooki Kid",odds:"7/2",stake:"Tony's Treble",category:"",analysis:"The Kalooki Kid tackles the three mile trip for the first time and there is good reason to believe the stamina test will bring about further improvement. It is worth noting that Nicky Richards has been popping in winners with pleasing regularity all season and connections clearly feel this one will stay, with the Perth Gold Cup already being mentioned as a spring target. That kind of forward planning from a yard in form suggests quiet confidence, and if the stamina holds, as they expect it will, this looks a very live chance at the price."}],doubles:"Tony's Treble: Jack Hyde, Jimbo Sport, The Kalooki Kid",antePost:""},
{id:"19d3bc44528d410f",originalSubject:"Monday Blog. (30/03/26)",from:"Everything Racing Blog",author:"EVR",emailDate:"2026-03-29T22:43:31Z",tipDate:"2026-03-30",processedAt:"2026-03-29T22:15:00Z",originalBody:"Monday 30th March 2026\n\nNAP (Best Bet)\n\nMy best bet of the day on Monday comes from Navan and the 2.48, which is a maiden that's contested over a mile. I'm strong on the chances of SHAFTESBURY AVENUE here for the team of Aidan O'Brien and Wayne Lordan. He made an encouraging start to his racing career when third of twenty-three at the Curragh earlier this month, and he should naturally take a big step forward coming into his second start here. It's often the case that runners from this all-conquering yard show significant improvement on their second outing, and it would be no surprise if that was the case once again here.\n\n2.48 Navan - SHAFTESBURY AVENUE - (15/8) (Win) (NAP)\n\nNB (Next Best Bet)\n\nThe next best for me on Monday comes from Kempton, and in the 2.10, which is a Class 4 novice event for fillies and contested over six furlongs. I like MEHMAS ENGINE in this particular affair for James Tate and Rossa Ryan. She was sent off the 5/6 favourite for her racecourse debut at Southwell last month, so she's clearly held in some regard, and whilst she could only manage third, she was denied a clear run and had to switch a furlong out. That run came over five furlongs, and given how she still kept to her task that day, this step up to six should unlock further improvement. It'd be no surprise to see her take a big step forward here, and she can take advantage of the seven pounds she receives from the current favourite Barefoot Beach.\n\n2.10 Kempton - MEHMAS ENGINE - (15/8) (Win) (NB)\n\n3B (Third Best Bet)\n\nMy third-best bet of the afternoon on Monday comes within the 4.18 at Navan, and this is a maiden for three-year-olds over a mile and two furlongs. I like the chances of HIPPOLOGY here for Joseph O'Brien and Declan McDonogh. He posted an eye-catching effort when he was last seen on racecourse debut at this track in October over a mile, finishing fifth of ten and staying on in the closing stages after initially being outpaced. The step up in distance here should be right up his street, given that run, and his breeding, and he should naturally progress. He could well get a lot closer.\n\n4.18 Navan - HIPPOLOGY - (3/1) (Win) (3B)\n\nEach-Way Bet\n\nThe each-way bet of the day for me on Monday runs in the 3.18 at Navan, and this is handicap action over a mile and six furlongs. I've come down on GALILEO DAME here, who's another one for Joseph O'Brien, and the mount of Joey Sheridan. She's not managed to set the world alight on the flat despite promise in her earlier days; however, she bolted up by eleven lengths last time out over hurdles in February, with that success also coming at this track. She makes her handicap debut here, having competed in higher grades when she was last seen on the level, and this mark could well prove to be a lenient one. I think she can go well here at a reasonable price.\n\n3.18 Navan - GALILEO DAME - (9/1) (Each-Way) (4 places)\n\nLongshot\n\nI'm taking a chance on one in the 5.10 at Kempton for my longshot of the day, and this is a Class 6 handicap over a mile and four furlongs. I think that COSPICUA could be overpriced in this low-grade affair for James Tate and Lewis Edmunds. She won over course and distance on just her penultimate start, showing significant improvement when markedly stepped up in distance on her handicap debut. There's every chance that she just didn't handle the track at Newcastle last time out, and if she returns to the form of her run here in January, she could look a big price off just a three-pound higher mark.\n\n5.10 Kempton - COSPICUA - (22/1) (Each-Way)",originalHtml:"",selections:[{race:"Navan 2.48",horse:"Shaftesbury Avenue",odds:"15/8",stake:"1 point win",category:"NAP",analysis:"Shaftesbury Avenue showed considerable promise when third of twenty three on debut at the Curragh earlier this month, a run that marked him out as one to follow. It is worth noting that the Aidan O'Brien operation have an exceptional record with runners on their second start, and Wayne Lordan takes the ride for this mile maiden at Navan. The manner in which he shaped on that initial outing suggested there was plenty more to come, and natural improvement looks almost inevitable. Those who back the yard's second-time-out runners tend to prosper handsomely. Don't say you weren't warned."},{race:"Kempton 2.10",horse:"Mehmas Engine",odds:"15/8",stake:"1 point win",category:"NB",analysis:"Mehmas Engine was sent off at just 5/6 for her racecourse introduction at Southwell last month, a market position that reveals the esteem in which she is held by the James Tate operation. It is worth noting that she was denied a clear passage on that occasion and had to switch a furlong from the finish, yet still kept on gamely to claim third. The step up to six furlongs here at Kempton should unlock significant improvement, and the seven pound weight concession she receives from the likely market principal Barefoot Beach tilts conditions firmly in her favour. Rossa Ryan in the plate adds further confidence."},{race:"Navan 4.18",horse:"Hippology",odds:"3/1",stake:"1 point win",category:"",analysis:"Hippology shaped with considerable promise on racecourse debut at Navan back in October when fifth of ten over a mile, staying on purposefully through the closing stages having initially been caught flat footed for pace. It is worth noting that the step up to a mile and two furlongs here should prove transformative given both the manner of that initial effort and his pedigree, which is loaded with stamina influences. Joseph O'Brien has engaged Declan McDonogh for the ride, and natural progression from that first outing could see him heavily involved at the business end of proceedings."},{race:"Navan 3.18",horse:"Galileo Dame",odds:"9/1",stake:"1 point e/w (4 places)",category:"",analysis:"Galileo Dame bolted up by eleven lengths over hurdles at this venue in February, a demolition job that suggests her flat mark could seriously underestimate her current well being. It is worth noting that she makes her handicap debut off a rating that could prove generous, having previously competed exclusively in higher grade company on the level. The form received a considerable boost from the manner of that hurdling victory, and the step up to a mile and six furlongs should play to her stamina reserves. Joey Sheridan rides for the Joseph O'Brien team and this looks overpriced."},{race:"Kempton 5.10",horse:"Cospicua",odds:"22/1",stake:"1 point e/w",category:"",analysis:"Cospicua won over this course and distance in January on just her second start, showing marked improvement when stepped up in trip on her handicap debut. It is worth noting that she may simply not have handled the track at Newcastle last time out, and a return to Kempton where she has already demonstrated she can operate effectively represents a significant positive. James Tate sends her out off just a three pound higher mark than her winning one, and if she recaptures that January form in this low grade Class 6 affair, the current odds look generous in the extreme."}],doubles:"",antePost:""},
{id:"19d3a7056b804ce3",originalSubject:"New Horse Racing Tip",from:"Ben from The Racing Analyst",author:"Ben",emailDate:"2026-03-29T16:32:10Z",tipDate:"2026-03-30",processedAt:"2026-03-29T21:57:25Z",originalBody:"Good runs from FOLKENE at 25/1 and TERRITORIAL KNIGHT at 9/1, both go into the tracker, but nothing good enough to win on the day.\nKING OF EARTH unlucky to not win but MUNSIF was a non trier. Not sure what happened with GOLDEN STRIKE but he never came off the bridle before he was eased down, assume the jockey wasn't quite happy with him.\nA decent weekend. Finishing in profit on Friday and well ahead Saturday.\n\nOne tip Monday as the flat turf racing takes another sabbatical for a week.\n\n5.10 KEMPTON RUM DIAMOND 4/1 1.5PT WIN\n\nThe only bet of the day is, on form, a bit sketchy but, on stats, absolutely rock solid. RUM DIAMOND has absolutely nothing to recommend him on, based on what we have seen on the course so far but this is a pick based on pedigree, yard and jockey. Firstly he's run three races over a mile which, as a brother to Burdett Road (1m4f horse rated 113) and East India Dock (2m horse rated 102) (both graded jumps winners), were all run over trips far too short and used for no more than to get some experience into him. He comes back to the track as a 3yr old today, upped to 1m4f which should be a lot more suitable and making his handicap debut. That's significant given that the yard have a 56% strike rate with their horses making their handicap debuts on the all weather this year, 5 winners from 9 runners. He's also having his first run since being gelded (18% strike rate for the yard), which is something that his siblings improved plenty because of too. Lastly, the jockey booking is a significant one too. Next to the mix is the application of first time cheek pieces and the last time he put those on one of his horses, for the first time, the horse was a winner. Cieren Fallon is at Kempton today for just this one ride and has a superb 45% strike rate when teaming up with James Owen so far this year (5 wins and 2 places from 11 runners). The yard themselves are in superb form and, based on pedigree alone, this mark of 60 might prove to be a few stone lenient come the end of the season.\n\nANTE POST ALREADY ADVISED\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst",originalHtml:"",selections:[{race:"Kempton 5.10",horse:"Rum Diamond",odds:"4/1",stake:"1.5 points win",category:"",analysis:"Rum Diamond is a fascinating pedigree play, being a brother to Burdett Road and East India Dock, both graded jumps winners over considerably further trips. His three previous runs over a mile were purely educational and the step up to a mile and four furlongs on his handicap debut looks transformative. It is worth noting that the yard boast a 56% strike rate with horses making their handicap debut on the all-weather this season, and the booking of Cieren Fallon, who rides at Kempton specifically for this one mount, speaks volumes about stable confidence. First-time cheekpieces add another string to the bow and the mark of 60 could prove very lenient."}],doubles:"",antePost:"28th March - Lincoln Handicap - Eternal Force 10/1 1pt win. 11th April - Grand National - Captain Cody 25/1 1pt win"},
{id:"19d397b8ce86f7c8",originalSubject:"Form Guru - 29th March",from:"The Inside Rail",author:"Form Guru",emailDate:"2026-03-29T12:04:51Z",tipDate:"2026-03-29",processedAt:"2026-03-29T21:57:25Z",originalBody:"Rogue Diplomat lost out in a bob of heads at Doncaster yesterday. At the same track, Glint Of Gold returned place money and Dancing Tiger was successful.\n\nToday's Selections:\n\n1.47 - Doncaster - Thanks Angel. 0.75 pts e/w. Available at 25/1. (Bet365 - 1/5 odds first 6, BOG)\n\n2.55 - Doncaster:\nUnder The Twilight. 1 pt e/w. Available at 12/1. (Bet365 - 1/5 odds first 5, BOG)\nJust Queen High. 0.75 pts e/w. Available at 22/1. (Generally available - 1/5 odds first 5, BOG)\n\n3.30 - Doncaster - Melvin Udall. 1.25 pts e/w. Available at 10/1. (Bet365, Ladbrokes, Coral, William Hill - 1/5 odds first 4, BOG)\n\n4.05 - Doncaster - Say What You See. 2 pts win. Available at 13/2. (William Hill, 888Sport, BOG)\n\n5.15 - Doncaster - Irish Nectar. 1 pt e/w. Available at 14/1. (Generally available - 1/5 odds first 5, BOG)\n\n5.50 - Doncaster:\nOur Absent Friends. 2 pts win. Available at 7/1. (Bet365, BOG)\nGlory Hyde. 0.75 pts e/w. Available at 16/1. (Generally available - 1/5 odds first 5, BOG)",originalHtml:"",selections:[{race:"Doncaster 1.47",horse:"Thanks Angel",odds:"25/1",stake:"0.75 points e/w (6 places)",category:"",analysis:""},{race:"Doncaster 2.55",horse:"Under The Twilight",odds:"12/1",stake:"1 point e/w (5 places)",category:"",analysis:""},{race:"Doncaster 2.55",horse:"Just Queen High",odds:"22/1",stake:"0.75 points e/w (5 places)",category:"",analysis:""},{race:"Doncaster 3.30",horse:"Melvin Udall",odds:"10/1",stake:"1.25 points e/w (4 places)",category:"",analysis:""},{race:"Doncaster 4.05",horse:"Say What You See",odds:"13/2",stake:"2 points win",category:"",analysis:""},{race:"Doncaster 5.15",horse:"Irish Nectar",odds:"14/1",stake:"1 point e/w (5 places)",category:"",analysis:""},{race:"Doncaster 5.50",horse:"Our Absent Friends",odds:"7/1",stake:"2 points win",category:"",analysis:""},{race:"Doncaster 5.50",horse:"Glory Hyde",odds:"16/1",stake:"0.75 points e/w (5 places)",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d392b1a36d89ec",originalSubject:"BetRev - Sunday 29th March",from:"BetRev",author:"BetRev",emailDate:"2026-03-29T10:36:58Z",tipDate:"2026-03-29",processedAt:"2026-03-29T21:57:25Z",originalBody:"Daily Digest - Sunday 29th March 2026:\n\nCadarn and Marhaba Ghaiyyath both blew the start yesterday and could never get into contention. Marhaba Ghaiyyath was also denied a run at a crucial stage so probably safe to put a line through that one, and i'd likely give him another chance.\n\nOur day ended in profit with the fairly comfortable win from Pina Sonata.\n\nFull of flu today - no selections. Back tomorrow.\n\nBe Lucky\nG.J.",originalHtml:"",selections:[],doubles:"",antePost:""},
{id:"19d38e8d53b856b7",originalSubject:"From The Stables - 29/03/2026",from:"From The Stables",author:"From The Stables",emailDate:"2026-03-29T09:24:31Z",tipDate:"2026-03-29",processedAt:"2026-03-29T21:57:25Z",originalBody:"Sunday, 29th March, 2026\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS FROM TODAY'S RUNNERS\n\nTONY'S NAP\n16:40 Doncaster - Arc Ole Ole\n\"Arc Ole Ole was highly regarded among Dylan's juveniles last season. No doubt he will be disappointed if he doesn't win off this mark. So will I!\"\n\nTONY'S NEXT BEST\n15:05 Ascot - Senator\n\"Senator has been campaigned sensitively by Jamie and the reward could be a first handicap win.\"\n\nTONY'S TREBLE\n17:25 Ascot - Lovely Gino\n\"Fresh horses at this stage of the jumps season have to be dangerous. Most imports from France get a hammering from the handicappers, but I don't think Lovely Gino has. Big chance.\"\n\nTODAY'S FTS RUNNERS\n\n13:47 Doncaster - Cartwheel (66/1)\nTrainer D Cunha: \"Two chances here. Cartwheel is fit from the AW but three runs, finishing last each time cannot hold out much confidence. Let's see if turf turns the Cartwheel!\"\n\n13:47 Doncaster - Luminous Warrior (16/1)\nTrainer D Cunha: \"Luminous Warrior won at Kempton before Christmas, but has finished last in both runs since. Fletch is a star amateur and hopefully he can work the oracle and bring about a better showing.\"\n\n14:55 Doncaster - Just Queen High (14/1)\nTrainer D Cunha: \"Just Queen High won two of her last three, including when wearing first-time blinkers at Nottingham on her finale. That was five months ago, but she goes well fresh and the ground will be no problem. Value each-way.\"\n\n15:05 Ascot - Mojito Des Mottes (22/1)\nTrainer B Pauling: \"We run two in this nice juvenile handicap hurdle. We had high hopes for Mojito Des Mottes, an impressive debut French winner, but things haven't gone to plan. Hopefully, the wind-op will help but it's very competitive.\"\n\n15:05 Ascot - Paddockwood (50/1)\nTrainer B Pauling: \"Paddockwood won a couple of times in France and we gave him a first spin for the yard in the Fred Winter at Cheltenham and it proved a culture shock. Looking for a better effort now but he has lots of weight and it will be tough.\"\n\n15:05 Ascot - Senator (8/1)\nTrainer J Snowden: \"Senator ran a couple of times with promise in French flat races. His form has been progressive, culminating in victory at Market Rasen after which the handicapper allowed him to keep the 112 rating. Looks very dangerous.\"\n\n15:30 Doncaster - Zarathos (7/1)\nTrainer D Cunha: \"Zarathos has never won but is probably the unluckiest horse in the yard. It's a new season and clean slate. Nobody will be less surprised than me if he goes very close and maybe even gets that elusive first win.\"\n\n16:40 Doncaster - Arc Ole Ole (7/4)\nTrainer D Cunha: \"We thought Arc Ole Ole was a shoo-in when he won on 2nd start at Bath in October and the mark of 71 looks almost too good to be true. Very hopeful he can take this next step on the way to something bigger and better.\"\n\n17:15 Doncaster - Valley Ofthe Kings (33/1)\nTrainer D Cunha: \"Valley Ofthe Kings has been bashing away through the winter. He's a bang six-furlong horse and back on turf, he could well outrun his odds.\"\n\n17:25 Ascot - Lovely Gino (11/2)\nTrainer B Pauling: \"Another double bubble. Lovely Gino starts for the stable on the back of an absence since October when he was a faller over hurdles at Auteuil. Two runs earlier he won over fences there and gets this trip. Could well be reasonably weighted. Hopeful.\"\n\n17:25 Ascot - Whatsupwithyou (50/1)\nTrainer B Pauling: \"Whatsupwithyou sprang a surprise around here under Elliott in December but couldn't replicate the form at Kempton last month. It's understandable that at age 12 he isn't the most consistent nowadays but even with a big weight, he could show he likes the track to run another decent race.\"",originalHtml:"",selections:[{race:"Doncaster 4.40",horse:"Arc Ole Ole",odds:"7/4",stake:"Tony's NAP",category:"NAP",analysis:"Arc Ole Ole was highly regarded among Dylan Cunha's juveniles last season and the trainer will be disappointed if this three-year-old cannot justify favouritism off a mark of 71. The form of his comfortable Bath victory in October has worked out well and the step up in trip on his handicap debut looks the key to unlocking significant improvement. It is worth noting that the yard thought him a certainty after that second career start and the current rating could prove extremely lenient."},{race:"Ascot 3.05",horse:"Senator",odds:"8/1",stake:"Tony's Next Best",category:"NB",analysis:"Senator has been handled with considerable patience by Jamie Snowden since arriving from French flat racing, and the reward could be a first handicap success. It is worth noting that his progressive form culminated in victory at Market Rasen, after which the handicapper generously allowed him to retain his rating of 112. He looks a dangerous proposition in this juvenile handicap hurdle and connections are clearly optimistic."},{race:"Ascot 5.25",horse:"Lovely Gino",odds:"11/2",stake:"Tony's Treble",category:"",analysis:"Lovely Gino represents Ben Pauling on his first start for the stable following an absence since October when he fell over hurdles at Auteuil. The form received a boost two runs earlier when he won over fences at the French track, and it is worth noting that fresh horses at this stage of the jumps season carry real potency. Most French imports receive harsh treatment from the handicapper but this one appears to have slipped through the net and could prove reasonably weighted on his British debut."}],doubles:"Tony's Treble: Arc Ole Ole, Senator, Lovely Gino",antePost:""},
{id:"19d38c8d1ea18a56",originalSubject:"GM - 29th March",from:"The Inside Rail",author:"GM",emailDate:"2026-03-29T08:49:37Z",tipDate:"2026-03-29",processedAt:"2026-03-29T21:57:25Z",originalBody:"Towcester 3.51\nThe Other Chief 2 points win @ 3/1 Ladbrokes & Coral",originalHtml:"",selections:[{race:"Towcester 3.51",horse:"The Other Chief",odds:"3/1",stake:"2 points win",category:"",analysis:""}],doubles:"",antePost:""},

{id:"19d38918fec03765",originalSubject:"GM - Ante Post Review",from:"The Inside Rail",author:"GM",emailDate:"2026-03-29T07:49:15Z",tipDate:"2026-03-29",processedAt:"2026-03-29T21:57:25Z",originalBody:"Last Night's Review\nIndividual Bets wise was disappointing.\nPowerhouse Duke fell out paced up but found trouble at the first bend, race over, he did try and made up ground but fourth was the best he could do.\nBower Sheeran had the early paced battle won with Romeo Steel going into the first bend but he was going so fast he swung out wide and was crowded.\nThis allowed Droopys Aladdin to take advantage up his inside after a slow start to go and win comfortably from Romeo Steel.\n\nAnte Post\nA much better evening in the Two Cat 1 Finals.\n\nKent Plate\nScooby The Lady a bitch who is in flying form flew out and made every yard from what most people thought was an adverse draw in trap four.\nShe beat six time Cat 1 winner Proper Heiress fair and square and in doing broke the Central Park track record.\nLady was advised at 12/1 after the first round giving us an eight point profit after deducting the stake on Heiress at the start of the competition.\n\nLadbrokes Puppy Derby\nUnderground Gold unbeaten going into the decider remained unbeaten.\nA smash break saw him clear the inside runners and he took off down the back straight to win by six lengths in a fast 27.79.\nGold was advised at 10/3 at the start of the competition and returned a ten point profit.\nWe are now 35 points up on Ante Post bets in the first quarter of 2026.\n\nDunstall Park AP 1st Rd Review\nThe Laurels\nWicky Ned broke well but was matched for early pace with Droopys Doris inside him, they had a coming together at the first bend and from then on Ned back peddled showing nothing.\nI wouldn't be surprised if he was retired.\nAnother disappointing run was from Not So Steady who broke ok leading to the second bend challenger the leader to the fourth bend then swung wide off the last to beaten a sh head to qualify in fourth. He's another that can't be trusted.\n\nDunstall Dash\nWe fared better in the Sprint heats with both selections Newinn Souly & Good Acclaim winning their respective races from the front.\n\nIf I decide to post any individual bets today, I will send them on a separate post.",originalHtml:"",selections:[],doubles:"",antePost:""},

{
  id: "19d3603eb07d442c",
  originalSubject: "Sunday Blog. (29/03/26)",
  from: "Everything Racing Blog <donotreply@wordpress.com>",
  author: "EVR",
  emailDate: "2026-03-28T19:55:19Z",
  tipDate: "2026-03-29",
  processedAt:  "2026-03-29T21:57:25Z",
  originalBody: "Sunday 29th March 2026\n\nNAP (Best Bet)\n\nMy best bet of the day on Sunday comes from Doncaster and the 2.20, a Class 4 novice event which is contested over a distance of seven furlongs. I\u2019m strong on the chances of KING OF EARTH here for William Haggas and Cieren Fallon. He posted a very encouraging effort on his racecourse debut at Newbury back in October, finishing two and a quarter of a length behind Gonna Fly, who has Derby entries, and five lengths in front of Bnaider, who was the 9/4 favourite on that occasion. This looks like decent form, and he should naturally take a big step forward on his second start. That run also came on soft ground, so he should handle any cut here, and he looks like a big player for the Haggas team.\n\n2.20 Doncaster - KING OF EARTH - (10/11) (Win) (NAP)\n\nNB (Next Best Bet)\n\nI\u2019ve got one selection from Ascot on Saturday, and this is my next best bet of the day, which runs in the 1.55, a Class 2 maiden hurdle over two miles and three and a half furlongs. I find it difficult to look past the Seamus Mullins-trained WEST HILL VERDE here, who\u2019s the mount of Callum Pritchard. He\u2019s been knocking on the door all season, with a string of places behind several smart sorts such as Captain Hugo, Act Of Innocence, and Crystal Island. He then took his form to the next level last time out at Kelso despite not winning, finishing third of ten in the Grade 2 Premier Novices\u2019 Hurdle. That\u2019s the best form on offer here, and this looks like a perfect opportunity for him to finally open his account.\n\n1.55 Ascot - WEST HILL VERDE - (11/10) (Win) (NB)\n\n3B (Third Best Bet)\n\nIt\u2019s back over to Doncaster for what I rank as my third-best bet of the afternoon, and this comes within the 4.40, which is a Class 5 handicap that\u2019s contested over a mile and two furlongs. I think that Dylan Cunha could have the answer to this puzzle with ARC OLE OLE, who\u2019s the mount of Luke Morris. He progressed markedly from his debut run at Newmarket to win comfortably at Bath on soft ground in October, getting up by two lengths on that occasion. He kept on well that day and is by Study Of Man, which suggests that this step up to ten furlongs should be right up his street, and he could well take quite a bit of beating in this particular assignment.\n\n4.40 Doncaster - ARC OLE OLE - (7/4) (Win) (3B)\n\nEach-Way Bet\n\nMy each-way bet of the day comes within the 3.30 at Doncaster, and this is a Class 4 handicap over seven furlongs. This is a competitive fifteen-runner affair for the grade; however, I\u2019ve come down on EPICTETUS for the team of Jamie & Saffie Osbourne. Remarkably, he was second behind Auguste Rodin in the Group 1 Futurity Trophy at this track back in 2022. He clearly hasn\u2019t been able to live up to the promise he showed back then; however, he\u2019s now on what looks like a tempting mark for his current yard. He\u2019s yet to get his head in front for Jamie Osbourne, however, he was only beaten by a neck at Chelmsford last time out earlier this month, off just a pound lower. He has form on soft ground, and he should be competitive again here.\n\n3.30 Doncaster - EPICTETUS - (6/1) (Each-Way) (4 places)\n\nLongshot\n\nThe longshot on Sunday comes within the 5.15 at Doncaster, and this is a Class 3 handicap that\u2019s ridden over six furlongs. I\u2019m taking a chance on IRISH NECTAR here for Michael Herrington and Edward Greatrex. The Herrington outfit is currently in good form, operating at a 30% strike-rate, and I think that this five-year-old could prove to be overpriced. He was only beaten by a head on his penultimate start at Kempton last month off just a two-pound lower mark, and he\u2019s also a course and distance winner off a two-pound higher mark. He\u2019ll have no issue with any potential cut in the ground, given that his course and distance success came on soft ground, and I believe he\u2019s got every chance of running well at sizeable odds here.\n\n5.15 Doncaster - IRISH NECTAR - (25/1) (Each-Way) (5 places)",
  originalHtml: "",
  selections: [
    { race: "Doncaster 2.20", horse: "King Of Earth", odds: "10/11", stake: "1 point win", category: "NAP", analysis: "King Of Earth shaped with considerable promise on his racecourse debut at Newbury back in October, finishing just two and a quarter lengths behind Gonna Fly, a colt who now holds entries in the Derby. It is worth noting that Bnaider, the 9/4 favourite that day, finished a further five lengths adrift in behind. The form looks rock solid and the William Haggas team will expect natural improvement on this second career start. The debut effort came on soft ground, so any give underfoot will hold no terrors, and Cieren Fallon takes the ride with quiet confidence. Don't say you weren't warned." },
    { race: "Ascot 1.55", horse: "West Hill Verde", odds: "11/10", stake: "1 point win", category: "NB", analysis: "West Hill Verde has been threatening to open his account all season for the Seamus Mullins yard and has compiled a highly creditable sequence of placed efforts behind some smart performers, including Captain Hugo, Act Of Innocence, and Crystal Island. It is worth noting that his most recent outing saw him finish a meritorious third in the Grade 2 Premier Novices Hurdle at Kelso, which represents comfortably the best form in this field. Callum Pritchard retains the ride and this Class 2 maiden hurdle looks a perfect opportunity for this consistent performer to finally get his head in front." },
    { race: "Doncaster 4.40", horse: "Arc Ole Ole", odds: "7/4", stake: "1 point win", category: "", analysis: "Arc Ole Ole progressed markedly from his debut run at Newmarket to win with authority at Bath on soft ground in October, scoring by a comfortable two lengths on that occasion. The form received a boost from the manner in which he kept on strongly through the line that day, and it is worth noting that his sire Study Of Man strongly suggests this step up to ten furlongs will be right in his wheelhouse. Dylan Cunha sends him out in good order and Luke Morris takes the ride. This Class 5 handicap looks well within his compass." },
    { race: "Doncaster 3.30", horse: "Epictetus", odds: "6/1", stake: "1 point e/w (4 places)", category: "", analysis: "Epictetus carries fascinating back form, having finished second to the great Auguste Rodin in the Group 1 Futurity Trophy at this very track back in 2022. It is worth noting that while he has not scaled those heights since, he finds himself on what looks an increasingly attractive handicap mark for the Jamie and Saffie Osbourne operation. The form received a boost when he was beaten just a neck at Chelmsford earlier this month off a pound higher. He handles soft ground well and this competitive fifteen runner affair should not be beyond him." },
    { race: "Doncaster 5.15", horse: "Irish Nectar", odds: "25/1", stake: "1 point e/w (5 places)", category: "", analysis: "Irish Nectar is one of those horses whose form figures do not tell the whole story. The Michael Herrington yard is operating at a 30% strike rate and this five year old looks significantly overpriced on the pick of his recent efforts. It is worth noting that he was beaten just a head on his penultimate start at Kempton off a mark only two pounds lower than today. He is also a proven course and distance winner, having scored here off a mark two pounds higher. Soft ground is firmly in his comfort zone and he could outrun his odds considerably." }
  ],

{
  id: "19d3586bb80ecd43",
  originalSubject: "New Horse Racing Tip",
  from: "Ben from The Racing Analyst <contact@theracinganalyst.com>",
  author: "Ben",
  emailDate: "2026-03-28T17:38:32Z",
  tipDate: "2026-03-29",
  processedAt:  "2026-03-29T21:57:25Z",
  originalBody: "29th March 2026\n\nA good day once more, with PINA SONATA winning with ease at 10/1. We were unlucky to have not landed the each way double too. MARHABA GHAIYYATH wouldn\u2019t have won, but he would have certainly placed had he not been badly hampered.\nA place for VALVANO in the Lincoln too and I wouldn\u2019t give up on ETERNAL FORCE. The race wasn\u2019t run to suit and he might benefit for a step up in trip. He works like a group horse and he is a horse to follow.\n\n2.55 DONCASTER GOLDEN STRIKE 11/2 1PT WIN\n5.15 DONCASTER TERRITORIAL KNIGHT 6/1 1PT WIN NAP\n0.5PT EACH WAY DOUBLE (both 5 places)\n\n3.30 DONCASTER FOLKENE 20/1 0.75PT EW 4 PLACES (PADDY POWER, BETFAIR, COPYBET & SKYBET)\n\n2.20 DONCASTER KING OF EARTH 5/6\n3.05 ASCOT MUNSIF 6/4\n1PT WIN DOUBLE\n\nFitness with many horses this time of year is the big question but, having been kept busy on the all weather this winter, that shouldn\u2019t be an issue with GOLDEN STRIKE who arrives in good form and thoroughly unexposed on turf. Having had a good start to his career, winning two of his three starts, he went off the boil until just three starts ago, where the switch to a visor seems to have rejuvenated him. He has good form at the track, when unlucky to have not won here last summer off a mark of 72. Racing off that mark again today, the form of his most recent 2nd at Newcastle is excellent (1st won 2 from 2 since and the 3rd has won his only start since too). The yard are struggling for winners, but often do well on this card and their horses are going close enough to suggest there\u2019s no issue.\n\nFor all it is last year\u2019s form, a good run from GOLDEN STRIKE will enhance the claims of TERRITORIAL KNIGHT who is a C&D winner. That win came off a mark of 82, so with Jack Callan\u2019s 5lb claim here, we are effectively racing off the same mark today. He went well first time out last year, so the layoff is hopefully no issue and if he\u2019s in the same form today as he was when 5th in the Bronze Cup at Ayr when last seen, he ought to have every chance in this field.\n\nSTANAGE won on this card last year, off a mark of 84 when ridden by Jo Mason. The yard are in fine form and off a mark of 7lb lower, he has to have a good chance in this. However, Jo Mason has opted to not ride that horse today, she would have had the choice, and she\u2019s on FOLKENE instead, who won first time out at Newmarket last season. Given the horse was ridden by Mason that day, she ought to have a very good idea over which is better and I\u2019m hoping it\u2019s noteworthy that she\u2019s on this lad. Last year was more of a fact finding mission for this horse that had come over from France, so I imagine it was some surprise that he won first time out for the stable. He didn\u2019t go on from that, but that\u2019s easy to ignore as most horses struggle when coming over the English channel anyway. He comes here fresh, 2 from 2 after a break, and is proven on both quick and soft ground. Again, the yard are struggling for winners but a lot of their horses are running well. It\u2019s a bit of a punt, largely based on the jockey booking, but at 20/1 I\u2019m happy to back any loser in the hope they can spring a surprise.\n\nAnte Post Already Advised:\n28th March \u2013 Lincoln Handicap \u2013 Eternal Force 10/1 1pt win\n11th April \u2013 Grand National \u2013 Captain Cody 25/1 1pt win",
  originalHtml: "",
  selections: [
    { race: "Doncaster 2.55", horse: "Golden Strike", odds: "11/2", stake: "1 point win", category: "", analysis: "Golden Strike arrives at this assignment in fine fettle, having been kept busy on the all weather through the winter months, which should ensure peak fitness where others may need the run. It is worth noting that the application of a visor three starts ago has rejuvenated this thoroughly unexposed performer on turf. He has excellent course form, having gone desperately close off a mark of 72 here last summer, and he races off that very same mark today. The form received a boost when the horses who finished first and third at Newcastle last time have both won since, and this yard traditionally perform well on this card." },
    { race: "Doncaster 5.15", horse: "Territorial Knight", odds: "6/1", stake: "1 point win", category: "NAP", analysis: "Territorial Knight is a proven course and distance winner, having scored off a mark of 82, and with Jack Callan claiming five pounds today he is effectively racing off the same terms. It is worth noting that he went well first time out last season, so the absence since finishing fifth in the Bronze Cup at Ayr should not be a concern. A good performance from Golden Strike in the earlier contest would further enhance his claims, and if he returns in the same order as when last seen at Ayr, he ought to have every chance in this field. Don't say you weren't warned." },
    { race: "Doncaster 3.30", horse: "Folkene", odds: "20/1", stake: "0.75 points e/w (4 places)", category: "", analysis: "Folkene won first time out at Newmarket last season and the significant jockey booking of Jo Mason demands respect here. It is worth noting that Mason had the option of riding Stanage, who won on this card last year, yet she has deliberately chosen Folkene instead. Given she rode this horse to victory at Newmarket, she ought to have a very good idea which is the better proposition. He comes here fresh, boasting a record of two from two after a break, and is proven on both quick and soft ground. The yard have horses running well despite a lean spell with winners, and at 20/1 he represents considerable each way value." }
  ],
  doubles: "0.5pt e/w double on Golden Strike and Territorial Knight (5 places). 1pt win double on King Of Earth (Doncaster 2.20) and Munsif (Ascot 3.05).",
  antePost: "Lincoln Handicap - Eternal Force 10/1 1pt win. Grand National - Captain Cody 25/1 1pt win."
},
{
  id: "19d3512291d201de",
  originalSubject: "GM - 28th March",
  from: "The Inside Rail <info@theinsiderail.co.uk>",
  author: "GM",
  emailDate: "2026-03-28T15:31:15Z",
  tipDate: "2026-03-28",
  processedAt:  "2026-03-29T21:57:25Z",
  originalBody: "A busy day of open racing at various venues this evening. Three Cat 1 Finals, Monmore who host the Puppy Derby, Central Park who host the Kent Plate and Oxford who host the Hunt Cup decider. Dunstall Park sees the start of the Cat 1 Laurels and Cat 2 supporting Dunstall Dash.\n\nWe have our Ante Post bets to watch in the Monmore & Central Park Finals and in the heats of the Laurels & Dash at Dunstall Park.\n\nOutstanding AP bets:\n\nAnte Post \u2013 Ladbrokes Puppy Derby\nUnderground Gold 3 points win @ 10/3 Generally\n\nAnte Post \u2013 Kent Plate\nProper Heiress 4 points win @ 5/4 B365 & Hills\n\nAP Kent Plate \u2013 Added after Rd 1\nScooby the Lady 1 point win @ 12/1 Boylesports\n\nAnte Post \u2013 The Laurels\nFinal 11th April \u2013 1/4 odds 4 places\nWicky Ned 1.5 points win @ 6/1 Bresbet\nNot So Steady 0.5 point ew @ 40/1 Bresbet\n\nAnte Post \u2013 Arc Dunstall Dash\nFinal 11th April\nGood Aclaim 1.5 points win @ 4/1 Ladbrokes & Coral\nNewinn Souly 0.5 point win @ 10/1 Ladbrokes & Coral\n\nWe have a fair bit invested in our AP bets. I have been looking to see if there is anything worth betting on the supporting cards. Two bets.\n\nThe first is in the other Cat 1 Final at Oxford. Powerhouse Duke is unbeaten going into the decider and his early pace can win the day. Whatever leads at the first bend will likely win this \u00a310k Hunt Cup. Duke looks to have the gears to do just that and hold the inside line.\n\nUp at Dunstall Park Heat 5 of the Laurels is a cracker. There is so much early speed around something will have to give. The best place to be is on the inside and Bower Sheeran can outrun his odds if doing that. He\u2019s worth a small dart at a big price.\n\nTonights Bets:\nOxford 8.26 Powerhouse Duke 2 points win @ 3/1 Betfred\nDunstall Park 9.18 Bower Sheeran 0.5 point win @ 12/1 BF Sports Skybet & Power",
  originalHtml: "",
  selections: [
    { race: "Oxford 8.26", horse: "Powerhouse Duke", odds: "3/1", stake: "2 points win", category: "", analysis: "Powerhouse Duke goes into this Cat 1 Hunt Cup Final with an unbeaten record and possesses the early pace that could prove decisive in this contest. It is worth noting that whoever leads at the first bend will likely dictate terms in this \u00a310k decider, and Duke looks to have the gears to secure that crucial inside position. He has displayed consistently strong trap speed throughout the competition and arrives at the final in peak form. The evidence of the earlier rounds suggests he will take plenty of catching if he breaks smartly." },
    { race: "Dunstall Park 9.18", horse: "Bower Sheeran", odds: "12/1", stake: "0.5 point win", category: "", analysis: "Bower Sheeran is worth a speculative interest in what promises to be a fascinating Heat 5 of the Laurels at Dunstall Park. It is worth noting that with so much early speed drawn around him, something will have to give and the key to this race lies in securing the inside line through the first bend. If Bower Sheeran can trap smartly and take that rail position, he has the ability to outrun his generous odds considerably. At 12/1 he represents a small but well calculated dart at a big price in a race where the pace dynamics could fall in his favour." }
  ],
  doubles: "",
  antePost: "Ladbrokes Puppy Derby - Underground Gold 3pts win @ 10/3. Kent Plate - Proper Heiress 4pts win @ 5/4, Scooby the Lady 1pt win @ 12/1. The Laurels (Final 11th April) - Wicky Ned 1.5pts win @ 6/1, Not So Steady 0.5pt ew @ 40/1. Arc Dunstall Dash (Final 11th April) - Good Aclaim 1.5pts win @ 4/1, Newinn Souly 0.5pt win @ 10/1."
},

  originalBody: "BET SAGE\n\nPleasant Man found one too good yesterday.\n\nKempton 3.13 \u2013 Pina Sonata \u2013 1.5 point e/w at 6/1 (General \u2013 3 places)\nPina Sonata is best judged on her earlier form rather than her final run of last season, which came in much stronger company on unsuitable ground. She showed useful ability in her first two starts, winning on reappearance and backing that up under a penalty, and she returns here fresh which is clearly not an issue. The booking of Daniel Muscutt is notable as he prefers her over the stablemate, suggesting confidence in her chance. Back on a sound surface and in calmer waters, she can resume her progression.\n\nDoncaster 3.32 \u2013 Eternal Force \u2013 2 point win at 4/1 (General)\nEternal Force has clearly been trained with this race in mind and represents a yard with an outstanding record in the contest. Reports of his work at home have been very strong and he is believed to be a horse with plenty of class. He has improved since being gelded and arrives here unbeaten in that time, suggesting there is more to come. With ideal conditions, a favourable draw and a proven trainer and jockey combination in this race, everything points towards a big run.",

  selections: [

    { race: "Doncaster 3.32", horse: "Eternal Force", odds: "4/1", stake: "2 points win", category: "", analysis: "Eternal Force has clearly been prepared with this particular contest in mind and represents a yard boasting an outstanding record in the race. The form received a boost when reports from home confirmed he has been working very strongly, and connections believe him to be a horse possessing plenty of class. It is worth noting that he has improved markedly since being gelded, arriving here unbeaten in that time, which suggests there is more to come. With ideal conditions and a favourable draw, everything points towards a significant performance." }

      originalBody: "EARLY BIRD\n\nMy Ambition was second at 16/1 yesterday. Bras D’Or was a little disappointing.\n\nDoncaster 2.25 Intrusively - 0.75 point e/w at 11/1 (Paddy - 6 places)\nIntrusively is a fascinating runner on his first start for the shrewd Mick Appleby, who snapped him up for just 12,000 guineas at the horses in training sales. It is worth noting that he went up 19lb for a close third in the Richmond Stakes at Goodwood when still a maiden, which effectively compromised his entire three-year-old campaign. He showed he retained plenty of ability when fourth of 14 to Desperate Dan over course and distance in October despite a slow start and is now 5lb better off with that winner. Running as a first-time gelding off a tempting mark of 85, the form received a boost from the calibre of that Doncaster contest. Don’t say you weren’t warned.\n\nCurragh 2.30 Coul Dreamer - 0.5 point e/w at 20/1 (Hills - 4 places)\nCoul Dreamer has been disappointing since a career-best effort when second in a Clonmel maiden last September, but the application of a first-time visor makes him worth chancing off a mark of 73 over this longer trip. The form received a boost from Eternal Echo, who finished behind the front pair that day and went on to place in Listed bumper company. It is worth noting that the selection was far too keen on his handicap debut, which may explain his poor showing. If the headgear can help him settle, he could prove considerably better than his current rating suggests.",

<p>Doncaster 2.25 Intrusively – 0.75 point e/w at 11/1 (Paddy – 6 places)<br />

      originalBody: "Daily Digest - Saturday 28th March 2026:\n\nAs always, full bet summaries with staking are at the bottom.\nLet\'s crack on.\n\nDoncaster 2.25 - Spring Mile Handicap (1m):\n\nCadarn at 40/1 looks the type to go well fresh and could have been laid out for this valuable handicap. He remains lightly raced for a five-year-old and is well handicapped on the pick of his form from last season, when he won twice at Redcar in the spring. He\'s had nothing since August and now makes his debut for Kevin Ryan, a shrewd yard that excels with this type of project horse. The break is no concern and conditions should suit given his effectiveness with some cut in the ground. With a strong booking in place, he makes plenty of appeal at a massive price in a typically competitive renewal. He\'s got bits to prove for the new yard, no doubt, but at 40/1 with 6 places on offer, we can afford to take a swing.\n\nKempton 2.42 - Handicap (1m2f):\n\nMarhaba Ghaiyyath looks open to significant improvement for this step up in trip on the all-weather where he boasts figures of two wins and a second from three starts. The form of his Goodwood second behind a subsequent Listed winner received further boosts through third-placed Fort George, now rated 102 following Group 3 success in Meydan. That\'s strong form in the context of a race like this. He\'s had a winter break since a gelding operation and the Johnston yard are in fine form. His pedigree is a big plus too, being a half-brother to the high-class Fujiara Prince and Nichols Canyon, which suggests this longer trip will unlock further ability. At 5/1, I\'m happy to have a decent go.\n\nKempton 3.13 - Handicap (1m1f):\n\nPina Sonata represents the in-form James Fanshawe yard and could prove considerably better than her current mark on this surface. Her sole all-weather run to date resulted in an impressive success and she\'s a half-sister to Sky Safari, whose synthetic form reads an extraordinary 1111121 including a Group 3 victory. That family connection on the all-weather is hard to ignore. Coming here fresh shouldn\'t be a concern given she won first time out last season. The key detail is that Daniel Muscutt has opted to ride her over the stable\'s other entry, which speaks volumes about her wellbeing and how she\'s been working at home, which I am told is very well.\n\nBe Lucky\nG.J.",

        {race: "Kempton 2.42", horse: "Marhaba Ghaiyyath", odds: "5/1", stake: "1.5 point win", category: "", analysis: "Marhaba Ghaiyyath looks ideally placed stepping up in trip on a surface where his record reads two wins and a second from three outings. The form of his Goodwood second has worked out exceptionally well, with the third Fort George subsequently landing Group 3 honours in Meydan to earn a rating of 102. It is worth noting that his pedigree, being a half brother to the high class Fujiara Prince and Nichols Canyon, strongly suggests this longer distance will unlock further ability. The Johnston yard are in excellent form and a winter gelding operation could bring about further progress."},

      from: "From The Stables <postmaster@mg.fromthestables.com>",

      processedAt: "2026-03-28T09:50:00Z",
      originalBody: "Saturday, 28th March, 2026\n\nTODAY\'S FEATURED STABLES\nB Pauling, D Cunha, F M O\'Brien, J & S Birkett, J Morland, J Portman, J Snowden, O Sangster, R Teal\n\nFTS FEATURE BETS\n\nTONY\'S NAP\n17:03 Kempton Park - Tuco Salamanca (4/1)\nFor all that he won five races last year, with luck Tuco Salamanca could have collected at least two more. He starts in a race that should be run to suit, with that flying finish likely to prove the telling factor for Ollie\'s nice sprinter.\n\nTONY\'S NEXT BEST\n17:15 Doncaster - Dancing Tiger (6/1)\nDancing Tiger is one horse that will appreciate today\'s ground. Roger\'s progressive 4yo can get his season off to a winning start in this apprentices\' handicap.\n\nTONY\'S TREBLE\n15:08 Uttoxeter - As Legends Have It (2/1)\nAs Legends Have It has been remarkably leniently treated for his win last time out. The two Bens will be at it again!\n\nTODAY\'S FTS RUNNERS\n\n13:20 Doncaster - Step To Glory (14/1)\nTrainer D Cunha: \"Step To Glory is bred to be quick and on what we see at home, speed seems to be his best quality. Whether he is good enough to replicate Zminiature\'s win in the race two years ago is another question, but we go there today with some optimism.\"\n\n13:40 Stratford - Alibey (13/2)\nTrainer D Cunha: \"Alibey ran far better than her 125/1 price suggested when a decent 5th last time at Huntingdon. She is finding her feet over jumps and hopefully will get closer here although the favourite will be tough to beat.\"\n\n14:35 Uttoxeter - No No Fizz (13/2)\nTrainer F M O\'Brien: \"No No Fizz returned from a break with a good win last time. This is a step up in grade for her off a 4lb higher mark, but she is an honest mare who should run well. Any rain would be a negative though.\"\n\n15:08 Uttoxeter - Admiral Stewart (5/1)\nTrainer J Snowden: \"Admiral Stewart was a useful novice hurdler last season and was left with a walkover on his chase debut this autumn. He didn\'t get far on his next start as he went into arrhythmia. Things haven\'t fallen kindly for him subsequently, and he has had a wind-op since his latest run. He is in good form at home, so hopefully he can show here what we believe he is capable of.\"\n\n15:08 Uttoxeter - As Legends Have It (2/1)\nTrainer B Pauling: \"As Legends Have It emphatically opened his chase account with a wide-margin win at Stratford last time. He hasn\'t been over-penalised for it and we have to be optimistic that he can follow up here.\"\n\n15:13 Kempton Park - Glistening (150/1)\nTrainer O Sangster: \"Glistening is off to stud after this. A winner this year, she wears first-time cheek-pieces and while she has a bit to find to get in the first three or four, she tries hard and it would be great if she finishes off on a high note.\"\n\n15:45 Uttoxeter - Bank On Frank (2/1)\nTrainer B Pauling: \"Bank On Frank, in contrast to As Legends Have It, has been lumbered with a 10lb rise for his easy last time win at Southwell. With only one previous chase run before that, we are hopeful there is still improvement to come. Good chance.\"\n\n16:20 Uttoxeter - Champagne Twist (12/1)\nTrainer B Pauling: \"After three pulled up efforts, at least Champagne Twist completed last time, albeit a long way behind the winner. We\'re still remembering the EBF Final win two years ago, but obviously his recent form is a long way off that.\"\n\n16:33 Stratford - Politacus (4/1)\nTrainer F M O\'Brien: \"Politacus is slowly refinding her form after a long break. She ran well last time and a reproduction of that should see her go close. Ideally, we would prefer her to compete against fellow mares but opportunities are restricted as she needs to race left-handed over fences. On a winnable mark, so hopeful.\"\n\n16:40 Doncaster - Expressionless (6/1)\nTrainer D Cunha: \"Expressionist confirmed his liking for Nottingham with a good win early in October, but an extra 2f and 11st2lb to carry in an amateurs\' race at Newbury proved just beyond him. Still, 4th there was creditable and now in an apprentices\' race over his correct trip, we have to be hopeful.\"\n\n16:40 Doncaster - Bownder (7/1)\nTrainer J Portman: \"Bownder is in good form and has been running with consistency over the winter. Hopefully he can be competitive in this.\"\n\n16:55 Uttoxeter - Baron Du Brizais (9/4)\nTrainer B Pauling: \"Baron Du Brizais was bought out of our former jockey Luca Morgan\'s yard after impressively winning an English point-to-point on debut in November. He has a nice French pedigree and has shown us plenty at home. Hopeful.\"\n\n17:03 Kempton Park - Seraphim Angel (40/1)\nTrainer O Sangster: \"Seraphim Angel might be a bit over-priced for her initial run for us and her first start since she won at Windsor in July. Loose each-way chance although she might just need it.\"\n\n17:03 Kempton Park - Tuco Salamanca (4/1)\nTrainer O Sangster: \"Tuco Salamanca is in good nick and I\'m happy with him. Hopeful of a big run, although he will improve for the outing.\"\n\n17:08 Stratford - Caliach Point (11/2)\nTrainer B Pauling: \"Caliach Point was runner-up at Doncaster in November, but has disappointed twice since including on handicap debut at Newbury last time. The cheek-pieces might help him concentrate, hopefully so as he shows enough ability at home to win a race of this nature.\"\n\n17:15 Doncaster - Dancing Tiger (6/1)\nTrainer R Teal: \"They\'ve had some rain overnight at Doncaster and that won\'t do Dancing Tiger any harm. He returns after five months away from the track, so might improve a little for the run, but if his fitness holds up he should go very well.\"\n\n17:30 Southwell - Rusheen Boy (6/1)\nTrainer J & S Birkett: \"Rusheen Boy bounced back to winning ways last run. He remains in the same grade and is in good form at home. Sean Kirrane won on him last year so we hope he has an each-way chance today.\"\n\n18:00 Southwell - Mayaada (16/1)\nTrainer O Sangster: \"Mayaada seems to have improved from two to three. It\'s not a bad race but I reckon she has an each-way shout.\"\n\n18:30 Southwell - Battle Standard (80/1)\nTrainer J Morland: \"Battle Standard is a nice young horse that showed obvious signs of inexperience when making his debut here last week. I\'m expecting improvement on that today and again next time. He\'ll be one for handicaps over ten furlongs later on.\"\n\n18:30 Southwell - Street Dancer (150/1)\nTrainer O Sangster: \"Street Dancer has had a couple of runs. Low-grade handicaps beckon after today.\"",
      originalHtml: "",
      selections: [
        {race: "Kempton 5.03", horse: "Tuco Salamanca", odds: "4/1", stake: "1 point win", category: "NAP", analysis: "Tuco Salamanca won five times last season and with any luck the tally could have been higher still. It is worth noting that trainer Ollie Sangster speaks with genuine enthusiasm about this sprinter, who returns in a race that should be run to suit his style of racing. That trademark flying finish is likely to prove the telling factor and while improvement for the outing is expected, the yard clearly feel he is ready to do himself justice. A strong proposition at the very least and the confidence behind him is palpable. Don\'t say you weren\'t warned."},
        {race: "Doncaster 5.15", horse: "Dancing Tiger", odds: "6/1", stake: "1 point win", category: "NB", analysis: "Dancing Tiger is one horse who will appreciate the cut in the ground following overnight rain at Doncaster. It is worth noting that Roger Teal\'s progressive four year old showed solid form through last season and a five month break should have freshened him up nicely. The apprentices\' handicap looks a suitable starting point for his campaign and his trainer clearly feels the conditions will play to his strengths. If his fitness holds up, he should be firmly involved at the business end of proceedings."},
        {race: "Uttoxeter 3.08", horse: "As Legends Have It", odds: "2/1", stake: "1 point win", category: "", analysis: "As Legends Have It emphatically opened his chasing account with a wide margin victory at Stratford last time and arrives here having not been over penalised for that success. It is worth noting that trainer Ben Pauling speaks with quiet confidence about his prospects, suggesting the step up in grade is a natural progression for a horse who won with considerable authority. The expectation from connections is that further improvement lies ahead and he looks the type to take high rank over fences."}

      originalBody: "ZENITH BETTING\n\nMixedwave ran ok yesterday in 3rd.\n\nDoncaster 2.25 - Classic Encounter - 1 point e/w at 15/2 (Bet365 - 6 places)\nClassic Encounter shaped like a horse capable of landing a race of this nature last season, holding his own in strong handicaps and finishing his campaign with a solid effort at Newmarket. He is able to race off a slightly lower mark than when unlucky in a deeper contest at Sandown and his stamina at this trip is assured. The slight concern is the ground, but if handling conditions, his hold up style should see him finishing strongly and he looks a big player.\n\nKempton 2.42 - Marhaba Ghaiyyath - 1.5 point win at 5/1 (General)\nMarhaba Ghaiyyath remains open to improvement, particularly stepping up in trip on a surface he clearly handles well. His all weather record is strong and his Goodwood second has worked out well, with the form boosted since. The gelding operation over the winter could bring about further progress and his pedigree suggests this longer distance will suit. With the yard in good form and conditions in his favour, he looks set to run a big race.\n\nRegards\nThe Inside Rail",
      originalHtml: "",
      selections: [
        {race: "Doncaster 2.25", horse: "Classic Encounter", odds: "15/2", stake: "1 point e/w (6 places)", category: "", analysis: "Classic Encounter shaped throughout last season like a horse capable of landing a valuable handicap of this nature, holding his own in strong company and finishing his campaign with a solid effort at Newmarket. It is worth noting that he is able to race off a slightly lower mark than when unlucky in a deeper contest at Sandown and his stamina at this trip is assured. The slight concern is the prevailing ground but if handling conditions, his trademark hold up style should see him finishing strongly through beaten horses. He looks a significant player at the price."},
        {race: "Kempton 2.42", horse: "Marhaba Ghaiyyath", odds: "5/1", stake: "1.5 point win", category: "", analysis: "Marhaba Ghaiyyath remains open to significant improvement on a surface where he clearly excels, with his all weather record standing up to the closest scrutiny. The form of his Goodwood second received a substantial boost through subsequent winners emerging from that race. The gelding operation over the winter could bring about further progress and his pedigree suggests this longer distance will be very much in his favour. With the yard in fine form and conditions to suit, a big run looks assured."}
