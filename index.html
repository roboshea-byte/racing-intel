<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f7f7f7;font-family:'JetBrains Mono','SF Mono',monospace;color:#000}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#aaa}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

nav{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-icon span{color:#fff;font-size:13px;font-weight:700;font-family:'Inter',sans-serif}
.logo-text{font-family:'Inter',sans-serif;font-size:16px;font-weight:700;letter-spacing:-0.4px}
.logo-badge{font-size:10px;font-weight:500;color:#999;background:#f3f3f3;padding:3px 8px;border-radius:5px;letter-spacing:0.4px}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-sync{padding:9px 20px;background:#000;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;display:flex;align-items:center;gap:7px}
.btn-sync:hover{background:#222;box-shadow:0 3px 10px rgba(0,0,0,0.12)}
.btn-sync:disabled{background:#f5f5f5;color:#aaa;cursor:not-allowed}

/* Page tabs */
.page-tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid #eee}
.page-tabs-inner{max-width:1400px;margin:0 auto;padding:0 28px;display:flex;gap:0}
.page-tab{padding:14px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;color:#aaa;cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;transition:all .1s}
.page-tab:hover{color:#666}
.page-tab.active{color:#000;border-bottom-color:#000}

/* Layout */
.main-layout{max-width:1400px;margin:0 auto;padding:18px 28px 48px;display:flex;gap:18px}
.date-sidebar{width:180px;min-width:180px;flex-shrink:0}
.date-sidebar h4{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;color:#999;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.date-item{padding:9px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:#777;transition:all .1s;margin-bottom:2px;font-family:'Inter',sans-serif}
.date-item:hover{background:#eee;color:#333}
.date-item.active{background:#000;color:#fff}
.date-count{float:right;font-size:10px;opacity:0.5}

.main-content{flex:1;min-width:0}
.status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:500;margin-bottom:16px;animation:fadeUp .3s ease}
.status-bar.info{background:#f8f9ff;border:1px solid #e0e4ff;color:#446}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:13px;opacity:0.25}
.search-wrap input{width:100%;padding:11px 14px 11px 36px;background:#fff;border:1px solid #eee;border-radius:9px;color:#000;font-size:13px;font-family:inherit;font-weight:400;transition:all .12s}
.search-wrap input:focus{outline:none;border-color:#000}
.search-wrap input::placeholder{color:#c0c0c0;font-weight:400}
.filter-group{display:flex;gap:3px;background:#fff;border-radius:9px;padding:3px;border:1px solid #eee}
.filter-btn{padding:7px 12px;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .1s;background:transparent;color:#aaa;white-space:nowrap}
.filter-btn:hover{background:#eee}
.filter-btn.active{background:#000;color:#fff}

/* Content */
.content{display:flex;gap:14px;align-items:flex-start}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;flex:1}
.cards-list{display:flex;flex-direction:column;gap:8px;width:360px;min-width:360px;max-height:calc(100vh - 240px);overflow-y:auto;flex-shrink:0}

/* Date group header */
.date-header{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;padding:12px 0 6px;grid-column:1/-1}

/* Cards */
.card{background:#fff;border-radius:10px;padding:18px;cursor:pointer;border:1.5px solid transparent;transition:all .12s ease;animation:fadeUp .3s ease forwards;opacity:0}
.card:hover{border-color:#000;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.card.selected{border-color:#000;background:#fff}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-from{font-size:11px;font-weight:600;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.card-time{font-size:11px;font-weight:500;color:#ccc}
.card h3{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:#111;line-height:1.35;margin-bottom:8px;letter-spacing:-0.2px}
.card-excerpt{font-size:12px;color:#999;line-height:1.55;margin-bottom:12px;font-weight:300}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-sels{font-size:11px;color:#bbb}

/* Reader */
.reader{flex:1;background:#fff;border:1px solid #eee;border-radius:12px;max-height:calc(100vh - 240px);overflow-y:auto;animation:slideRight .25s ease forwards}
.reader-header{padding:20px 24px;border-bottom:1px solid #f5f5f5}
.reader-meta{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.reader-meta .from{font-size:12px;font-weight:500;color:#888}
.reader-meta .dot{width:3px;height:3px;border-radius:50%;background:#ddd}
.reader-meta .date{font-size:12px;color:#bbb}
.reader h2{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#000;line-height:1.3;letter-spacing:-0.3px}
.reader-close{background:#f5f5f5;border:none;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:14px;color:#999;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .1s}
.reader-close:hover{background:#eee;color:#666}

/* View toggle */
.view-tabs{display:flex;gap:0;margin:0 24px;border-bottom:1px solid #eee}
.view-tab{padding:12px 20px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;color:#aaa;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .1s}
.view-tab:hover{color:#666}
.view-tab.active{color:#000;border-bottom-color:#000}

/* Email body */
.email-body{padding:22px 24px;font-size:13px;line-height:1.75;color:#333}
.email-body p{margin-bottom:10px}

/* Rewrite */
.rewrite-body{padding:22px 24px}
.selection-block{margin-bottom:28px}
.selection-header{font-size:13px;font-weight:700;color:#000;margin-bottom:4px}
.selection-analysis{font-size:13px;line-height:1.8;color:#333;font-weight:400;padding-left:20px;border-left:2px solid #000;margin-left:2px;margin-top:10px}
.no-analysis{font-size:11px;color:#bbb;font-style:italic;margin-top:6px}

/* Copy bar */
.copy-bar{display:flex;justify-content:flex-end;padding:12px 24px;border-bottom:1px solid #f5f5f5}
.btn-copy{padding:6px 12px;background:#f8f8f8;border:1px solid #eee;border-radius:6px;font-size:12px;font-weight:500;color:#888;cursor:pointer;font-family:inherit;transition:all .1s}
.btn-copy:hover{background:#f0f0f0}

/* Empty */
.empty{grid-column:1/-1;text-align:center;padding:80px 20px}
.empty h3{font-family:'Inter',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13px;color:#bbb;max-width:320px;margin:0 auto;line-height:1.5}
.last-synced{font-size:11px;color:#bbb;font-family:'Inter',sans-serif}
.sync-indicator{width:6px;height:6px;border-radius:50%;background:#4b4;display:inline-block;margin-right:4px}

/* All Selections */
.all-sel-block{background:#fff;border-radius:10px;padding:18px 22px;margin-bottom:10px;border:1px solid #eee;animation:fadeUp .3s ease forwards;opacity:0}
.all-sel-race{font-size:11px;font-weight:600;color:#999;margin-bottom:4px;font-family:'Inter',sans-serif;letter-spacing:0.3px}
.all-sel-horse{font-size:15px;font-weight:700;color:#000;font-family:'Inter',sans-serif;letter-spacing:-0.2px}
.all-sel-details{font-size:12px;color:#777;margin-top:3px}
.all-sel-analysis{font-size:13px;line-height:1.8;color:#333;padding-left:20px;border-left:2px solid #000;margin-left:2px;margin-top:12px}
.tipster-badge{display:inline-block;padding:3px 8px;background:#f3f3f3;border-radius:5px;font-size:10px;font-weight:600;color:#777;font-family:'Inter',sans-serif;margin-left:8px;vertical-align:middle}
.category-badge{display:inline-block;padding:3px 8px;background:#000;border-radius:5px;font-size:10px;font-weight:700;color:#fff;font-family:'Inter',sans-serif;margin-left:6px;vertical-align:middle}

/* Bet Summary */
.bet-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
.bet-table th{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;padding:14px 16px;text-align:left;border-bottom:1px solid #eee;background:#fafafa}
.bet-table td{font-size:13px;padding:12px 16px;border-bottom:1px solid #f5f5f5;color:#333}
.bet-table tr:last-child td{border-bottom:none}
.bet-table tr:hover td{background:#fafafa}

/* Tipster filter */
.tipster-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:10px;border:1px solid #eee}
.tipster-filter-label{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;margin-right:4px;white-space:nowrap}
.tipster-check{display:flex;align-items:center;gap:5px;cursor:pointer;padding:5px 10px;border-radius:7px;transition:all .1s;user-select:none}
.tipster-check:hover{background:#f3f3f3}
.tipster-check input[type=checkbox]{accent-color:#000;width:14px;height:14px;cursor:pointer}
.tipster-check label{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:#555;cursor:pointer;white-space:nowrap}
.tipster-check.checked label{color:#000;font-weight:600}
.tipster-filter-actions{margin-left:auto;display:flex;gap:6px}
.tipster-filter-actions button{padding:5px 10px;border:1px solid #eee;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;background:#f8f8f8;color:#777;transition:all .1s}
.tipster-filter-actions button:hover{background:#eee;color:#333}

/* Delete button */
.btn-delete{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .1s;opacity:0}
.card:hover .btn-delete{opacity:1}
.btn-delete:hover{background:#fee;color:#c33}
.card{position:relative}

/* Delete confirm overlay */
.delete-confirm{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:200;display:flex;align-items:center;justify-content:center}
.delete-dialog{background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.15)}
.delete-dialog h3{font-family:Inter,sans-serif;font-size:15px;font-weight:700;margin-bottom:6px}
.delete-dialog p{font-size:12px;color:#888;margin-bottom:18px;line-height:1.5}
.delete-dialog-btns{display:flex;gap:8px;justify-content:center}
.delete-dialog-btns button{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;border:none;transition:all .1s}
.btn-cancel{background:#f3f3f3;color:#666}
.btn-cancel:hover{background:#eee}
.btn-confirm-delete{background:#c33;color:#fff}
.btn-confirm-delete:hover{background:#a22}
</style>
</head>

const AUTHOR_MAP = {
  "Ben": ["Racing Analyst", "Ben from"],

  "EVR": ["Everything Racing", "EVR"],

};

function getAuthor(article) {
  if (article.author) return article.author;
  var check = (article.from || "") + " " + (article.originalSubject || "");
  for (var name in AUTHOR_MAP) {
    var patterns = AUTHOR_MAP[name];
    for (var i = 0; i < patterns.length; i++) {

    originalBody: "Daily Digest - Tuesday 24th March 2026:\n\nScaredofnothing is a non-runner now. The BHA website has the reason down as ground, which seems odd to me, as the ground should be just about ideal i'd have thought. He had been backed in from 9/1 to 11/2 so I guess that is probably why, connections didn't get their money on.\n\nNothing else stands out as a bet today so we'll be back tomorrow.\n\nBet Summary:\nSouthwell 3.00 - Scaredofnothing - 1 point e/w (9/1) Bet365 3 places - Non-runner\n\nBe Lucky\nG.J.",

    emailDate: "2026-03-24T08:58:54Z",
    tipDate: "2026-03-24",
    processedAt: "2026-03-25T10:39:42Z",
    originalBody: "Tuesday 24th March 2026\n\nI head over to Taunton for one selection on Tuesday, and this comes within the 3.15, which is a Class 5 handicap hurdle that\u2019s set to be ridden over two miles and half of a furlong. Robert Walford could hold the key here with the five-year-old ST LUKES CHELSEA, who\u2019s the mount of Freddie Gingell. This gelding by Territoires will be looking to end his unwanted record of sixteen runs without success; however, this could be the time to catch him. He was only beaten by three-quarters of a length when third of ten over course and distance last time out, and that run came within Class 4 company. He\u2019s only a pound higher here, and he should give a bold account.\n\nSt Lukes Chelsea - (9/4) - (1pt) (Win)\n\n3.15 Taunton.",

  {
    id: "19d1d7a77524db5c",
    originalSubject: "Boom Doctor - 24th March",
    from: "Boom Doctor (via Rob)",
    author: "Boom Doctor",
    emailDate: "2026-03-24T01:34:14Z",
    tipDate: "2026-03-24",
    processedAt: "2026-03-25T00:40:00Z",
    originalBody: "BOOM DOCTORS HORSES FOR TUESDAY'S RACING\n\nGood afternoon all a very solid and profitable return last week unlucky not to bring in more profit than we did but any profit can't be sniffed at.\n\n6.30 Wolves\nShatin Venture\n14/1 - EACH WAY (B365)\n- EACH WAY (SKYBET) 4 Places Paid\n\nClassified Stakes action here and I'm willing to give the selection a chance here back at Wolves and upped to 6f.\n\nHe wasn't beaten far when last running here in a standard cl6 handicap over 5f and although briefly outpaced he appeared to pick up again close home and was also briefly short room, having to settle for 4th.\n\nHe's not the sort to win on the bridle but at this level and trying over the extra furlong he could be a value selection at likely decent opening price.\n\nAs always all selections are advised at 1point each way singles unless otherwise stated so please don't just do a multiple, singles will make you most profit year in year out here, and remember this is longshot betting you only usually need 1 place or 1 win a day for good profits\n\nGood luck",

      }

  {
    id: "19d1d4c5c229ddb2",
    originalSubject: "Joe Napier - 24th March",
    from: "Joe Napier (via Rob)",
    author: "Joe Napier",
    emailDate: "2026-03-24T00:43:52Z",
    tipDate: "2026-03-24",
    processedAt: "2026-03-25T00:10:00Z",
    originalBody: "Taunton Racing Tips (Tuesday 24 March)\n\nTuesday's meeting at Taunton sees Paul Nicholls come to town at the Somerset rack. Across the seven-race card, he has four runners, with one of those among our tips.\n\n3.45 Taunton \u2013 Wicked Thoughts (1pt win \u2013 10/3)\n\nIt is worth forgiving Wicked Thoughts a fractious run at Exeter last time. Increasingly, it looks as though the seven-year-old is a better horse when fresh. Two of his three wins have come after over 100 days off the track. His other victory, in a four-runner Ascot maiden, is an outlier and came in his easiest winning assignment. As such his second run of this season, after only a 43-day break, is forgiven, as he won on return over course and distance in game fashion. Just 2lb higher than for that win, he should be capable of better yet over fences. To boot, his trainer Paul Nicholls has had more winners at Taunton than anywhere else in the last five years.\n\n4.15 Taunton \u2013 Khafre (1pt win \u2013 7/2)\n\nAn impressive win here last month could set Khafre up to win on his handicap debut. The selection won a point-to-point in January 2015 before debuting under rules this season. He ran well in mid-division in two strong maiden and novice events at Cheltenham and Wincanton respectively. Upped to 2m3f at this venue, he then beat two former winners in good style. He was receiving weight in penalties from those rivals, but that performance strongly suggested that he will win multiple races. An opening mark of 118 is not too harsh and Paddy Hanlon takes off a further 5lb.\n\nWolverhampton Racing Tips (Tuesday 24 March)\n\nWolverhampton hosts nine races across their bumper Tuesday card. We have two best bets in the classified contests.\n\n6.30 Wolverhampton \u2013 Top Star (1pt win \u2013 11/1)\n\nHaving slipped to a rating of 50, Top Star is now eligible for this classified race. His last run for Richard Hughes came at this track in September 2024, when a competitive fourth of eight. After being gelded and enduring a 495-day wait on the sidelines, he returned saddled by Dean Ivory at Chelmsford. His two runs at that Essex venue this term have been poor. However, he was second in between at Southwell, showing he still possesses some racing ability. Tapeta likely suits better than Polytrack and he drops into as winnable a race as possible here. The step up to 6f is not seen as a negative.\n\n7.00 Wolverhampton \u2013 Dr Ali (1pt win \u2013 10/3)\n\nAfter failing to win any of his first 17 starts, Dr Ali finally got his head in front at Kempton. That success in January came in a bunched finish, but was likely achieved in a stronger contest than this. In just his second run in a classified race, he was beaten just a neck over course and distance latest. He has learned to race more gamely than he did before and is joint highest-rated here. There is no issue with his draw and he should be heavily involved.\n\nGG Lucky 15 Tips \u2013 Tuesday 24 March\n\n3.45 Taunton \u2013 Wicked Thoughts\n4.15 Taunton \u2013 Khafre\n6.30 Wolverhampton \u2013 Top Star\n7.00 Wolverhampton \u2013 Dr Ali",

    originalBody: "Thistle Be The One\n3.15 Taunton\n2pts win\n\nTreasure Planet\n4.15 Taunton\n1pt win\n\nAngry Ant\n4.55 Wolverhampton\n1pt win\n\nThistle Be The One jumps off the page dropped into a 0-100 for the first time in the 2m\u00bdf handicap hurdle (3.15) at Taunton considering he's spent most of his career running against a different class of animal.\n\nThis horse looked set for big things two seasons ago. He beat West Hill Verde and Woodland Park, who are now rated 124 and 125 over hurdles, in a Kempton bumper on his first start under rules before finishing ahead of Califet En Vol and C'Est Ta Chance, novice chasers who are now rated in the 140s, when second in an Ayr bumper on Scottish Grand National day eight weeks later.\n\nSent off a 3-1 chance on his hurdles debut 16 months ago against the classy Miami Magic, who was second in the Grade 1 Formby next time, Thistle Be The One showed the benefit of that reappearance fifth by finishing second in back-to-back novice hurdles at Taunton behind Alexei and French Ship.\n\nAlexei is one of the highest-rated hurdlers in Britain now after finishing fourth in the Champion Hurdle and talented stayer French Ship isn't a million miles off him with a BHA rating of 146.\n\nThe return to Taunton, plus the fitting of a first-time visor and booking of good 5lb claimer Toby McCain-Mitchell, are reasons to expect better from Thistle Be The One on just his fourth run for Ben Clarke after departing Keiran Burke.\n\nThe selection admittedly ran poorly when a remote fourth to Mondo Man at Plumpton a month ago, but it was his first start in a tongue-tie off an 81-day break and Mondo Man has since run out an impressive winner of the Imperial Cup.\n\nThe three other handicap hurdles Thistle Be The One has contested were 0-120s and he's been given a right chance by the handicapper to be eligible to run in a grade this low.\n\nIt is still relatively early days for the seven-year-old, whose jockey has ridden five winners, four seconds and four thirds in 25 rides for Clarke (+\u00a36.08 level-stakes profit).\n\nThe other wager I'll be having at Taunton is Treasure Planet in the 2m3f handicap hurdle (4.15).\n\nTreasure Planet was a decent operator on the Flat for Donnacha O'Brien (Racing Post Ratings of 80 and 79 in two starts for the trainer last spring) and was a cracking second in a hot novice handicap at Newbury last month following an 84-day break.\n\nQueenie St Clair was a remote fifth and last Saturday she won a \u00a3100,000 handicap hurdle at Kelso on Go North Weekend.\n\nTreasure Planet may be Flat-bred, but he gives the impression he'll be suited by this longer trip and it's encouraging that his brother, Isotope, recorded his best hurdles efforts at intermediate distances.\n\nI wouldn't put anyone off sticking Treasure Planet in a related double wager with Sutherland, who was third in that warm Newbury contest and attempts to do his bit for the form in the 2m4\u00bdf handicap hurdle at Southwell (4.30).\n\nWhile Paul Nicholls' form could be better, his recent runners have been showing more than the bare data implies.\n\nThe final wager is Angry Ant in the 1m\u00bdf handicap (4.55) at Wolverhampton.\n\nAngry Ant has been given a reprieve by the handicapper, having plummeted 12lb in the weights since late January, and her latest fifth over course and distance was a promising one.\n\nShe found herself wider than everything rounding the home bend and was caught too far back in a slowly run race. There was definitely more in the tank and Jamie Osborne has won with two of his past four runners. She's drawn better here and this could be the time to catch her.",

    processedAt: "2026-03-23T22:55:00Z",
    originalBody: "Hello Andy\n\nHere are today's selections.\n\n23rd March 2026\n\nAnother brilliant week done, fingers crossed for the next.\n\nAgain, it will be a week of hardly any tips in the early part, with a busier end to it.\n\nHowever, there is a double from Ditcheat on Monday.\n\n4.05 Kempton WELCOM TO CARTRIES 3/1 1pt win NB\n\n4.57 Wincanton SWINGING SAFARI 5/1 1pt win NAP\n\n0.5pt Win Double\n\nWELCOM TO CARTRIES won for us at Sandown, two starts ago, and I expect him to bounce back from a poor effort last time out, with a return to form here. It's clear, from his form, that he doesn't like soft ground and the return to a quicker surface ought to suit better here. As I explained the day he won, he was always felt to be a horse of graded class and he's still lightly enough raced to be open to loads of improvement. It looks noteworthy that Harry Cobden, who I feel could have had at least two winners on his doorstep today, heads to Kempton instead for this one ride.\n\nThe fact that Harry Cobden is at Kempton, is the only negative I can see for SWINGING SAFARI, who makes his handicap debut off what looks like a very winnable mark. I actually tipped him first time out this season, when falling at the last. He might not have won that day, but the 1st and 2nd he was battling along side, have kept a very good level of form since. He won with ease next time out, at this track, before finishing a well beaten 3rd at Kempton in another maiden. Sent off the 10/3 2nd fav that day, the result looked disappointing, but the subsequent form suggests that he had an impossible task racing off level weights with Baron Noir, who is now rated 146 after a close 4th in the Supreme two weeks ago. The 2nd has placed grade 2 form too. He was poor on soft ground at Fakenham last time out, but that wouldn't be a track that many horses take to and I suspect that going left handed just isn't for him. Back right handed, and 2 from 2 at the track, he makes his handicap debut here with the addition of the first time tongue tie. Nicholls has an 18% strike rate with his handicap hurdle debutants (\u00a3127 level stakes profit) and a 23% strike rate with his horses wearing a tongue tie first time too. The yards horses are in good form and Freddie Gingell, who has a 20% strike rate when riding for the yard, is booked. Of the rest, AMBION VIEW is the only horse I can see giving him anything to think about, but I think he wants further.\n\nAnte Post Already Advised\n28th March \u2013 Lincoln Handicap \u2013 ETERNAL FORCE 10/1 1pt win\n11th April \u2013 Grand National \u2013 CAPTAIN CODY 25/1 1pt win",

    originalBody: "Last Nights Review\nMonmore & Central Park\n\nFirst things first the max bet landed with the minimum of fuss. Scooby the Lady followed the fast starting Cinderella Tell round and took it up at the third bend to win in the fastest of the three semis. The treble bombed only Scooby winning the other two selections were second.\n\nAnte Post\nWe have all our selections through in to next week. Proper Heiress did it right in his semi leading up Headford Dane to win comfortably and join Scooby the Lady in the Final. Over at Monmore Underground Gold overcame his trap four draw showing good early to clear the bend and go onto victory.\n\nI did mean to send a no bets yesterday but I forgot. Towcester is a watching brief until the new traps bed in as we are getting faster split times and end times as a result. Which doesn't make it easy for form purposes. Sheffield had three opens but nothing appealed at a price for a bet.\n\nTonight\nNottingham has a handful of opens but in truth it's very poor fare.\n\nDecided to put one up at Yarmouth in an A2 graded race. I think it's a winnable race for Alfie's Lad if he puts his best foot forward this evening. He should get a good tow into the race from his kennel mate Rockmount Nellie on her first four bend race since the start of January, before proving to strong coming home.\n\nTonight's Bet\nYarmouth 8.31 Alfie's Lad 2 points win @ 2/1 BF Sports Power & Skybet.",

  });
  html += '<div class="tipster-filter-actions">';
  html += '<button onclick="setAllTipsters(true)">' + (allChecked ? '&#10003; All' : 'Select All') + '</button>';
  html += '<button onclick="setAllTipsters(false)">Clear</button>';
  html += '</div></div>';
  return html;
}

// ─── HELPERS ───
function timeAgo(d) { if(!d)return""; var m=Math.floor((Date.now()-new Date(d).getTime())/60000); if(m<1)return"now"; if(m<60)return m+"m"; var h=Math.floor(m/60); if(h<24)return h+"h"; return Math.floor(h/24)+"d"; }
function formatDate(d) { if(!d)return""; return new Date(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function dateLabel(d) { if(!d)return""; return new Date(d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function shortDateLabel(d) { if(!d)return""; var parts = d.split("-"); var dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function escapeHtml(t) { if(!t) return ""; var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }

// Extract time from race string for sorting, e.g. "Kempton 4.05" -> 405
function raceTime(raceStr) {
  var m = (raceStr || "").match(/(\d{1,2})[\.:]+(\d{2})/);
  if (m) return parseInt(m[1]) * 100 + parseInt(m[2]);
  return 9999;
}

// Get all unique tipDates (count = number of emails, not selections)
function getTipDates() {
  var dates = {};
  var deduped = getDeduplicatedArticles();
  deduped.forEach(function(a) {
    if (a.tipDate) {
      if (!dates[a.tipDate]) dates[a.tipDate] = 0;
      dates[a.tipDate] += 1;
    }
  });
  return Object.keys(dates).sort().reverse().map(function(d) { return { date: d, count: dates[d] }; });
}

// Get all selections for a date, sorted by race time
function getSelectionsForDate(tipDate) {
  var sels = [];
  ARTICLES.forEach(function(a) {
    if (tipDate !== "all" && a.tipDate !== tipDate) return;
    var auth = getAuthor(a);
    if (a.selections) {
      a.selections.forEach(function(s) {
        sels.push({
          race: s.race,
          horse: s.horse,
          odds: s.odds,
          stake: s.stake,
          category: s.category,
          analysis: s.analysis,
          tipster: auth,
          tipDate: a.tipDate
        });
      });
    }
  });
  sels.sort(function(a, b) { return raceTime(a.race) - raceTime(b.race); });
  return sels;
}

// ─── SYNC ───
function requestSync() {
  var btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.innerHTML = '<span>syncing<span style="animation:blink 1s step-end infinite">_</span></span>';
  document.getElementById("statusArea").innerHTML = '<div style="max-width:1400px;margin:12px auto 0;padding:0 28px"><div class="status-bar info"><span style="width:6px;height:6px;border-radius:50%;background:#66f;flex-shrink:0"></span>Sync requested. Open Cowork and say <strong>"sync"</strong> to pull new emails, or wait for the next scheduled sync.</div></div>';
  setTimeout(function() { btn.disabled = false; btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4 9a9 9 0 0 1 15.36-3.36"/><path d="M20 15a9 9 0 0 1-15.36 3.36"/></svg>Sync Now'; }, 3000);
}

// ─── COPY ───
function copyRewrite(id) {
  var a = ARTICLES.find(function(x) { return x.id === id; }); if(!a||!a.selections) return;
  var t = ""; a.selections.forEach(function(s) { t += s.race+" "+s.horse+" - "+s.stake+" at "+s.odds; if(s.category)t+=" ("+s.category+")"; t+="\n"; if(s.analysis)t+="\n"+s.analysis+"\n"; t+="\n"; });
  if(a.doubles) t+=a.doubles+"\n\n"; if(a.antePost) t+="Ante Post\n"+a.antePost+"\n";
  navigator.clipboard.writeText(t.trim()).then(function(){ var b=document.getElementById("copy-rw-"+id); if(b){b.textContent="\u2713 copied";setTimeout(function(){b.textContent="\u2398 copy"},2000)} });
}
function copyOriginal(id) {
  var a = ARTICLES.find(function(x) { return x.id === id; }); if(!a)return;
  navigator.clipboard.writeText(a.originalBody).then(function(){ var b=document.getElementById("copy-og-"+id); if(b){b.textContent="\u2713 copied";setTimeout(function(){b.textContent="\u2398 copy"},2000)} });
}

// ─── DELETE ───
var pendingDeleteId = null;

function confirmDelete(id) {
  pendingDeleteId = id;
  var a = ARTICLES.find(function(x) { return x.id === id; });
  var overlay = document.createElement("div");
  overlay.className = "delete-confirm";
  overlay.id = "deleteOverlay";
  overlay.innerHTML = '<div class="delete-dialog"><h3>Remove this email?</h3><p>' + escapeHtml(a ? a.originalSubject : '') + '</p><div class="delete-dialog-btns"><button class="btn-cancel" onclick="cancelDelete()">Cancel</button><button class="btn-confirm-delete" onclick="executeDelete()">Delete</button></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener("click", function(e) { if (e.target === overlay) cancelDelete(); });
}

function cancelDelete() {
  pendingDeleteId = null;
  var el = document.getElementById("deleteOverlay");
  if (el) el.remove();
}

function executeDelete() {
  if (!pendingDeleteId) return;
  var idx = ARTICLES.findIndex(function(a) { return a.id === pendingDeleteId; });
  if (idx !== -1) ARTICLES.splice(idx, 1);
  if (selectedId === pendingDeleteId) selectedId = null;
  pendingDeleteId = null;
  var el = document.getElementById("deleteOverlay");
  if (el) el.remove();
  render();
}

// ─── DUPLICATE DETECTION ───
// Deduplicates articles by matching subject+tipDate, keeping the first occurrence
function getDeduplicatedArticles() {
  var seen = {};
  return ARTICLES.filter(function(a) {
    // Normalise: strip "Amendment", "Fw:", leading/trailing spaces, lowercase
    var subj = (a.originalSubject || "").toLowerCase().replace(/\(amendment\)/g, "").replace(/^fw:\s*/i, "").replace(/^fwd:\s*/i, "").trim();
    var key = subj + "|" + (a.tipDate || "");
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
}

// ─── TAB SWITCHING ───
function switchTab(tab) {
  activeTab = tab;
  selectedId = null;
  document.querySelectorAll(".page-tab").forEach(function(t) { t.classList.remove("active"); });
  document.getElementById("tab-" + tab).classList.add("active");
  render();
}

// ─── DATE SIDEBAR ───
function renderDateSidebar() {
  var dates = getTipDates();
  var html = '<h4>Tip Dates</h4>';
  html += '<div class="date-item' + (selectedDate === "all" ? " active" : "") + '" onclick="selectDate(\'all\')">All Dates</div>';
  dates.forEach(function(d) {
    html += '<div class="date-item' + (selectedDate === d.date ? " active" : "") + '" onclick="selectDate(\'' + d.date + '\')">' + shortDateLabel(d.date) + '<span class="date-count">' + d.count + '</span></div>';
  });
  document.getElementById("dateSidebar").innerHTML = html;
}

function selectDate(d) {
  selectedDate = d;
  selectedId = null;
  render();
}

// ─── RENDER: EMAILS TAB ───
function renderEmails() {
  var authors = ["All"];
  var seen = {};
  var deduped2 = getDeduplicatedArticles();
  deduped2.forEach(function(a) { var au = getAuthor(a); if (!seen[au]) { seen[au] = true; authors.push(au); } });

  var deduped = getDeduplicatedArticles();
  var filtered = deduped.filter(function(a) {
    var q = searchQuery.toLowerCase();
    var ms = !q || [a.originalSubject, a.from, a.originalBody].some(function(f) { return (f||"").toLowerCase().indexOf(q) !== -1; });
    if (!ms) return false;
    if (filterAuthor !== "All" && getAuthor(a) !== filterAuthor) return false;
    if (selectedDate !== "all" && a.tipDate !== selectedDate) return false;
    return true;
  }).sort(function(a, b) { return new Date(b.emailDate) - new Date(a.emailDate); });

  var sel = selectedId ? ARTICLES.find(function(a) { return a.id === selectedId; }) : null;
  var view = sel ? (activeView[sel.id] || "original") : null;

  // Toolbar
  var tb = '<div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="search..." value="' + escapeHtml(searchQuery) + '"></div>';
  tb += '<div class="filter-group">';
  authors.forEach(function(a) { tb += '<button class="filter-btn' + (filterAuthor === a ? ' active' : '') + '" onclick="setAuthor(\'' + escapeHtml(a) + '\')">' + escapeHtml(a) + '</button>'; });
  tb += '</div>';

  var html = '<div class="toolbar">' + tb + '</div>';
  html += '<div class="content">';

  if (!filtered.length) {
    html += '<div class="' + (sel ? 'cards-list' : 'cards-grid') + '"><div class="empty"><h3>' + (ARTICLES.length === 0 ? 'Nothing here yet' : 'No results') + '</h3><p>' + (ARTICLES.length === 0 ? 'Hit Sync to pull emails.' : 'Try different search terms or author.') + '</p></div></div>';
  } else {
    html += '<div class="' + (sel ? 'cards-list' : 'cards-grid') + '">';
    filtered.forEach(function(a, i) {
      var sc = a.selections ? a.selections.length : 0;
      var auth = getAuthor(a);
      html += '<div class="card' + (selectedId === a.id ? ' selected' : '') + '" style="animation-delay:' + (i * 0.03) + 's" onclick="selectCard(\'' + a.id + '\')">';
      html += '<button class="btn-delete" onclick="event.stopPropagation();confirmDelete(\'' + a.id + '\')" title="Remove">&#10005;</button>';
      html += '<div class="card-header"><span class="card-from">' + escapeHtml(auth) + '</span><span class="card-time">' + timeAgo(a.emailDate) + '</span></div>';
      html += '<h3>' + escapeHtml(a.originalSubject) + '</h3>';
      html += '<p class="card-excerpt">' + escapeHtml((a.originalBody || "").substring(0, sel ? 90 : 150)) + '...</p>';
      html += '<div class="card-footer"><span class="card-sels">' + sc + ' sel' + (sc !== 1 ? 's' : '') + '</span></div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // Reader
  if (sel) {
    var auth = getAuthor(sel);
    html += '<div class="reader">';
    html += '<div class="reader-header"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1;padding-right:40px">';
    html += '<div class="reader-meta"><span class="from">' + escapeHtml(auth) + '</span><span class="dot"></span><span class="date">' + formatDate(sel.emailDate) + '</span></div>';
    html += '<h2>' + escapeHtml(sel.originalSubject) + '</h2>';
    html += '</div><button class="reader-close" onclick="selectCard(null)">&#10005;</button></div></div>';

    html += '<div class="view-tabs">';
    html += '<button class="view-tab' + (view === "original" ? ' active' : '') + '" onclick="setView(\'' + sel.id + '\',\'original\')">Original Email</button>';
    html += '<button class="view-tab' + (view === "rewrite" ? ' active' : '') + '" onclick="setView(\'' + sel.id + '\',\'rewrite\')">Racing Intel Rewrite</button>';
    html += '</div>';

    if (view === "original") {
      html += '<div class="copy-bar"><button class="btn-copy" id="copy-og-' + sel.id + '" onclick="event.stopPropagation();copyOriginal(\'' + sel.id + '\')">\u2398 copy</button></div>';
      html += '<div class="email-body">';
      (sel.originalBody || "").split("\n").forEach(function(line) { html += line.trim() ? '<p>' + escapeHtml(line) + '</p>' : '<p style="margin-bottom:8px">&nbsp;</p>'; });
      html += '</div>';
    } else {
      html += '<div class="copy-bar"><button class="btn-copy" id="copy-rw-' + sel.id + '" onclick="event.stopPropagation();copyRewrite(\'' + sel.id + '\')">\u2398 copy</button></div>';
      html += '<div class="rewrite-body">';
      if (sel.selections && sel.selections.length) {
        sel.selections.forEach(function(s) {
          html += '<div class="selection-block">';
          html += '<div class="selection-header">' + escapeHtml(s.race) + ' ' + escapeHtml(s.horse) + ' - ' + escapeHtml(s.stake) + ' at ' + escapeHtml(s.odds);
          if (s.category) html += ' (' + escapeHtml(s.category) + ')';
          html += '</div>';
          if (s.analysis) { html += '<div class="selection-analysis">' + escapeHtml(s.analysis) + '</div>'; }
          else { html += '<div class="no-analysis">No analysis available for this selection</div>'; }
          html += '</div>';
        });
      }
      if (sel.doubles) { html += '<div class="selection-block" style="padding:12px 16px;background:#f8f8f8;border-radius:8px;font-size:13px;font-weight:600;color:#333">' + escapeHtml(sel.doubles) + '</div>'; }
      if (sel.antePost) {
        html += '<div style="margin-top:16px;padding-top:16px;border-top:1px solid #eee">';
        html += '<div style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:10px">Ante Post</div>';
        sel.antePost.split("\n").filter(Boolean).forEach(function(line) { html += '<div style="font-size:13px;color:#555;margin-bottom:6px">' + escapeHtml(line) + '</div>'; });
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ─── RENDER: ALL SELECTIONS TAB ───
function renderAllSelections() {
  var sels = getSelectionsForDate(selectedDate).filter(function(s) { return isTipsterSelected(s.tipster); });
  var html = renderTipsterFilter();
  if (!sels.length) {
    html += '<div class="empty"><h3>No selections</h3><p>No tips found for the selected tipsters.</p></div>';
    return html;
  }
  var lastRace = "";
  sels.forEach(function(s, i) {
    var raceKey = s.race;
    if (raceKey !== lastRace) {
      lastRace = raceKey;
      html += '<div style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;padding:16px 0 6px">' + escapeHtml(raceKey) + '</div>';
    }
    html += '<div class="all-sel-block" style="animation-delay:' + (i * 0.02) + 's">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    html += '<div>';
    html += '<span class="all-sel-horse">' + escapeHtml(s.horse) + '</span>';
    if (s.category) html += '<span class="category-badge">' + escapeHtml(s.category) + '</span>';
    html += '<span class="tipster-badge">' + escapeHtml(s.tipster) + '</span>';
    html += '</div>';
    html += '</div>';
    html += '<div class="all-sel-details">' + escapeHtml(s.stake) + ' at ' + escapeHtml(s.odds) + '</div>';
    if (s.analysis) {
      html += '<div class="all-sel-analysis">' + escapeHtml(s.analysis) + '</div>';
    }
    html += '</div>';
  });
  return html;
}

// ─── RENDER: BET SUMMARY TAB ───
function renderBetSummary() {
  var sels = getSelectionsForDate(selectedDate).filter(function(s) { return isTipsterSelected(s.tipster); });
  var html = renderTipsterFilter();
  if (!sels.length) {
    html += '<div class="empty"><h3>No bets</h3><p>No tips found for the selected tipsters.</p></div>';
    return html;
  }
  html += '<table class="bet-table">';
  html += '<thead><tr><th>Time</th><th>Race</th><th>Horse</th><th>Stake</th><th>Odds</th><th>Category</th><th>Tipster</th></tr></thead>';
  html += '<tbody>';
  sels.forEach(function(s) {
    html += '<tr>';
    var tm = (s.race || "").match(/(\d{1,2}[\.:]\d{2})/);
    html += '<td style="font-weight:600;white-space:nowrap">' + (tm ? escapeHtml(tm[1]) : '') + '</td>';
    html += '<td>' + escapeHtml(s.race) + '</td>';
    html += '<td style="font-weight:600">' + escapeHtml(s.horse);
    if (s.category) html += ' <span class="category-badge">' + escapeHtml(s.category) + '</span>';
    html += '</td>';
    html += '<td>' + escapeHtml(s.stake) + '</td>';
    html += '<td style="font-weight:600">' + escapeHtml(s.odds) + '</td>';
    html += '<td>' + escapeHtml(s.category || '-') + '</td>';
    html += '<td><span class="tipster-badge">' + escapeHtml(s.tipster) + '</span></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ─── MAIN RENDER ───
function render() {
  document.getElementById("lastSynced").innerHTML = '<span class="sync-indicator"></span>synced ' + timeAgo(lastSyncTime) + ' ago';
  renderDateSidebar();

  var content = "";
  if (activeTab === "emails") {
    content = renderEmails();
  } else if (activeTab === "selections") {
    content = renderAllSelections();
  } else if (activeTab === "summary") {
    content = renderBetSummary();
  }
  document.getElementById("mainContent").innerHTML = content;

  // Attach search listener if on emails tab
  if (activeTab === "emails") {
    var si = document.getElementById("searchInput");
    if (si) {
      si.addEventListener("input", function(e) { searchQuery = e.target.value; render(); });
    }
  }
}

function selectCard(id) { selectedId = selectedId === id ? null : id; if(id && !activeView[id]) activeView[id] = "original"; render(); }
function setView(id, v) { activeView[id] = v; render(); }
function setAuthor(a) { filterAuthor = a; render(); }

setInterval(function() { location.reload(); }, 300000);
render();
</script>
