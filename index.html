:"",analysis:""},{race:"Newcastle 2.25",horse:"Powdering",odds:"16/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 2.25",horse:"Shallow",odds:"20/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 3.00",horse:"Chancellor",odds:"13/2",stake:"e/w (4 places, Sky 5 places)",category:"",analysis:""},{race:"Newcastle 3.00",horse:"Tyrrhenian Sea",odds:"8/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 3.00",horse:"Apiarist",odds:"12/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 3.00",horse:"Storm Star",odds:"14/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 3.35",horse:"Ferrous",odds:"12/1",stake:"e/w (4 places, Skybet 5 places)",category:"",analysis:""},{race:"Newcastle 3.35",horse:"Marshman",odds:"8/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 4.10",horse:"Gaucher",odds:"4/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 4.10",horse:"Teumessias Fox",odds:"16/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 4.42",horse:"Duke Of Oxford",odds:"13/2",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 4.42",horse:"Tribal Star",odds:"14/1",stake:"e/w (4 places)",category:"",analysis:""},{race:"Newcastle 4.42",horse:"Charging Thunder",odds:"28/1",stake:"e/w (4 places)",category:"",analysis:""}],doubles:"",antePost:""},{id:"19d4d680e5feb965",originalSubject:"Zenith Betting - 2nd April",from:"The Inside Rail (info@theinsiderail.co.uk)",author:"Zenith Betting",emailDate:"2026-04-02T08:55:57Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:59:06Z",originalBody:"ZENITH BETTING\n\nClonmel 4.30 - Dee Capo - 2.5 point win at 2/1 (General)\nDee Capo sets the standard on chase form and looks the most solid option if backing up his recent efforts. He ran with credit in strong handicaps, including a good fourth at the Dublin Racing Festival off top weight and shaped better than the result suggests at Cheltenham. This trip is ideal and he has winning form with the rider. If recovered from his Festival run, he looks the one to beat in a race where his main rival brings mixed recent hurdling form.\n\nRegards\nThe Inside Rail",originalHtml:"",selections:[{race:"Clonmel 4.30",horse:"Dee Capo",odds:"2/1",stake:"2.5 points win",category:"",analysis:"Dee Capo sets the standard on chase form in this company and looks a solid proposition if building on recent efforts. The form received a considerable boost from a creditable fourth at the Dublin Racing Festival under top weight, a performance full of substance against far stronger opposition than he will encounter here. He shaped better than the bare result suggests at Cheltenham and this trip plays to his strengths. Winning form in combination with the jockey adds further confidence. The main rival brings mixed recent hurdling form, which only strengthens the case."}],doubles:"",antePost:""},
{id:"19d4e36c7fa342aa",originalSubject:"New Horse Racing Tip",from:"Ben from The Racing Analyst",author:"Ben",emailDate:"2026-04-02T12:41:43Z",tipDate:"2026-04-03",processedAt:"2026-04-02T12:55:23Z",originalBody:"HELLO ANDY\nHere are today's selections.\n\n3RD APRIL 2026\nAfter a week without many tips, once more, we will have a busier end to the week now the racing is a lot better. Really deep racing on Friday. Larger days outlay than normal but, over the week, no different to the norm.\n\n1.30 LINGFIELD PARTY BEAR 8/1 1PT WIN 4 PLACES\n3.35 NEWCASTLE WILTSHIRE 9/1 1PT WIN 4 PLACES\n3.50 LINGFIELD ANGEL HUNTER 11/1 1PT WIN 4 PLACES\n0.25PT EACH WAY TRIXIE\n\n2.05 LINGFIELD DIAMOND BAY 9/1 0.7PT EW 4 PLACES\n3.00 NEWCASTLE APIARIST 12/1 0.75PT EW 4 PLACES\n0.25PT EACH WAY 5 FOLD (just in case)\n\nPARTY BEAR is a good horse around here, with a win and a close 3rd from 3 runs over this C&D. In fact, the only time he wasn't involved in the finish was in this race last year, when an unlucky loser and easily the best horse in the race. Drawn in stall 10 that day, his rider accepted his fate from the get go and he simply had no chance from stone last. Racing off a 1lb lower mark today and, after the jockey claim, 2lb lower than when winning over C&D a few starts ago, he's drawn much better in stall 1 this time around, ought to get the perfect sit and have every chance of compensation.\n\nWILTSHIRE went into the tracker for this race a couple of starts ago, when a seriously unlucky loser over this C&D, albeit in a much weaker race. Happy to ignore his effort at Lingfield on his last start for a few reasons, but mostly because Lingfield wont have suited at all, he returns back to Newcastle after wind surgery, giving him another excuse for that ok effort last time out. He's been freshened up for this, suggesting it's been the aim for a while, he's got a decent draw for a horse that likes to be held up and there is a lot of pace in this race which ought to be perfect. He goes well fresh, he's only 1lb higher than for his last win and probably should be 2 from 2 at the track too. The yard are flying, they have a 30% strike rate with their horses after a wind op and I cant see him far away, granted he gets the gaps.\n\nANGEL HUNTER hasn't really delivered, but he was a lot better than the bare result last time out, which was a run needed to get him qualified for this race. In first time blinkers that day, he was held up last in a fast run race, but was forced to make his run down the slowest part of the track. Having briefly looked like he was going to figure in the finish, actually completed a couple of the quickest furlongs in the race, his run understandably petered out late on. Back down to his last winning mark here, he's fresh from a break and unexposed enough to have enough improvement in him.\n\nDIAMOND BAY is a very consistent horse who goes well fresh and runs today from a 1lb lower mark than his last winning one. Having won first time out last season, I have no issue with fitness today and he's running off a mark that is 10lb lower than when 2nd in this race 2 years ago. Sean Levey has a brilliant record on the horse.\n\nLast on the list is APIARIST who, for me, is a borderline group level horse on the all weather and is proven over this C&D. He was, arguably, unlucky to have not won this race last year too. Last years meeting at this track there was a huge bias to race toward the front and up the rail, so to finish 3rd that day, having raced held up last and being forced to run down the middle of the track, his effort can be marked up.\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst\n\nANTE POST ALREADY ADVISED\n11TH APRIL - GRAND NATIONAL -\nCAPTAIN CODY 25/1 1PT WIN\nSTELLAR STORY 25/1 0.75PT EW\nPERCIVAL LEGALLOIS 50/1 0.5PT EW (BET365, 40/1 ALMOST EVERYWHERE ELSE)\n5 places",originalHtml:"",selections:[{race:"Lingfield 1.30",horse:"Party Bear",odds:"8/1",stake:"1 point win (4 places)",category:"",analysis:"Party Bear boasts a win and a close third from three runs over this course and distance, a record that speaks volumes about his affinity for the track. He was desperately unlucky in this very race twelve months ago, drawn widest of all in stall 10 with his jockey accepting defeat from the outset. Now drawn in stall 1, racing off a pound lower and effectively 2lb below his last winning mark after the jockey claim, the stars appear to be aligning for belated compensation. Don't say you weren't warned."},{race:"Newcastle 3.35",horse:"Wiltshire",odds:"9/1",stake:"1 point win (4 places)",category:"",analysis:"Wiltshire entered the tracker as a seriously unlucky loser over this course and distance, and the decision to freshen him up for this particular race suggests it has been the target for some time. The Lingfield run can be completely ignored on grounds of unsuitability, and the subsequent wind surgery provides further mitigation. He returns to a track where he should be two from two, the yard boast a remarkable 30 percent strike rate with post-wind-op runners, and the abundance of pace in this race should set things up perfectly for his hold-up style."},{race:"Lingfield 3.50",horse:"Angel Hunter",odds:"11/1",stake:"1 point win (4 places)",category:"",analysis:"Angel Hunter produced a far better effort than the bare result last time, a run designed purely to qualify him for this engagement. Held up last in first-time blinkers during a fast-run affair, he was forced to make his challenge down the slowest part of the track yet still recorded some of the quickest individual furlongs in the race before fading late. Back to his last winning mark, fresh from a break and with the unexposed profile to find improvement, the decision to deploy Sean Levey at Lingfield rather than Newcastle may prove telling."},{race:"Lingfield 2.05",horse:"Diamond Bay",odds:"9/1",stake:"0.7 points e/w (4 places)",category:"",analysis:"Diamond Bay is the model of consistency and goes particularly well when fresh, having won first time out last season. He lines up off a mark fully 10lb lower than when finishing second in this very race two years ago, and just a pound below his last winning rating. Sean Levey maintains an outstanding record aboard the horse, whose proven course and distance credentials provide further reassurance."},{race:"Newcastle 3.00",horse:"Apiarist",odds:"12/1",stake:"0.75 points e/w (4 places)",category:"",analysis:"Apiarist is a borderline Group-class performer on the all-weather with proven course and distance form who can be considered desperately unlucky not to have won this race twelve months ago. A pronounced front-running and rail bias that day rendered his held-up, mid-track effort in finishing third all the more meritorious. The draw in stall 1 is a concern but he arrives in excellent form and possesses the raw ability to figure prominently regardless."}],doubles:"0.25pt e/w trixie on Party Bear, Wiltshire, Angel Hunter. 0.25pt e/w 5 fold on all 5 selections.",antePost:"Grand National (11th April): Captain Cody 25/1 1pt win, Stellar Story 25/1 0.75pt e/w, Percival Legallois 50/1 0.5pt e/w (5 places)"},
{id:"19d4e0158a24a370",originalSubject:"Form Guru - 2nd April",from:"The Inside Rail (info@theinsiderail.co.uk)",author:"Form Guru",emailDate:"2026-04-02T11:43:24Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"Belladinotte was successful at Southwell yesterday.\n\nToday's Selections:\n\n3.10 - Kelso - Ebselysees. 1.25 pts e/w. Available at 11/1. (Unibet, Bet365, BOG)\n3.32 - Chepstow - Torneo. 1.25 pts win. Available at 9/1. (Generally available, BOG)\n3.40 - Kelso - Burgundy Man. 1.25 pts e/w. Available at 1/1. (Skybet - 1/5 odds first 4)\n3.40 - Kelso - Don Ochetti. 0.75 pts e/w. Available at 33/1. (Bet365, Paddy Power, BOG)\n4.07 - Chepstow - Authentic Legacy. 1.25 pts e/w. Available at 10/1. (Generally available - 1/5 odds first 4, BOG)\n4.07 - Chepstow - Bluegrass. 0.75 pts e/w. Available at 16/1. (Bet365 - 1/5 odds first 4, BOG)\n4.39 - Chepstow - Dessie Haze. 1.25 pts e/w. Available at 10/1. (Bet365, 888Sport, BOG)\n4.46 - Kelso - My Lady Elektra. 2.25 pts win. Available at 6/1. (Betway, Unibet, BOG)",originalHtml:"",selections:[{race:"Kelso 3.10",horse:"Ebselysees",odds:"11/1",stake:"1.25 points e/w",category:"",analysis:""},{race:"Chepstow 3.32",horse:"Torneo",odds:"9/1",stake:"1.25 points win",category:"",analysis:""},{race:"Kelso 3.40",horse:"Burgundy Man",odds:"1/1",stake:"1.25 points e/w (1/5 odds first 4)",category:"",analysis:""},{race:"Kelso 3.40",horse:"Don Ochetti",odds:"33/1",stake:"0.75 points e/w",category:"",analysis:""},{race:"Chepstow 4.07",horse:"Authentic Legacy",odds:"10/1",stake:"1.25 points e/w (1/5 odds first 4)",category:"",analysis:""},{race:"Chepstow 4.07",horse:"Bluegrass",odds:"16/1",stake:"0.75 points e/w (1/5 odds first 4)",category:"",analysis:""},{race:"Chepstow 4.39",horse:"Dessie Haze",odds:"10/1",stake:"1.25 points e/w",category:"",analysis:""},{race:"Kelso 4.46",horse:"My Lady Elektra",odds:"6/1",stake:"2.25 points win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d4d7d16fc54cee",originalSubject:"Today's Qualifiers [ 2nd April ]",from:"BetRate (admin@betrate.co.uk)",author:"BetRate",emailDate:"2026-04-02T09:18:56Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"Today's Qualifiers\n\nSouthwell 5.48 - Stanley Spencer (4/1)\nSouthwell 8.18 - Hackney Diamonds (5/1)\n\n(Recommended stakes - win bet (below 6/1), e/w bet (6/1 or bigger)\n\nBe lucky\nAlex\nBetrate",originalHtml:"",selections:[{race:"Southwell 5.48",horse:"Stanley Spencer",odds:"4/1",stake:"win",category:"",analysis:""},{race:"Southwell 8.18",horse:"Hackney Diamonds",odds:"5/1",stake:"win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d4d65bdd080ca0",originalSubject:"BetSeven - 2nd April",from:"BetSeven (info@betseven.co.uk)",author:"BetSeven",emailDate:"2026-04-02T08:53:25Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"BETSEVEN\n\nChepstow 5.15 - Order On Time - 3 point win at Evens (General)\nOrder On Time looks the type to improve for this test and could have the class edge in what is not the deepest race. His pointing form showed he can gallop strongly and he shaped with promise when second on debut, pulling clear of the rest. This track should suit his style and he has the physical scope to progress. He may not be top class, but in this company he looks capable of taking a step forward and getting off the mark.\n\nChris Howard\nBetSeven",originalHtml:"",selections:[{race:"Chepstow 5.15",horse:"Order On Time",odds:"Evens",stake:"3 points win",category:"",analysis:"Order On Time shaped with considerable promise when runner-up on his rules debut, pulling well clear of the remainder to advertise genuine ability. The form of his pointing career had already marked him down as one with a strong galloping action, and the step up in trip at an undulating track like Chepstow looks tailor-made for his style. He possesses the physical scope to progress markedly from that initial experience and, in a race lacking any real depth, the class edge he holds over these rivals should prove decisive."}],doubles:"",antePost:""},
{id:"19d4d612fa798dc4",originalSubject:"Daily AI Analysis [ 2nd April ]",from:"IQ Racing (info@iqracing.net)",author:"IQ Racing",emailDate:"2026-04-02T08:48:27Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"Thursday 2nd April\n\nChepstow 3.32 - Knight Of Allen\nAdvised Odds: 2/1 (General)\nAdvised Bet: 3 point win\nPerformance Metrics: Previous course winner with strong handicap form, including a convincing effort against a key rival off level weights. The Cheltenham pull-up is easily excused given the race setup heavily favoured prominent runners and he was hampered early, ending his chance.\nTrack Characteristics: Chepstow suits, with proven form at the track and conditions expected to be much more suitable than last time.\nRace Projection: With a cleaner run and a more suitable race set up, he looks primed to bounce back.\n\nIQ Racing",originalHtml:"",selections:[{race:"Chepstow 3.32",horse:"Knight Of Allen",odds:"2/1",stake:"3 points win",category:"",analysis:"Knight Of Allen is a previous course winner whose strong handicap credentials include a convincing defeat of a key rival off level weights. The Cheltenham pull-up last time can be completely excused on multiple grounds, not least a race configuration that heavily favoured prominent runners while he was hampered early and effectively had his chance ended before halfway. The strength of market support that day, backed from 25/1 into 9/1, tells its own story about how well he was regarded. Chepstow rewards efficient travellers and jumpers, and the yard targeting this race as their sole runner speaks volumes."}],doubles:"",antePost:""},
{id:"19d4d5cef3911eb0",originalSubject:"BetRev - Thursday 2nd April",from:"BetRev (admin@bethub.pro)",author:"BetRev",emailDate:"2026-04-02T08:43:48Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"Daily Digest - Thursday 2nd April 2026:\n\nChepstow 3.00\nDonald McCain's runner Supreme George has been in solid form throughout the winter, which is impressive given that the yard's season has been somewhat underwhelming overall. With only three winners in the past fortnight, the stable has been ticking along rather than firing, but Supreme George stands out as one who has consistently put in solid efforts. This is a small field, and on ground described as just on the softer side of good - conditions that should suit him well - he looks to have an excellent chance of going close.\n\nChepstow 3.32\nKnight Of Allen is the one I'm keenest on today. He brings solid form to the table and I'm happy to put a big line through the Cheltenham pull-up last time. That was a race where front-runners and prominent racers dominated all week - if you were held up, you were cooked before you'd even got going. He was hampered by a faller on top of all that and his fate was sealed before halfway. He was backed from 25/1 into 9/1 third favourite at the festival and he's a course winner here who put Ben Solo firmly in his place off level weights previously. The pair meet on identical terms and he is just hard to look past.\n\nBet Summary:\nChepstow 3.00 - Supreme George - 2 point win at (7/2) General\nChepstow 3.32 - Knight Of Allen - 3 point win at (2/1) General\n\nBe Lucky\nG.J.",originalHtml:"",selections:[{race:"Chepstow 3.00",horse:"Supreme George",odds:"7/2",stake:"2 points win",category:"",analysis:"Supreme George has been the standout performer in Donald McCain's yard throughout an otherwise underwhelming winter campaign, putting in consistently solid efforts when many of his stablemates have underperformed. This small-field affair on ground just on the softer side of good presents ideal conditions, and the left-handed, undulating nature of Chepstow should reward his prominent racing style. The form figures make compelling reading for a horse whose consistency has been remarkable."},{race:"Chepstow 3.32",horse:"Knight Of Allen",odds:"2/1",stake:"3 points win",category:"",analysis:"Knight Of Allen commands the utmost respect here, and the Cheltenham pull-up last time can be firmly consigned to the bin. That was a festival where front-runners and prominent racers dominated throughout the week, and being held up was tantamount to a death sentence. He was hampered by a faller on top of that, sealing his fate before halfway. The market had spoken loudly, backing him from 25/1 into 9/1 third favourite, and he remains a course winner here who put Ben Solo firmly in his place off level weights. The pair meet on identical terms and he looks extremely hard to oppose."}],doubles:"",antePost:""},
{id:"19d4d66e0b3ecba3",originalSubject:"From The Stables - 02/04/2026",from:"From The Stables (via toandyroberts)",author:"From The Stables",emailDate:"2026-04-02T08:54:38Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"Thursday, 2nd April, 2026\n\nTODAY'S FEATURED STABLES: B Pauling, C Longsdon, J Snowden, K Bailey & M Nicholls, N Richards\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS\n\nTONY'S NAP\nChepstow 5.15 - Louxor De Grugy (3/1)\nThe Kempton bumper where Louxor De Grugy finished 4th is always a hot contest. Ben has lined him up for this lesser event and he should take benefit from the experience to win today.\n\nTONY'S NEXT BEST\nKelso 5.20 - Poets Whisper (9/4)\nPoets Whisper is another Tartan Bloodstock horse and Nicky usually has them fully primed for their debuts. No reason why this one should be any different from the normal state of affairs.\n\nTONY'S TREBLE\nChepstow 3.32 - Torneo (10/1)\nIt's a leap of faith whether Torneo will get the extra half-mile. Jamie thinks he will so that's good enough for me.\n\nTODAY'S FTS RUNNERS - TRAINER QUOTES\n\nChepstow 2.30 - Are You Joking (50/1)\nTrainer C Longsdon: \"Are You Joking showed glimmers of potential in two Irish points last year but so far has been pretty clueless in his runs over hurdles for us. Handicaps beckon after this.\"\n\nChepstow 3.32 - Torneo (10/1)\nTrainer J Snowden: \"Torneo did well last season, his first over fences and continued in similar vein this term. He was 2nd on three of his first four runs, only narrowly beaten in strong races at Cheltenham and Windsor. Frustratingly, he has continued to creep up the handicap because of that consistency. Last time, he found 2m around Kelso too sharp, and if he can see out this longer trip, it may bring some more improvement. Hopeful.\"\n\nChepstow 4.07 - So You Know (10/3)\nTrainer K Bailey & M Nicholls: \"So You Know is such a likeable horse and a half-brother to Does He Know. He has had a good season and was 2nd at Warwick when Aamilah claimed 10lb and he went up 4lb for that. Tom Bellamy rides today and while it looks mighty competitive, he too should be so. Place chances and hopefully better!\"\n\nChepstow 4.07 - Wolf Moon (9/1)\nTrainer B Pauling: \"Wolf Moon had an excellent novice season over hurdles but has been nowhere near that level in two runs this campaign. We've given him a wind-op since he trailed home at Warwick last time out and hopefully, we will see last season's version of him. I hope that talent is still in there.\"\n\nChepstow 5.15 - Louxor De Grugy (3/1)\nTrainer B Pauling: \"I was happy enough with Louxor De Grugy's debut 4th at Kempton in a decent bumper from which the winner finished 4th in the valuable bumper at Newbury next time. He's nicely-bred and with normal improvement from Kempton, he would have to be a major contender here.\"\n\nKelso 5.20 - Poets Whisper (9/4)\nTrainer N Richards: \"Poets Whisper makes his debut. He's a grand horse and he'll be winning plenty of races whatever happens today. I hope he won't be far away. Fingers crossed.\"",originalHtml:"",selections:[{race:"Chepstow 5.15",horse:"Louxor De Grugy",odds:"3/1",stake:"",category:"NAP",analysis:"Louxor De Grugy ran a most encouraging fourth on debut in a Kempton bumper that has already produced a horse good enough to finish fourth in the valuable Newbury equivalent. The form of that contest sets a high standard for a race of this nature, and with normal improvement from that initial experience, Ben Pauling's nicely-bred youngster should prove a different proposition in what looks a significantly less demanding affair. The trainer speaks with quiet confidence and the step down in class looks the key to unlocking a first success."},{race:"Kelso 5.20",horse:"Poets Whisper",odds:"9/4",stake:"",category:"NB",analysis:"Poets Whisper makes his debut for Nicky Richards, a trainer with a formidable record when introducing his Tartan Bloodstock recruits to the racecourse. The trainer describes him as a grand horse who will win plenty of races regardless of today's outcome, and when Richards speaks in such terms about a debutant, experience tells us to take notice. Everything about the preparation suggests he will not be far away on this first appearance."},{race:"Chepstow 3.32",horse:"Torneo",odds:"10/1",stake:"",category:"",analysis:"Torneo enjoyed a productive first season over fences and has maintained that level into the current campaign, finishing second on three of his first four starts in strong races at Cheltenham and Windsor. The concern is the step up in trip after finding two miles around Kelso too sharp last time, but trainer Jamie Snowden believes the extra half-mile will bring improvement. That consistency which has frustratingly pushed his handicap mark upward may yet prove an asset at a trip that stretches his rivals."}],doubles:"",antePost:""},
{id:"19d4d6f82f6d254d",originalSubject:"Bet Sage - 2nd April",from:"Bet Sage (via tips@bethub.pro)",author:"Bet Sage",emailDate:"2026-04-02T09:04:06Z",tipDate:"2026-04-02",processedAt:"2026-04-02T12:55:23Z",originalBody:"BET SAGE\n\nChepstow 4.07 - Authentic Legacy - 1 point e/w at 15/2 (General - 4 places)\nAuthentic Legacy returns to hurdles off what looks a very workable mark and his recent chase form reads much stronger than the bare result. His Newbury run has worked out exceptionally well, with multiple runners from that race winning since, suggesting the form is well above average for the grade. Rated 115 over hurdles, he looks well treated on that evidence and the return to this discipline could unlock improvement. The booking of Caolin Quinn, who has a strong record on the horse, is another positive and the yard are in excellent form.\n\nBET SAGE",originalHtml:"<p>BET SAGE</p><p>Chepstow 4.07 - Authentic Legacy - 1 point e/w at 15/2 (General - 4 places)<br />Authentic Legacy returns to hurdles off what looks a very workable mark and his recent chase form reads much stronger than the bare result. His Newbury run has worked out exceptionally well, with multiple runners from that race winning since, suggesting the form is well above average for the grade. Rated 115 over hurdles, he looks well treated on that evidence and the return to this discipline could unlock improvement. The booking of Caolin Quinn, who has a strong record on the horse, is another positive and the yard are in excellent form.</p><p>BET SAGE</p>",selections:[{race:"Chepstow 4.07",horse:"Authentic Legacy",odds:"15/2",stake:"1 point e/w (4 places)",category:"",analysis:"Authentic Legacy makes a significant switch back to hurdles off a mark of 115 that looks extremely workable in the context of his recent chase form. The Newbury run has franked itself handsomely, with multiple subsequent winners emerging from that contest to suggest the form is operating at a level well above average for the grade. The return to the smaller obstacles could unlock a fresh vein of improvement, and the booking of Caolin Quinn, who maintains a strong record aboard the horse, adds further confidence. The yard are in sparkling form and everything points towards a bold showing."}],doubles:"",antePost:""},
{id:"19d4a6fc73c97ad5-sh",originalSubject:"Daily Racing Tips - Thursday 2nd April 2026",from:"Stephen Harris (via Daily Racing Tips)",author:"Stephen Harris",emailDate:"2026-04-01T19:05:32Z",tipDate:"2026-04-02",processedAt:"2026-04-01T19:10:00Z",originalBody:"Stephen Harris YouTube - Chepstow (Thursday 2nd April)\n\nChepstow 15:00 - Supreme George (NAP)\nA strong pick for the top spot at Chepstow in the South West Rail Solutions Ltd Handicap Chase, a Class 4 contest over two miles for five-year-olds and upwards. Donald McCain's runner has been in solid form throughout the winter, which is impressive given that the yard's season has been somewhat underwhelming overall. With only three winners in the past fortnight, the stable has been ticking along rather than firing, but Supreme George stands out as one who has consistently put in decent efforts. This is a small field, and on ground described as just on the softer side of good - conditions that should suit him well - he looks to have an excellent chance of going close. The track's left-handed, undulating nature at Chepstow can reward those who race prominently, particularly as the surface dries, and he fits that profile well.\n\nConfirmed on Oddschecker: Chepstow 15:00 - Supreme George (3/1)\n\nChepstow 15:32 - Ben Solo (Value Angle)\nThe Russell Property Consultants Handicap Chase over two miles three and a half furlongs offers nearly twelve thousand pounds in prize money, which is good for midweek racing. Rebecca Curtis has been showing improved form lately with one winner from nine runners in the past two weeks, and Ben Solo looks like the yard's strongest claim here. He's a likeable young horse who won his sole start between the flags and has taken well to the chasing game this season, winning one from five over fences. He has extensive course form at Chepstow, having run at every meeting this term. Although he had a bad run last time when outclassed in a higher grade, that effort at 33/1 can be safely forgiven. Returning to calmer waters here, with Ben Jones booked for the ride, he is the type who can get back to winning ways from the front on ground that plays to his strengths.\n\nConfirmed on Oddschecker: Chepstow 15:32 - Ben Solo (7/2)",originalHtml:"",selections:[{race:"Chepstow 3.00",horse:"Supreme George",odds:"3/1",stake:"1 point win",category:"NAP",analysis:"Supreme George has been a model of consistency for Donald McCain throughout the winter months and that form profile looks tailor-made for this small-field Class 4 contest. The yard may not have been firing on all cylinders of late but this seven-year-old has repeatedly defied that narrative with a string of solid performances. The ground conditions at Chepstow, sitting just on the easier side of good, should play right into his hands. He has shown a tendency to race prominently on left-handed tracks and that style tends to be rewarded when the surface starts to dry out at this venue. The opposition looks modest and everything points towards a bold showing."},{race:"Chepstow 3.32",horse:"Ben Solo",odds:"7/2",stake:"1 point win",category:"",analysis:"Ben Solo drops back into calmer waters here having been outclassed at a higher grade last time when sent off at 33/1. That effort can be safely filed away as an aberration. Rebecca Curtis is showing improved form with the stable ticking over nicely and this likeable young chaser has taken well to fences this term, winning one from five. His course form at Chepstow reads particularly well, having contested every meeting at the track this season. A winner between the flags on his only start in that sphere, he possesses the sort of natural jumping ability that can prove decisive in a race of this nature. Ben Jones takes the ride and the pair look well suited to making this a front-running contest."}],doubles:"",antePost:""},
{id:"19d4a6fc73c97ad5-gig",originalSubject:"Daily Racing Tips - Thursday 2nd April 2026",from:"gigilo (via Talkinghorses Forum)",author:"gigilo",emailDate:"2026-04-01T19:05:32Z",tipDate:"2026-04-02",processedAt:"2026-04-01T19:10:00Z",originalBody:"Talkinghorses Forum - gigilo's Latest Post (Southwell, 1st April 2026)\n\nSouthwell 17:48 - Stanley Spencer (7/1)\nSouthwell 18:48 - Silky Robin (11/1)\nSouthwell 18:48 - Colors Of Freedom (11/1)\nSouthwell 18:48 - Jeany May (12/1) - 4 places\nSouthwell 19:48 - Captain Robert (4/1)\nSouthwell 19:48 - Payment Plan (12/1)\nSouthwell 20:18 - Hackney Diamonds (11/2)\n\nListed in chronological order, earliest race first. No write-ups.",originalHtml:"",selections:[{race:"Southwell 5.48",horse:"Stanley Spencer",odds:"7/1",stake:"1 point win",category:"",analysis:""},{race:"Southwell 6.48",horse:"Silky Robin",odds:"11/1",stake:"1 point win",category:"",analysis:""},{race:"Southwell 6.48",horse:"Colors Of Freedom",odds:"11/1",stake:"1 point win",category:"",analysis:""},{race:"Southwell 6.48",horse:"Jeany May",odds:"12/1",stake:"1 point e/w (4 places)",category:"",analysis:""},{race:"Southwell 7.48",horse:"Captain Robert",odds:"4/1",stake:"1 point win",category:"",analysis:""},{race:"Southwell 7.48",horse:"Payment Plan",odds:"12/1",stake:"1 point win",category:"",analysis:""},{race:"Southwell 8.18",horse:"Hackney Diamonds",odds:"11/2",stake:"1 point win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d49bb55696dd7a",originalSubject:"New Horse Racing Tip",from:"Ben from The Racing Analyst <contact@theracinganalyst.com>",author:"Ben",emailDate:"2026-04-01T15:48:24Z",tipDate:"2026-04-02",processedAt:"2026-04-01T16:03:53Z",originalBody:"HELLO ANDY\nHere are today's selections.\n\n2ND APRIL 2026\nA couple from Chepstow, ahead of a busy weekend.\n\n3.32 CHEPSTOW KNIGHT OF ALLEN 10/3 1PT WIN\n4.07 CHEPSTOW AUTHENTIC LEGACY 15/2 1PT WIN\n0.5PT EACH WAY DOUBLE\n-------------------------\n3.32 CHEPSTOW KNIGHT OF ALLEN & BEN SOLO 0.25PT REV FC\n\nI might be way off the mark but I have this as a 2 horse affair and hope that KNIGHT OF ALLEN can get the better of BEN SOLO once more. They're a pair of horses that we have backed already this season. Ben Solo when winning by miles at Chepstow and Knight Of Allen last month at Cheltenham when he was backed off the boards. Ben Solo looks a well handicapped horse still, he was in the process of winning two starts ago at this C&D before unseating. The eventual 2nd won a big race at Cheltenham on his next start and I'd be prepared to excuse the run of the Curtis horse at the festival last time out. He was 5lb out the handicap and everything that could go wrong on that day, did.\n\nKNIGHT OF ALLEN also pulled up at the festival last month but, again, it was a complete disaster from the off. Firstly he was held up which, as we saw all week, horses had no chance from the back at the meeting and secondly, his race was over before half way when he was near enough brought down by a faller and, what miniscule chance he did have from back there, was ended instantly. He was, possibly, one of the biggest gambles of the meeting, having been punted from 25/1 all the way into 9/1 3rd fav before the race. He's backed today for the same reasons as before, simply because his form is phenomenal, and it's got even stronger since that meeting too. He's a course winner and he's beaten Ben Solo with ease off level weights, with the pair meeting on the same terms here. The yard's horses are in good form and this is their only runner on the card.\n\nBLOW YOUR WAD placed in the Ultima last time out and probably rightly so heads this market. However, it's been over 2 years since he won and he's still 8lb higher than for that last win. Happy to take him on as the fav.\n\nAUTHENTIC LEGACY is a little less straight forward. He's clearly had an issue this year, because he didn't make his seasonal debut until the 28th Feb in a chase at Newbury, finishing a decent 6th in a much better race than this. Despite having been beaten 16 lengths, the run can be marked up and the form reads exceptionally well. The 4th, 5th, 7th and last place horse of the 8 runners all winning on their next starts. Chasing has been put to one side for this year, presumably so the horse can still qualify as a novice next season, and returns to hurdles here this afternoon. Having run well all last season, he won his penultimate start, before finishing a good 2nd at Fontwell on his final start. Rated 115 today, he looks well treated on the back of his Newbury win, with the 2nd and 3rd both winning races next time out, and with that chase run last month having brushed off any cobwebs, he ought to be fit enough today. Caolin Quinn, who rode him to that win, is at Chepstow for just this one ride and the Moore horses are in great form. He also has form at this track too, ironically behind KNIGHT OF ALLEN, in a bumper.\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst\n\nANTE POST ALREADY ADVISED\nThe bets below are our Ante-Post book, so far...\n11TH APRIL - GRAND NATIONAL -\nCAPTAIN CODY 25/1 1PT WIN\nSTELLAR STORY 25/1 0.75PT EW\nPERCIVAL LEGALLOIS 50/1 0.5PT EW (BET365, 40/1 ALMOST EVERYWHERE ELSE)\n5 places",originalHtml:"",selections:[{race:"Chepstow 3.32",horse:"Knight Of Allen",odds:"10/3",stake:"1 point win",category:"",analysis:"Knight Of Allen brings phenomenal form to this Chepstow handicap chase and the Cheltenham pull-up last month should be completely ignored. Held up in a race where prominent runners dominated all week, his fate was sealed before halfway when hampered by a faller. That he was backed from 25/1 into 9/1 third favourite tells its own story about the regard in which connections hold him. A course winner who accounted for Ben Solo with authority off level weights previously, the pair meet on identical terms here. The yard sends just one runner to the card, always a telling sign."},{race:"Chepstow 4.07",horse:"Authentic Legacy",odds:"15/2",stake:"1 point win",category:"",analysis:"Authentic Legacy reverts to hurdles having been kept to chasing so far this season, presumably to preserve novice status for next term. The Newbury chase debut in February reads far better than a bare 6th beaten 16 lengths suggests. The form received a boost when the fourth, fifth, seventh and last all won next time out. Rated 115 over hurdles, he looks generously treated given that level of chase form. Caolin Quinn, who partnered him to victory last season, travels to Chepstow for this ride alone and the Moore yard are firing on all cylinders."}],doubles:"0.5pt e/w double on Knight Of Allen & Authentic Legacy. 0.25pt reverse forecast on Knight Of Allen & Ben Solo (3.32 Chepstow)",antePost:""},
{id:"19d491cb890258e4",originalSubject:"Form Guru - 1st April",from:"The Inside Rail <info@theinsiderail.co.uk>",author:"Form Guru",emailDate:"2026-04-01T12:55:12Z",tipDate:"2026-04-01",processedAt:"2026-04-01T13:00:00Z",originalBody:"Lone Star and Newport both returned place at Newcastle yesterday.\n\nToday's Selections:\n\nWincanton 2.50 - Matthias. 3 pts win. Available at 4/1. (Generally available, BOG)\n\nSedgefield 3.40 - Elusive Warrior. 0.75 pts e/w. Available at 16/1. (Generally available, BOG)\n\nSouthwell 4.30 - El Galactico. 1.25 pts e/w. Available at 11/1. (Generally available, BOG)\n\nWincanton 4.50 - Eric Gorcombe. 0.75 pts e/w. Available at 22/1. (Paddy Power - 1/5 odds first 4, BOG)\n\nSouthwell 5.02 - Belladinotte. 3 pts win. Available at 4/1. (Generally available, BOG)\n\nRegards",originalHtml:"",selections:[{race:"Wincanton 2.50",horse:"Matthias",odds:"4/1",stake:"3 points win",category:"",analysis:""},{race:"Sedgefield 3.40",horse:"Elusive Warrior",odds:"16/1",stake:"0.75 points e/w",category:"",analysis:""},{race:"Southwell 4.30",horse:"El Galactico",odds:"11/1",stake:"1.25 points e/w",category:"",analysis:""},{race:"Wincanton 4.50",horse:"Eric Gorcombe",odds:"22/1",stake:"0.75 points e/w (Paddy Power, 1/5 odds first 4)",category:"",analysis:""},{race:"Southwell 5.02",horse:"Belladinotte",odds:"4/1",stake:"3 points win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d486b2c0843de1",originalSubject:"From The Stables - 01/04/2026",from:"From The Stables <postmaster@mg.fromthestables.com>",author:"From The Stables",emailDate:"2026-04-01T09:41:13Z",tipDate:"2026-04-01",processedAt:"2026-04-01T09:50:00Z",originalBody:"Wednesday, 1st April, 2026\n\nTODAY'S FEATURED STABLES: B Pauling, C Longsdon, FM O'Brien, J Portman, J Snowden, K Bailey & M Nicholls, O Sangster, W Greatrex\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS FROM TODAY'S RUNNERS\n\nTONY'S NAP\nSouthwell 4.00 - Novelista\nNovelista cost 165k out of the Charlie Johnston stable having earned an 85 rating on the flat. His first unpaced hurdles run for Warren at Ascot can be excused and he looks a value alternative to the Paul Nicholls horse who was 8lb his inferior on the level.\n\nTONY'S NEXT BEST\nWincanton 4.20 - Move With The Beat\nWe've been with Move With The Beat all the way of late and I'm not deserting him now after one moderate effort. If the tongue-tie works, he could get back on the winning trail for Jamie.\n\nTONY'S TREBLE\nKempton 8.00 - Lovethiswayagain\nLovethiswayagain has been friendless in the market overnight. Ollie gives her a chance and his policy of keeping her to maidens in which she hasn't been disgraced has been effective. She runs in her first handicap off 65 - initially it was 75. Value each-way.\n\nTODAY'S FTS RUNNERS - GENUINE, DIRECT QUOTES FROM TODAY'S TRAINERS\n\nWincanton 2.20 - Sogna In Grande (7/2)\nTrainer: \"Former English pointer Sogna In Grande won well at Warwick earlier in the season. His form isn't as good as that of the Paul Nicholls horse, but we will give him a run for his money. Place chances.\"\n\nWincanton 2.50 - Jukebox King (5/2)\nTrainer: \"Jukebox King has progressed well all season and this is a great opportunity for him. Should go close.\"\n\nSouthwell 3.00 - Big Boy Barney (7/2)\nTrainer: \"Big Boy Barney has plenty of talent and got off the mark last time at Huntingdon when he travelled like much the best horse in the race, but he does have his quirks. We're not unduly worried about the 5lb weight rise if he puts his best foot forward. He'll love the ground but needs delivering at the right time and kidded into winning.\"\n\nSedgefield 3.10 - Realisation (7/2)\nTrainer: \"Realisation won nicely over the CD last time, relishing the extended trip. She's 6lb higher and the favourite looks a big threat but there's no reason why she can't run her race again. Hopeful.\"\n\nWincanton 3.20 - Law Of Supply (4/1)\nTrainer: \"Law Of Supply deserves to get his head in front but he has had loads of problems. This ground will suit him, so every chance.\"\n\nWincanton 3.20 - Golan Loop (10/3)\nTrainer: \"Golan Loop is in good form at home, and has cheek-pieces added today to help him concentrate. This looks a good opportunity to get his head in front.\"\n\nSouthwell 3.30 - Rose Of Knocknamoe (11/2)\nTrainer: \"Rose Of Knocknamoe goes well at home. She can be keen but will run well if settling. You never know what you are taking on in these races, but we like her.\"\n\nSouthwell 3.30 - Queens Charm (5/4)\nTrainer: \"Queens Charm won an Irish maiden mares' point-to-point on debut early in November and we acquired her at the Goffs UK sale at Newbury racecourse later in the month. She shapes nicely and we hope she can make a winning start in this interesting bumper.\"\n\nSouthwell 4.00 - Novelista (9/4)\nTrainer: \"Novelista will have learnt a lot from his first run over hurdles. He will probably need further in time but this will be good experience for him.\"\n\nSedgefield 4.10 - Hay Max (8/1)\nTrainer: \"Hay Max has run in three bumpers but this debut effort over hurdles will be a big learning curve for him. Hoping he will make the adjustment and run a nice first race.\"\n\nWincanton 4.20 - Move With The Beat (11/2)\nTrainer: \"Move With The Beat won five English point-to-points. He got off the mark for us at Ludlow but didn't get home last time out off 11lb higher. He made a small noise that day, so we've applied a tongue-tie and now down in class he can resume his progress.\"\n\nSouthwell 4.30 - Campaign Trail (7/1)\nTrainer: \"Campaign Trail would prefer softer ground but it is the right race for him if things go his way. He's not an easy ride but he goes there fresh and well. Place chances.\"\n\nKempton 7.00 - Twilight Glow (25/1)\nTrainer: \"Twilight Glow is a nice horse in the making. I rather ruined his mark when he was 2nd at Newbury last year, so he has more weight than he should, but he's come back well after his winter break. Today will tell me whether we should be going 6f or 7f with him. We'll learn plenty today but I think he'll run a decent race.\"\n\nKempton 8.00 - Lovethiswayagain (8/1)\nTrainer: \"Lovethiswayagain makes her handicap debut. She's a little exposed but the mark is fair and she has an okay draw. Each-way chances under in-form Billy Loughnane.\"",originalHtml:"",selections:[{race:"Southwell 4.00",horse:"Novelista",odds:"9/4",stake:"Tony Stafford NAP",category:"NAP",analysis:"Novelista represents a fascinating proposition for connections having cost 165,000 guineas out of the Charlie Johnston stable on the back of a flat rating of 85. That figure alone marks him as a horse of considerably greater ability than his hurdles debut at Ascot would suggest, where an unpaced gallop left him with little chance of showing his true worth. The Warren Greatrex yard does well with these recruits from the flat and the step up in trip at Southwell should allow him to settle into a proper rhythm. The Paul Nicholls horse commands favouritism but was a full 8lb inferior to this fellow on the level. At 9/4 he looks a value alternative."},{race:"Wincanton 4.20",horse:"Move With The Beat",odds:"11/2",stake:"Tony Stafford NB",category:"NB",analysis:"Move With The Beat won five English point-to-points before translating that ability to the racecourse with a gutsy success at Ludlow. The subsequent run was a disappointment but connections report he made a small respiratory noise that day, prompting the application of a tongue-tie for this drop in class. The form of his Ludlow victory reads well and Jamie Snowden's team have persisted with this horse for good reason. If the first-time tongue-tie has the desired effect, he could resume his upward trajectory in a race that looks within his compass."},{race:"Kempton 8.00",horse:"Lovethiswayagain",odds:"8/1",stake:"Tony Stafford Treble",category:"",analysis:"Lovethiswayagain has been the subject of a quiet campaign by Ollie Sangster, kept to maidens where she has not been disgraced despite failing to shed her maiden tag. She now makes her handicap debut off a mark of 65, fully 10lb below her initial assessment of 75, and that kind of drop tells its own story about the opportunity that presents itself. The booking of in-form Billy Loughnane catches the eye and her draw presents no obvious concerns. At 8/1 with each-way terms available, there is definite value in a horse running off a mark that may underestimate her true ability."},{race:"Wincanton 2.20",horse:"Sogna In Grande",odds:"7/2",stake:"",category:"",analysis:"Sogna In Grande won well at Warwick earlier in the season, displaying the qualities of a horse who could progress further as an ex-pointer. The Bailey and Nicholls team report he may not quite match the Paul Nicholls runner on form but believe he can give that rival a run for his money. Place chances look solid."},{race:"Wincanton 2.50",horse:"Jukebox King",odds:"5/2",stake:"",category:"",analysis:"Jukebox King has been a model of progression all season for the Bailey and Nicholls yard, steadily climbing through the ranks with each outing. Connections view this as a great opportunity and their confidence is not misplaced in a contest that looks within his capabilities. Should go close."},{race:"Southwell 3.00",horse:"Big Boy Barney",odds:"7/2",stake:"",category:"",analysis:"Big Boy Barney travelled like much the best horse in the race when getting off the mark at Huntingdon last time, suggesting he has considerably more ability than his current mark. The 5lb weight rise holds few fears for connections at Fergal O'Brien's yard, who report he will love this ground. He does have his quirks and needs delivering at precisely the right moment, but when things fall right he looks a horse of some talent."},{race:"Sedgefield 3.10",horse:"Realisation",odds:"7/2",stake:"",category:"",analysis:"Realisation won with authority over course and distance last time, relishing the step up in trip that connections had long anticipated would bring improvement. She is 6lb higher for that success and the favourite poses an obvious threat, but there is no reason to think she cannot reproduce that level of form on a track where she clearly thrives."},{race:"Wincanton 3.20",horse:"Law Of Supply",odds:"4/1",stake:"",category:"",analysis:"Law Of Supply has been a frustrating horse for the Bailey and Nicholls team, a horse who deserves to get his head in front but has been beset by problems. This ground will suit him and connections believe he has every chance of finally delivering the victory his ability warrants."},{race:"Wincanton 3.20",horse:"Golan Loop",odds:"10/3",stake:"",category:"",analysis:"Golan Loop is reported in good form at home by Warren Greatrex and has cheek-pieces applied for the first time today to sharpen his concentration. The yard believe this represents a good opportunity for him to get his head in front and the addition of the headgear could provide the spark that has been missing."},{race:"Southwell 3.30",horse:"Rose Of Knocknamoe",odds:"11/2",stake:"",category:"",analysis:"Rose Of Knocknamoe works well at home for Fergal O'Brien, though she can be keen in the early stages. If settling into a rhythm she should run well, though the unknown quantity of bumper newcomers makes confident prediction difficult. The yard clearly like her."},{race:"Southwell 3.30",horse:"Queens Charm",odds:"5/4",stake:"",category:"",analysis:"Queens Charm won an Irish maiden mares' point-to-point on debut in early November before being acquired at the Goffs UK sale at Newbury. Ben Pauling's team report she shapes nicely at home and they hope she can make a winning start in this bumper. With the benefit of a winning debut under rules in Ireland, she brings more experience than most in the field."},{race:"Sedgefield 4.10",horse:"Hay Max",odds:"8/1",stake:"",category:"",analysis:"Hay Max has run in three bumpers and now takes on a significant new challenge with this debut over hurdles. Charlie Longsdon reports that the transition will be a big learning curve but hopes the horse can make the adjustment and run a respectable first race. One for the notebook rather than the wallet at this stage."},{race:"Southwell 4.30",horse:"Campaign Trail",odds:"7/1",stake:"",category:"",analysis:"Campaign Trail would ideally prefer softer ground according to connections at the Bailey and Nicholls yard, but they believe this is the right race for him if things go his way. He goes there fresh and well after a break, though he is not the easiest ride. Place chances are the realistic target."},{race:"Kempton 7.00",horse:"Twilight Glow",odds:"25/1",stake:"",category:"",analysis:"Twilight Glow is a horse with considerable potential according to John Portman, who admits to having inadvertently inflated his handicap mark when the horse finished second at Newbury last year. He carries more weight than ideal as a result but has come back well from his winter break. Today's run will help connections determine the optimal trip, whether six or seven furlongs, and at 25/1 there may be each-way value if things fall his way."}],doubles:"",antePost:""},
{id:"19d483dfd771625e",originalSubject:"Today's Qualifiers [ 1st April ]",from:"BetRate <admin@betrate.co.uk>",author:"BetRate",emailDate:"2026-04-01T08:51:55Z",tipDate:"2026-04-01",processedAt:"2026-04-01T09:15:00Z",originalBody:"Streamsforth Lad (8/1) was placed yesterday. Crap racing today, just one selection.\n\nToday's Qualifiers\n\nDundalk 5.45 - Inishfallen (9/4)\n\n(Recommended stakes - win bet (below 6/1), e/w bet (6/1 or bigger)\n\nRemember, although only the selections are posted, there is a lot of work that goes on behind the scenes to build the bets and find genuine value, and it pays dividends long-term. Never judge on a small sample, judge the service over a decent period of time.\n\nBe lucky\nAlex\nBetrate",originalHtml:"",selections:[{race:"Dundalk 5.45",horse:"Inishfallen",odds:"9/4",stake:"1 point win",category:"",analysis:""}],doubles:"",antePost:""},
{id:"19d4838f819f7f8f",originalSubject:"Daily AI Analysis [ 1st April ]",from:"IQ Sports <info@iqracing.net>",author:"IQ Racing",emailDate:"2026-04-01T08:46:25Z",tipDate:"2026-04-01",processedAt:"2026-04-01T08:49:00Z",originalBody:"Wednesday 1st April\n\nKempton 7.30 - Parisian Scholar\nAdvised Odds: 5/2 (Bet365, William Hill)\nAdvised Bet: 2 point win\n\nPerformance Metrics: Lightly raced three-year-old gelding with outstanding form figures of 1171-2, translating to three wins from just five career starts. The only blot on the copybook is the dash in the form which represents a short break, and a solid second last time out which reads well in context. Carries a Racing Post Rating of 90 against an official mark of just 79, a gap of 11lbs that suggests he remains significantly ahead of the handicapper. By Study Of Man out of a Champs Elysees mare, the pedigree supports the step up to this 11f trip on a slower surface.\n\nTrack Characteristics: Kempton's Polytrack turning circuit over 11f rewards horses who can travel smoothly and sustain their effort through the home straight. The Standard To Slow conditions should pose no issues for a horse who has shown versatility across surfaces, and the small five-runner field reduces the risk of traffic problems. Drawn in stall 3, he should be able to track the pace comfortably without being caught wide.\n\nRace Projection: In a race of this size, the main danger is Moment Of Light who brings a C&D win and is a deserved favourite at 2/1. But the bare form comparison favours Parisian Scholar clearly, three wins from five against one from four, and the RPR gap over his mark is the widest in the field. With Jason Hart booked and conditions to suit, he looks capable of confirming his superiority and the 5/2 represents genuine value against a horse trading a full point shorter with inferior career figures.",originalHtml:"",selections:[{race:"Kempton 7.30",horse:"Parisian Scholar",odds:"5/2",stake:"2 point win",category:"",analysis:"Parisian Scholar brings a remarkably consistent profile to this 11-furlong Kempton contest, his form figures of 1171-2 advertising a horse who has simply outgrown his current mark. The Racing Post Rating of 90 towers above an official handicap mark of just 79, a differential of 11lb that the handicapper will struggle to contain for much longer. The Study Of Man gelding has shown commendable versatility across surfaces and the step up in trip looks tailor-made given his dam's Champs Elysees pedigree. In a five-runner affair with minimal scope for traffic problems, Jason Hart can settle him behind the pace before delivering a challenge that the market leader Moment Of Light may find impossible to repel. At 5/2, this represents the kind of value that rarely lasts."}],doubles:"",antePost:""},
{id:"19d483245ff86ecd",originalSubject:"BetSeven - 1st April",from:"BetSeven <info@betseven.co.uk>",author:"BetSeven",emailDate:"2026-04-01T08:39:06Z",tipDate:"2026-04-01",processedAt:"2026-04-01T08:49:00Z",originalBody:"BETSEVEN\n\nGolden Prince was placed yesterday at a big price.\n\nWincanton 3.50 - Harry Junior - 1.5 point win at 5/1 (General)\nHarry Junior is a likeable front runner who looks well suited by conditions here and can follow up his recent success. He showed a strong attitude when making all last time, pulling clear before rallying when challenged, and that form reads well with the front three well clear. A 5lb rise looks fair and this sharp track should suit his running style perfectly. With similar tactics likely, he can dictate again and prove hard to pass.\n\nChris Howard\nBetSeven",originalHtml:"",selections:[{race:"Wincanton 3.50",horse:"Harry Junior",odds:"5/1",stake:"1.5 point win",category:"",analysis:"Harry Junior delivered a performance of real substance when making all at his most recent outing, pulling clear of his rivals before showing genuine battling qualities when challenged in the closing stages. The form received a boost when the first three home pulled well clear of the remainder, and a 5lb rise in the weights looks more than manageable for a horse still on an upward trajectory. This sharp Wincanton track plays perfectly to his front-running style, allowing him to establish his rhythm from the outset and dare his rivals to come and get him. With conditions in his favour and the tactical advantage of dictating the pace, he can prove extremely hard to pass."}],doubles:"",antePost:""},

{id:"19d48086e2d51d47",originalSubject:"S Harris - 1st April",from:"Stephen Harris (via Rob)",author:"Stephen Harris",emailDate:"2026-04-01T07:53:22Z",tipDate:"2026-04-01",processedAt:"2026-04-01T07:56:33Z",originalBody:"Wincanton 3.20 - Ignore The Door - 1 point win at TBC\n\nIgnore The Door looks the one with upside in a race where most are fully exposed. He shaped with promise on chasing debut at Kempton in a stronger race than this, making a mistake before rallying briefly and then fading late. That run should have brought him forward and he has been given time since to improve his jumping. Dropping in class here on better ground, off a workable mark, he looks capable of taking a step forward for a yard in excellent form.\n\nWincanton 3.50 - Harry Junior - 1 point win at TBC\n\nHarry Junior is a likeable front runner who looks well suited by conditions here and can follow up his recent success. He showed a strong attitude when making all last time, pulling clear before rallying when challenged, and that form reads well with the front three well clear. A 5lb rise looks fair and this sharp track should suit his running style perfectly. With similar tactics likely, he can dictate again and prove hard to pass.",originalHtml:"",selections:[{race:"Wincanton 3.20",horse:"Ignore The Door",odds:"TBC",stake:"1 point win",category:"",analysis:"Ignore The Door showed enough on chasing debut at Kempton to suggest there is a race in him over fences. He made a mistake in a stronger contest than this before rallying briefly and fading late, but that experience should have brought him forward. Given time since to sharpen his jumping, he now drops in class on better ground off a workable mark. The yard is in excellent form and this looks an ideal opportunity for him to build on that initial promise."},{race:"Wincanton 3.50",horse:"Harry Junior",odds:"TBC",stake:"1 point win",category:"",analysis:"Harry Junior is a front runner of considerable resolve and this sharp track should play to his strengths perfectly. The form of his last success reads well, having made all before pulling clear and then rallying gamely when challenged, with the front three well strung out from the rest. A 5lb rise looks more than fair for that level of performance. Similar prominent tactics here should see him dictate matters once more. The conditions are right in every department."}],doubles:"",antePost:""},
{id:"19d4803f485c2487",originalSubject:"BetRev - Wednesday 1st April",from:"BetRev <admin@bethub.pro>",author:"BetRev",emailDate:"2026-04-01T07:48:31Z",tipDate:"2026-04-01",processedAt:"2026-04-01T07:56:33Z",originalBody:"Daily Digest - Wednesday 1st April 2026:\n\nNeither selection ran with much credit yesterday but it signalled the end of another incredible month for us, with profit in excess of +100 points.\n\nI will not be offering anything up today on a very poor day's racing. There is some decent stuff coming up in the next few days, so we will keep our powder dry for that.\n\nBet Summary:\nNo Bets today.\n\nBe Lucky\nG.J.",originalHtml:"",selections:[],doubles:"",antePost:""},

{id:"19d4407aba8d275b",originalSubject:"Form Guru - 31st March",from:"The Inside Rail <info@theinsiderail.co.uk>",author:"Form Guru",emailDate:"2026-03-31T13:14:06Z",tipDate:"2026-03-31",processedAt:"2026-03-31T14:21:36Z",originalBody:"Today's Selections:\n\n2.45 - Bangor - Ocean Waltz. 1 pt e/w. Available at 14/1. (Bet365, Unibet, BOG)\n\n3.50 - Bangor - Anyharminasking. 1.25 pts e/w. Available at 10/1. (Ladbrokes, Coral, BOG)\n\n4.20 - Bangor - I See The Sea. 0.75 pts e/w. Available at 16/1. (Unibet, Betfred, Ladbrokes, Coral, BOG)\n\n5.00 - Newcastle - Lone Star. 0.75 pts e/w. Available at 22/1. (Generally available, BOG)\n\n5.35 - Newcastle - Newport. 0.75 pts e/w. Available at 16/1. (Generally available - 1/5 odds first 4, BOG)",originalHtml:"",selections:[{race:"Bangor 2.45",horse:"Ocean Waltz",odds:"14/1",stake:"1 point e/w",category:"",analysis:""},{race:"Bangor 3.50",horse:"Anyharminasking",odds:"10/1",stake:"1.25 points e/w",category:"",analysis:""},{race:"Bangor 4.20",horse:"I See The Sea",odds:"16/1",stake:"0.75 points e/w",category:"",analysis:""},{race:"Newcastle 5.00",horse:"Lone Star",odds:"22/1",stake:"0.75 points e/w",category:"",analysis:""},{race:"Newcastle 5.35",horse:"Newport",odds:"16/1",stake:"0.75 points e/w",category:"",analysis:""}],doubles:"",antePost:""},
