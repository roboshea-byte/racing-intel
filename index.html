    originalBody: "3.07 Southwell\nSpirit Of Bowland\n5/1 - EACH WAY (B365)\n9/2 - EACH WAY (Skybet) *4 Places Paid\n\nThe only previous CD winner in the field and he wasn\'t given the best of rides from Paul Mulrennan in a recent classified Stakes race when 3rd, the selection was very well supported that day too which makes you think Connections reckon he\'s in a good place.\n\nIt\'s also interesting and looks positive with the change of jockey, Callum Rodriguez has a great record on this horse having won on him in 3 of the horse\'s 4 career wins to date, including his last win which came over today\'s CD in April (2025) from a higher mark, in a standard cl6 and obviously a higher all round standard of race, not to mention he couldn\'t have won much easier that day.\n\nA similar run to that this time around will definitely see him go close at the very least, if he opens up at the price expected I would imagine he would be hammered in the betting so we will need to get on quick just in case.\n\n5.07 Southwell\nWinchurch\n15/2 - EACH WAY (B365)\n9/1 - EACH WAY (Skybet) *4 Places Paid\n\nA horse who\'s been desperately out of form, he\'s not even managed to hit the frame in any of his last 10 starts after winning at Leicester last June.\n\nAll of his 3 Wins to date have been over the minimum distance (5f), including here when winning on racecourse debut.\n\nHowever he slightly caught my eye last time with a much improved performance when tried again up to 6f at Lingfield, he wasn\'t given a particularly hard time with some delicate handling and being held well off the pace, the way he picked up with little encouragement close home offers some hope that he can build on that, if up nearer the pace and a willing ride he could certainly run a decent race and some value again at an expected outsider opening price from a career low mark.\n\nHe\'s previously finished ahead of horses in the mid 70s on several occasions and he\'s also 9lb below his last turf winning mark, he\'s won on this surface previously however so should be able to give it a go with a more positive and aggressive ride. Harry Davies takes over for the first time today, the draw without doubt could\'ve been kinder but he\'s not the quickest away so should hopefully drop in if not losing too much ground from the gates and of course getting a clean/clear run which isn\'t always a given as we well know.\n\n7.00 Chelmsford\nFiddlers Green\n11/2 - EACH WAY (B365)\n15/2 - EACH WAY (Skybet)\n\nFar from disgraced when finishing just over 3 lengths behind the front 4 when running well out of the weights in a cl4 last time at Wolves over slightly further.\n\nHe\'s got a better record on the grass but his last Win did come on the AW (Kempton) and he\'s dropped down 2 grades into cl6 company today from a lower mark. He\'s still 4lb above that winning mark, however he finished a head 2nd from 1lb lower to a 70 rated horse at Kempton in December (2025), that horse went on to win again the race after now rated 76.\n\nThe selection ran a 2 length 2nd in the race after that again at Kempton but under a 3lb penalty for that close finish, that mark is 2lb higher than what he runs from today which for me puts him in the picture today.\n\nHe will come off the bridle and under a strong drive a distance from home but watching Luke Morris on him last time he kept at him in a much tougher race, if horse and jockey do the same today in a much weaker field he shouldn\'t be too far away at all.",

    originalBody: "26TH MARCH 2026\n\nIt's been a very quiet week due to the standard of racing. In truth, it isn't a great deal better on Thursday, but there are a couple of open races worth chancing.\n\n4.20 CHEPSTOW - LAURIER DES OBEAUX 5/1 1PT WIN\nWe've not seen a great deal from Laurier Des Obeaux up to now, but I suspect that he's merely been running for experience and we're possibly about to see a bit more of what this horse is about on handicap debut. He's been running ok, without ever looking like threatening, but he's done enough to suggest that the mark he's been given here might be a little lenient. Two starts ago, we possibly saw his best run in terms of form. Beaten 16 lengths into 5th that day at Newbury, the form has worked out well with the 1st, 3rd and 4th all winning since, the 4th is now rated 116 while the winner 135. He was pitched into a deep novice hurdle last time out, again at Newbury, with the 2nd horse rated 132 and the winner highly regarded. That run came after 2 months off, so should have put him spot on for this and this handicap mark of 105, on the bare form, is certainly a winnable one. The booking of Tom Cannon, who has a 21% strike rate for the yard this year and is only here for this ride, looks a noteworthy one too. The yard are in good form.\n\n4.30 WARWICK - GET UP MUSH 7/2 1PT WIN NAP\nA bit gutted that the price has shortened so much, but I can understand why, he looks like he's been trained for this. In honesty, on what he's done so far this season, there's nothing to recommend about him. However, he clearly came into this season after setback because he's missed the previous 15 months, having previously looked very progressive. This year has been dreadful, but there's reason to ignore it. He was well entitled to need the first run, the middle two came on soft ground which he clearly doesn't like and the last came going right handed (he's never run well that way round). Today he's back on a left handed track, he's back on good ground and he's well suited by Warwick's flat track too, having won here on his only previous visit. Rated 110, he's 8lb below his last winning mark and, if I'm right about the race being a target, he should be hard to beat for a Skelton yard that are weeks away, hopefully, from that maiden champion trainer title.\n\n7.30 CHELMSFORD - CLOVER TIME 10/3 1PT WIN\nI don't like backing horses with a row of 2s and 3s next to their name, especially when they've never won a race. However, Clover Time might just fall in here. He's the only horse in this race that hasn't just made the running, but has raced handy too and, granted a soft lead, he might not be caught around this front runners track. He's had a layoff since his last run, to freshen up, and is here running under Rab Havlin, for Rab's only ride on the card. He's gone well fresh, stall 1 is perfect and he's found himself in a race full of horses who also don't like winning. If he can't win this, he won't win any.\n\n0.25PT WIN TRIXIE\n\nANTE POST ALREADY ADVISED\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN\n\nEnjoy and good luck!\nBen at The Racing Analyst",

      { race: "Chelmsford 7.30", horse: "Clover Time", odds: "10/3", stake: "1 point win", category: "", analysis: "Clover Time represents a sporting interest in what is a race full of habitual non-winners. It is worth noting that he is the only runner in the field who has shown both the ability and the tactical speed to race prominently, and granted a soft lead around this front runners track he could prove very difficult to peg back. The form received a boost from a freshening break since his last outing and the booking of Rab Havlin, who rides only this horse on the card, is a quietly significant move. Stall one is ideal for his racing style and this looks a gilt edged opportunity." }

    originalBody: "Daily Report Wednesday 25th March\n\nAgain another day of poor jumps action: there are ex-Irish pointers sprinkled across Hereford and Hexham, most of the moderate variety.\n\nFor example, in the 2.11 at Hexham the mare Queens Secret debuts for Ruth Jefferson: the 6 year old returns from an absence of over 12 months, she was last in action when doggedly staying on to win a mares maiden point at Lismore: a daughter of Order Of St George, assessed on her point success, she can be competitive in run of the mill spring/summer novice hurdles: purchased for 40k, the late start to her campaign signals some sort of injury setback. Were she to shape with some promise today, it may be a deposit for a future win.\n\nAnother point winning mare debuting on the track is Emiko (5.13) in the bumper: events favoured her over the closing three furlongs at Dromahane: the clear leader (subsequent dual bumper winner, Kiltybo) fell 3 out and then her remaining threat was taken out by a loose horse 2 from home, allowing Emiko to win by 14 lengths, somewhat flattering. She is a tall athletic lady, and the Richard Johnson racing club invested 75k to secure her services. Alan King has a 44% win strike rate at Hexham from occasional raiders and priced at 5/2, Emiko will be there or thereabouts at the finish: as more of a galloper than an animal with gears, the stiff finish will be an advantage.\n\nNaturally, the focus of the day will be Con Hill in the 7.30 at Kempton: already I am noticing a divergence of opinion amongst punters, some see him as easy money tonight, others happy to oppose and hoping for a blowout.\n\nImportantly, he has previously enjoyed prep workouts on the surface at Kempton: last time the 4 furlong straight at Southwell suited the National Hunt type, here at Kempton with a shorter straight it may take him more time to engage his mighty stride. I think he will again win comfortably unless he bursts, though the winning margin may be shorter than the 9.5 lengths at Southwell. Said triumph will have filled the 9 year old with confidence and he ought to be dispatching his rivals with contempt if later goals of group flat success is to be realised.\n\nThe entries were published earlier this week for the Irish Grand National due on Easter Monday: I note Soldier In Milan is amongst the troop and proving popular at 14/1: he has been left on the 142 rating he had in that unsatisfactory performance at Thurles. For now I will sit on my hands: most markets on the Irish Grand National are 1/4 first four, on race day it will be more like 1/5 first six terms: given Soldier In Milan prefers some juice in the ground, it may be smarter to wait until race day and accept tighter odds (8/1-10/1), should it tee up for him.\n\nDeclan P",

    originalBody: "Lecky Watson to win Randox Grand National\nBest odds: 40/1 (Sky Bet, Paddy Power, Betfair)\n\nBy Matt Brocklebank\n\nLoads of Grand National types have started their campaigns in the John Durkan in recent years and I don't think it's earth-shattering to suggest we might have witnessed one or two in this season's Punchestown race as well.\n\nLast year's Aintree third Grangeclare West should have blown the summer cobwebs away with his first start of the campaign, over what is clearly an inadequate trip these days, but he won't be missed by the handicapper and I'm more interested in Willie Mullins stablemate LECKY WATSON at this stage.\n\nAs a Brown Advisory winner, he's likely to remain in top-class staying company for most of the season in Ireland but he's not quite up to the same standard as Fact To File, Gaelic Warrior, Galopin Des Champs or Fastorslow.\n\nInstead, the major handicaps deeper in the year look like more realistic assignments for him and there's every chance he'll be trained with the big one in April firmly in mind.\n\nHis jumping can still be a bit sketchy but he's got time on his side after only a handful of chase starts to date and it almost goes without saying that the Grand National fences really aren't what they used to be.\n\nIf he gets into the race with a mark in the mid-150s I reckon it could be a case of job done as he's a stout stayer, who is often at his best when racing prominently, and I would argue he very much fits the mould of a modern-day Aintree contender.",

    originalBody: "From The Stables - Wednesday 25th March 2026\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS\n\nTONY'S NAP: 16:00 Hereford - Madame De Labrunie\nIt's five years almost to the day that Nicky Richards' Marown last won a race, four years and 17 runs to have him dropped from a rating of 130 to 111. The same reduction in Madame De Labrunie's mark has taken three runs and five minutes, so Fergal must have been delighted with her latest figure of 101. On her winning form at Auteuil, that looks a gift.\n\nTONY'S NEXT BEST: 15:41 Hexham - Jo Coko\nJo Coko didn't take long to get off the mark for Nicky, relishing the 3m2f at Uttoxeter to win at the 2nd time of asking. Another raise in distance on tough ground will make it a grind but Jo Coko has had a light season and should be on the improve.\n\nTONY'S TREBLE: 17:30 Kempton Park - Timely Affair\nTimely Affair won a 0-50 Classified in the first of two visits to Southwell in January, but was less convincing in handicap company when 5th last time. Still off a winnable mark, he can get back on track for William this evening.\n\nTODAY'S FTS RUNNERS - TRAINER QUOTES\n\n14:30 Hereford - Chief Black Robe (8/1)\nF M O'Brien: \"Chief Black Robe ran his best race in this 2nd spell with us when runner-up in a 2m3f chase at Market Rasen but a switch to hurdles soon after proved a big disappointment. We hope the first-time visor and return to fences will provide the key. Place chances.\"\n\n14:30 Hereford - Line Of Descent (9/1)\nW Greatrex: \"Line Of Descent will have come on again for his last run and has dropped back down in the handicap. He should go well here.\"\n\n15:30 Hereford - Kernie d'Airy (11/8)\nJ Snowden: \"By It's Gino (the sire of our Hennessy winner, and obviously Sir Gino), Kernie d'Airy has a lovely pedigree and duly bolted up on her debut in France. The form has worked out well, but she disappointed on her UK debut in a Listed bumper at Newbury. She has been troubled by niggly injuries since, only returning now after 410 days' absence. She will undoubtedly improve for this outing, but is a lovely mare who can progress into better races in due course.\"\n\n15:30 Hereford - Tipperary Star (11/1)\nW Greatrex: \"Tipperary Star fell early last time out. She seems all fine after the mishap and with a clear round of jumping, she should go close.\"\n\n15:41 Hexham - Marown (22/1)\nN Richards: \"This will be the last chapter of 12-year-old Marown's honourable career as our other runner in this 4m test. I have to say the handicappers should be ashamed about his treatment in his later years, never wanting to drop him even taking off a derisory 1lb for an eight-length defeat last time. Why bother? Did they think the late Trevor Hemmings or now Hemmings Racing would be trying to set up a gamble. He goes out with head held high, I don't think they do.\"\n\n15:41 Hexham - Jo Coko (7/2)\nN Richards: \"Two runners in this 4m test which is sure to be a war of attrition. I have to trust Jo Coko will stay, but stamina won him the day at Uttoxeter and I'm hopeful he can pull it off.\"\n\n16:00 Hereford - Madame De Labrunie (11/4)\nF M O'Brien: \"Madame De Labrunie was quite useful in France and started out here with a 120 rating. It's already down to 101 after three undistinguished runs and with the 10lb wfa in her favour, she could be a big threat. The first-time visor could help too.\"\n\n16:52 Lingfield Park - Mart (14/1)\nD Cunha: \"Class 5 handicaps over this 6f have been Mart's bread and butter. He's been going through the motions of late, but now off his lowest mark for more than two years, it wouldn't be a shock if he did figure, although being drawn 12 of 12 is a negative.\"\n\n17:05 Hereford - Legend D'Airy (10/3)\nB Pauling: \"Legend D'Airy has a good jumping pedigree on the dam's side and Derby winner Motivator adds class as his sire. We've had him a while and hopefully he will be a big factor although the favourite looked good when last seen more than a year ago.\"\n\n17:30 Kempton Park - Timely Affair (11/8)\nW Knight: \"Timely Affair is drawn a little wider than ideal. He was too keen last time but is well capable of winning a race of this nature if he enjoys a little luck in running. Hopeful.\"\n\n18:30 Kempton Park - Miss Guinevere (12/1)\nC Fellowes: \"Miss Guinevere is a nice filly who has been working well in the build-up to this debut. She has a lovely draw and seems incredibly professional at home. I will be disappointed if she doesn't make a nice start to her career.\"\n\n19:00 Kempton Park - Heart Sign (7/1)\nJ Morland: \"Heart Sign runs in a typical Kempton 3yo 0-70 handicap for the time of year, with plenty of unexposed types. Heart Sign has a perfect inside draw and a good jockey booking in Callum who will keep him close to the pace. The step up to a mile will suit and I'm optimistic of a big run.\"\n\n19:30 Kempton Park - Star Artist (66/1)\nH Morrison: \"Not much to say about Star Artist as she again plays a walk-on role behind the star turn Constitution Hill. There were gripes from some quarters about another flat race, but I've got the biggest contingent of owners ever to see her (and him, no doubt) run!\"",

    originalBody: "Wednesday 25th March 2026\n\nNAP (Best Bet)\n\nMy best bet of the day on Wednesday comes within the 5.05 at Hereford, which is a National Hunt Flat race that's contested over two miles. I think that ONE NIGHT should be tough to beat here for Emma Lavelle. He hasn't been seen for over two years; however, he was an impressive winner last time out at Southwell, winning by just shy of four lengths. Today's rider, Cameron Johnstone-Baker, takes off ten pounds here, which is another big plus, and he looks the one to beat in a moderate affair.\n\n5.05 Hereford - ONE NIGHT - (4/5) (NAP)\n\nNB (Next Best Bet)\n\nThe next best bet of the day also comes from Hereford, and the 2.30, which is a Class 5 handicap chase over two miles and five furlongs. LELANT holds strong claims here under the champion jockey Sean Bowen. He won back-to-back handicap chases in October and November, before failing to fire on heavy ground at Fontwell last time out. He can be forgiven for that effort, and I'd expect him to put in a much better showing on a better surface here.\n\n2.30 Hereford - LELANT - (6/4) (NB)\n\n3B (Third Best Bet)\n\nI head over to Lingfield for my third-best bet of the afternoon, and the 4.52, which is a Class 5 handicap on the all-weather over six furlongs. James Owen has a very lively challenger here in PROFIT STREET, who's the mount of Luke Morris, which is always a bonus on the all-weather. This five-year-old is an ultra-consistent type, coming into the race with form figures of 12112. He was only beaten by a shoulder off this mark by Royal Jet last time out at this track over seven furlongs, and looks sure to be bang on the premises once again here.\n\n4.52 Lingfield - PROFIT STREET - (7/4) (3B)\n\nEach-Way Bet\n\nMy best each-way bet of the afternoon comes within the 1.52 at Lingfield, which is the first division of a Class 6 handicap over seven furlongs. I've come down on FORT AUGUSTUS here for Charlie Wallis and Rob Hornby, who's currently trading at a best price of 11/2. He's still a maiden after sixteen starts; however, that doesn't tell the full story, as he's shown plenty of promise in defeat, with much of it coming at a higher level than this. He was only beaten by a length over course and distance last time out off the same mark, and could prove to be a big player if he's in the same form for this assignment.\n\n1.52 Lingfield - FORT AUGUSTUS - (11/2) (Each-Way)\n\nLongshot\n\nThe longshot comes from Kempton on Wednesday, and within the 7.30, which is a Class 3 novice event over a mile and four furlongs. Constitution Hill is all the rage here, and should follow up his impressive flat debut at Southwell last month, which is reflected in his very skinny price. With three places on offer here currently, I've taken a chance on KEEP IT COOL at a mammoth 125/1 for James Owen, who's the mount of three-pound claimer Christian Howarth. She outran a massive price of 200/1 last time out at Wolverhampton when finishing second of five behind a promising type in Mobberley Rose. She was keeping on over eight and a half furlongs on that occasion, giving the impression that a step up in distance should suit her. This isn't a deep race beyond the favourite, and she has every chance of hitting the frame.\n\n7.30 Kempton - KEEP IT COOL - (125/1) (Each-Way)",

    originalBody: "3.41 Hexham - Planned Paradise (1pt win at 2/1, bet365)\n\nTop weights are usually worth opposing in 4m handicap chases at Hexham with the score in the past ten years standing at 0-22 (expected winners = 2.69). We have four runners on 12 stone in this marathon contest and I'm taking them on with Planned Paradise, who appreciated the drop to Class 4 level when scoring comfortably at Bangor last time. The faster ground won't be an issue, he earned a sectional times upgrade for his latest win and Christian Williams' long travellers usually do well in handicap chases during the second half of the season (January to April), with those travelling more than 125 miles from their Welsh base landing 43 of their 178 starts (24.2% strike-rate) for a profit of 64.39 to a 1 level stake at SP (expected winners = 33.29, A/E = 1.29). Shighness, 7lb lower than when going down narrowly in this race last year, could prove to be the chief threat.\n\n7.00 Kempton - Blues And Royals (1pt win at 9/1, bet365)\n\nMichael Bell's Blues And Royals looks a likely improver on the back of a gelding operation and is worth chancing on his handicap debut. His trainer is 25 from 86 (29.1% strike-rate) with newly gelded runners on their handicap debuts for a profit of 47.38 to a 1 level stake at SP (expected winners = 15.14, A/E = 1.65). The score at Kempton only is four from seven and it looks significant that he prepped over a shorter trip here last time out, finishing an outpaced 18/1 third in a 7f maiden.",

    originalBody: "Graeme Rodway, Deputy betting editor\n\nGlory And Honour\n4.41 Hexham\n\nAll eyes might be on Constitution Hill at Kempton, but I'm far more interested in the jumps action at Hexham where there are three good bets to be had. The best of them may be Glory And Honour, who returns to fences after a 173-day break in the 2m4f handicap chase (4.41).\n\nThe ten-year-old was successful on the Flat at Pontefract in 2024 after an 85-day hiatus on the last occasion he returned from a break of longer than 50 days, so he goes well fresh.\n\nGlory And Honour also likes this course, having recorded form figures reading 213 at Hexham, and he is back to the same mark as when last successful here in June last year.\n\nHe has shown little form following that last success and comes into this race having been beaten at least 13 lengths on all five starts since, but only two of those runs were over fences and he is a better chaser than hurdler or Flat performer. There is more to come back chasing.\n\nGlory And Honour is a winner over this 2m4f trip and will be well suited by returning to further, having looked short of pace in a 2m handicap hurdle here when last seen in October.",
    selections: [

  {
    id: "19d211d52bb48f09",
    originalSubject: "Antepost - Harry Wilson: Saturday 28th March",
    from: "Harry Wilson (via Rob)",
    author: "Harry Wilson",
    emailDate: "2026-03-24T18:30:59Z",
    tipDate: "2026-03-28",
    processedAt: new Date().toISOString(),
    originalBody: "Harry Wilson, Betting expert\n\nTreble Tee\n3.00 Doncaster\n1pt each-way at 14/1 with Coral\n\nGlittering Surf\n3.15 Kempton\n1pt each-way at 14/1 with bet365\n\nShout\n3.35 Doncaster\n1pt each-way at 12/1 with bet365\n\nAnno Domini\n3.35 Doncaster\n1pt each-way at 16/1 with bet365\n\nThe opening day of the British Flat turf season is just a few days away and it brings a new set of challenges as well as much excitement.\n\nA question I ask myself at this time of year is: should I favour those who have had a prep or bank on a trainer's ability to get them ready after a break? I've found that a mixture of course form, proven ability in the ground and a capability when fresh (when dealing with horses after a break) won't steer you far wrong.\n\nThat is going to be a common theme for my Saturday selections, starting with Shout and Anno Domini in the feature William Hill Lincoln (3.35) at Doncaster.\n\nShout produced Racing Post Ratings of 104 when returned to a mile on his final two starts last season, running out a ready winner on soft ground at Ascot in September before finishing fourth in the Balmoral Handicap back at that track the following month.\n\nHe was a comfortable winner of his only start at Doncaster, has form figures of 12 after breaks of 51 days or more, and has won on ground ranging from good to firm to soft, so the unsettled forecast won't bother him either. He should get a nice tow into this contest and will have more to offer this season.\n\nWintering in Dubai can often be a help in the early season so it is worth having a bit each-way on Anno Domini, who bids to become the third four-year-old to win the Lincoln for Charlie Appleby in the last decade.\n\nHe returned from a gelding operation and a 246-day break with two good efforts at Meydan in December and January, latterly doing well to finish sixth in a mile handicap from a poor draw having been on the outer throughout.\n\nAnno Domini had some smart juvenile form, notably finishing fifth in the Group 1 Futurity over course and distance behind the likes of Hotazhell, Delacroix and Wimbledon Hawkeye, and went down only narrowly on his three-year-old reappearance last April. He looks sure to be suited by a well-run handicap over a mile.\n\nI'm keen to oppose Docklands in the earlier William Hill Doncaster Mile (3.00), given he finds it hard to win away from Ascot. The one who looks overpriced is Treble Tee.\n\nThe four-year-old shaped incredibly well in his first two handicaps, pushing a progressive winner to a neck despite being keen on his reappearance before not getting the clearest runs through when second at Goodwood. He then looked a class apart when scoring with plenty in hand over course and distance in September.\n\nTreble Tee produced a fine effort on the clock that day, running a faster furlong-by-furlong time than Group 2 Champagne Stakes winner Puerto Rico, who then followed up in a couple of Group 1s.\n\nHis two defeats since shouldn't be viewed too harshly, given his keenness over an extra furlong took its toll in the Cambridgeshire, and much softer ground was likely against him when last seen. He retains considerable potential, doesn't have loads to find and, with a proven ability fresh and good course form, is worth a wager.\n\nIt's all about the Flat on the terrestrial coverage, with Doncaster being joined by three races from Kempton, where Group 1 performers Survie and Cathedral could feature in the Listed Snowdrop Stakes (3.15).\n\nTheir very best form has come over further, though, and I'm more inclined to take a chance on Glittering Surf, who looked a potential star on the all-weather before taking a couple of backward steps on turf last season.\n\nThe Owen Burrows-trained four-year-old looked smart when readily pulling clear from the front in a mile maiden at Kempton in December 2024, and confirmed that impression three months later when coming from last to first in a conditions event back over that course and distance.\n\nThat effort can be marked up, given the race wasn't strongly run, and the time compared well with the earlier Listed fillies' event won by the then 111-rated Soprano. The third won a Listed race and was just touched off in a Group 3, while the runner-up finished second in a Listed race next time, so the form looks solid.\n\nGlittering Surf wasn't able to replicate that form in two starts on turf, but it could just be that she's better suited to an artificial surface, and this big-framed filly is just the type to flourish as a four-year-old. She won on this card 12 months ago and Burrows is likely to have her primed.\n\nWilliam Hill Lincoln: the contenders\n\nLa Botte\nLooked to have considerable potential when beaten just a neck in the Britannia Stakes at Royal Ascot on his handicap debut last year. Returned from a break with an eye-catching fourth at Wolverhampton two weeks ago in preparation for this and could be a better than a handicapper.\n\nEternal Force\nShowed big improvement after being gelded, following his novice victory with two handicap successes at Newbury and Haydock. An 8lb rise doesn't look unduly harsh and this has been the target for last year's winning trainer for some time.\n\nRogue Diplomat\nWon four on the bounce last season, the last two coming in 7f handicaps at this course. Looks to have handicapping scope off just 3lb higher but does have something to prove at this distance, having been beaten in all four starts beyond 7f.\n\nShout\nImproved for returning to a mile at the back end of last season, producing Racing Post Ratings in excess of 100 at Ascot. He goes well fresh, has won at the track and is unexposed at this distance, so could have more to offer.\n\nBotanical\nWasn't at his best for George Boughey last year, but the pick of his efforts came when third in the Listed Doncaster Mile on his reappearance. He is well handicapped on the pick of his form if the switch to Karl Burke has a positive effect.\n\nSea Force\nWent close in a couple of strong three-year-old handicaps following a gelding operation before justifying favouritism at Yarmouth in September when last seen. He won snugly that day and has more to offer.\n\nAnno Domini\nGelded before shaping well from a poor draw in a mile handicap at Meydan. Has some classy juvenile form, including at this track, and his trainer won this with a four-year-old who wintered in Dubai in 2016.\n\nThe Lost King\nHas taken well to the all-weather since returning from a break in January, winning two of his three starts, including getting the better of a subsequent winner at Wolverhampton last time. He's won on turf, but does have the option of All-Weather Championships finals day next week.",
    isAntepost: true,
    selections: [
      { race: "Doncaster 3.00", horse: "Treble Tee", odds: "14/1", stake: "1 point e/w", category: "", analysis: "Treble Tee made a considerable impression when scoring with authority over course and distance last September, running faster than Group 2 Champagne Stakes winner Puerto Rico on the clock. It is worth noting that his two defeats since can be excused, with keenness over an extra furlong costing him in the Cambridgeshire and softer ground against him on his latest outing. This four year old retains significant untapped potential and returns with proven course form firmly on his side." },
      { race: "Kempton 3.15", horse: "Glittering Surf", odds: "14/1", stake: "1 point e/w", category: "", analysis: "Glittering Surf showed smart form on the all weather surface, coming from last to first in a conditions event at Kempton with the time comparing favourably against a Listed event won by the then 111 rated Soprano. It is worth noting that the form has worked out particularly well, with the third winning at Listed level and the runner up finishing second in similar company. This big framed filly is precisely the type to flourish as a four year old and Owen Burrows is likely to have her primed for this assignment." },
      { race: "Doncaster 3.35", horse: "Shout", odds: "12/1", stake: "1 point e/w", category: "", analysis: "Shout produced Racing Post Ratings in excess of 100 on both occasions he was campaigned over a mile last season, winning with authority at Ascot on soft ground before a creditable fourth in the Balmoral. It is worth noting that he goes well fresh with form figures of 12 after breaks exceeding 51 days. A previous course winner who handles any ground, he is unexposed at the trip and could have significantly more to offer this campaign." },
      { race: "Doncaster 3.35", horse: "Anno Domini", odds: "16/1", stake: "1 point e/w", category: "", analysis: "Anno Domini bids to become the third four year old trained by Charlie Appleby to land the Lincoln in the last decade. It is worth noting that he shaped encouragingly at Meydan on his return from a gelding operation, doing well to finish sixth from a poor draw having raced on the outer throughout. His smart juvenile form included a fifth in the Group 1 Futurity over course and distance and the Dubai winter campaign should have him primed for this target." }

    id: "19d211abd87ca723",
    originalSubject: "Antepost - Pricewise: 2,000 Guineas",
    from: "Pricewise (via Rob)",
    author: "Pricewise",
    emailDate: "2026-03-24T18:28:11Z",
    tipDate: "2026-05-02",
    processedAt: new Date().toISOString(),
    originalBody: "Tom Segal, Pricewise\n\n'He has all the credentials required to be a major factor' - Tom Segal takes aim at the 2,000 Guineas\n\nGewan\nBetfred 2,000 Guineas, Newmarket, May 2\n1pt win at 10/1\n\nWith the exception of Notable Speech, who hadn't run at all, the vast majority of 2,000 Guineas winners had been seen in Group races as a juvenile. The Classic comes so early in the campaign that it's really hard for late-developing types to make an impact, so at this stage the first port of call should always be with the Group races run at the end of the previous season.\n\nThe Dewhurst isn't always the key to the 2,000 Guineas, but it's often the best starting point because it's a Group 1 over 7f on the same track, and last year's race looked right up to scratch.\n\nThe winner was the Andrew Balding-trained Gewan, and if he hadn't run below par on slower ground than he probably likes at Doncaster, he would have cast-iron Guineas claims. He appeared to be much the best in the Dewhurst, and the form was given a big boost when runner-up Gstaad won the Breeders' Cup Juvenile Turf with plenty to spare.\n\nBalding has a great record in the 2,000 Guineas, having won it twice since 2020 with Kameko and Chaldean, and there is no reason why Gewan can't be as good as either of them. The plan is to start him out in the Greenham at Newbury, where Chaldean was supposed to have his trial before he unshipped his jockey at the start.\n\nWhat I especially like about Gewan is how uncomplicated he appears to be, how comfortable he was at Newmarket and that he is a front-runner. He has all the credentials required to be a major factor. While he might not be the best miler of his generation by the end of the season, he might just be in the first week of May and he makes by far the most appeal at 10/1.\n\nVery soft ground would obviously be a concern, but we thought the same in Chaldean's year and it didn't stop him, while it could have been something other than the ground that led Gewan to underperform at Doncaster as most progeny of Night Of Thunder would not have an issue with good going.\n\nCharlie Appleby, who has won three of the past four runnings of the 2,000 Guineas, has a few likely types. However, his most obvious one is Distant Storm, who was no match for Gewan in the Dewhurst.\n\nThe trends gurus won't be keen on anything trained by Aidan O'Brien given City of Troy and Auguste Rodin both ran atrociously in the Guineas before going on to win the Derby. O'Brien clearly trains all his horses to improve throughout the season meaning they are often not at their best in May, but I wouldn't be too confident going down that road this season as Albert Einstein, Gstaad and Puerto Rico, his three most likely Guineas runners, do not appear to be Derby horses.\n\nWith all three of them entered at the Curragh on Saturday, it looks like O'Brien is making sure he has them ready for Newmarket. The yard also looks further forward than usual after having three winners at Naas at the weekend.\n\nAlbert Einstein appears to be the chosen one, but he's a long way behind the other two on form and looks a bad price on what he's actually achieved. Gstaad, who has the course form and the experience, would look the strongest Ballydoyle contender, but Gewan beat him with a bit to spare in the Dewhurst.\n\nBow Echo has a Group 2 win over course and distance to his name and is also by Night Of Thunder. He has a lot going for him, but the form of his Royal Lodge victory looks a few pounds below that of the Dewhurst, and he's a good bit shorter than Gewan.\n\nPublish has potential as he tries to break the Gosden hoodoo in the race. He has a bit to prove, though, and might not love the undulations at Newmarket. The same might also apply to Zavateri, who didn't look totally at home on the track in the Dewhurst.\n\nWhat they say\n\nKarl Burke, trainer of Alparslan, Billecart, Crown Relic and Hankelow\nHankelow is on target for the Guineas. The idea was to go straight there if the ground is good or slower, but he's actually further forward than I thought so we may go for a trial with him. He could be a mile-and-a-quarter horse but we could send him to the Craven to see. We've got the trials coming and Alparslan will go to Newbury. Whether he's going to stay a mile I don't know but that'll give us a clue. Crown Relic is in the French Guineas as well and could go to France for one of their trial races, the Prix Djebel over seven furlongs on April 7.\n\nEve Johnson Houghton, trainer of Zavateri\nHe's done really well over the winter and I couldn't be happier with him. I don't know where we're going to go and what we're going to do. It depends on the weather and the ground. He's unlikely to have a prep race but everything is in the mix at this stage.\n\nThady Gosden, joint-trainer of Publish\nHe's done very well over the winter. He's always been a tall horse but he's really filled out and strengthened up, and he's certainly been pleasing in his training through the spring. He's matured as you'd hope he would over the winter and hopefully he'll be looking towards a trial.",
    isAntepost: true,
    selections: [
      { race: "Newmarket 3.35 (May 2)", horse: "Gewan", odds: "10/1", stake: "1 point win", category: "", analysis: "Gewan announced himself as a leading 2,000 Guineas contender with a thoroughly convincing Dewhurst Stakes triumph that marked him down as the best juvenile miler in training. It is worth noting that the form received a significant boost when runner up Gstaad went on to land the Breeders' Cup Juvenile Turf in impressive fashion. Andrew Balding, who has already saddled Kameko and Chaldean to Guineas glory, clearly has another live contender on his hands. The son of Night Of Thunder is uncomplicated, comfortable on the Rowley Mile and possesses the tactical speed of a natural front runner. His below par effort at Doncaster can be attributed to ground conditions rather than any lack of ability. Don't say you weren't warned." }

    originalBody: "From The Stables - Tuesday 24th March 2026\n\nFTS FEATURE BETS - TONY STAFFORD'S FAVOURED BETS\n\nTONY'S NAP: 17:00 Southwell - Kylenoe Dancer\nKylenoe Dancer makes her first appearance since May. She won on only her 2nd start for Kim/Mat and that team knows how to ready one after an absence. Her bottom-weight 79 mark is unlikely to be a worry in a pig's breakfast of a handicap.\n\nTONY'S NEXT BEST: 16:30 Southwell - Fine Casting\nAlthough Fine Casting hasn't won over hurdles for ages, he had plenty of runs in the money last season at that discipline. Ben drafts in a useful 7lb claimer to minimise the effects of top weight and they could strike here.\n\nTONY'S TREBLE: 20:30 Wolverhampton - Panama Black\nPanama Black is a consistent performer on both turf and all-weather. Brian has found a good opportunity for him to get back into the winner's circle tonight.\n\nTODAY'S FTS RUNNERS - TRAINER QUOTES\n\n14:00 Southwell - Lilting Verse (9/2)\nF M O'Brien: \"Veteran mare Lilting Verse started the season well with a 2nd place at Ffos Las but has been disappointing since. She was running well at this time last year and we hope that the drying ground will assist her. Place chance.\"\n\n14:45 Taunton - Newmill Getaway (7/2)\nF M O'Brien: \"Newmill Getaway has been placed in two of her four runs since joining us from David Brace. We think this bumper winner is poised to post her first hurdles victory after 11 previous tries. Hopeful.\"\n\n16:00 Southwell - Hillberry Hill (4/6)\nK Bailey & M Nicholls: \"Hillberry Hill was the winner of a maiden hurdle in Ireland. He has a rating of 114 over there but hasn't been given one here so runs with a penalty in this novice hurdle. He goes nicely at home and we're hoping he can make a winning start today.\"\n\n16:00 Southwell - Sea Of Fortune (14/1)\nK Bailey & M Nicholls: \"I hate running two horses in the same race but needs must. Sea Of Fortune is huge and has been very backward. He needs to start and we would be delighted to see him being placed. He will build on the experience.\"\n\n16:23 Wolverhampton - Musical Soldier (13/2)\nO Sangster: \"We run two here this evening, both with each-way chances. We expected a good performance from Musical Soldier at Kempton last time after a more promising effort in an earlier visit there. He seems well and we hope he can do better this time.\"\n\n16:30 Southwell - Fine Casting (13/2)\nB Pauling: \"Fine Casting was a winner over fences at Bangor in November and didn't run too badly off the revised mark last time. He retains the 117 figure he won with then for hurdling and reverts to the smaller obstacles today. Top-weight won't be easy but Elliott takes 7lb off. Place chances.\"\n\n16:55 Wolverhampton - Buckland Belle (13/2)\nO Sangster: \"Buckland Belle is only moderate but she seems to be finding her feet and gradually improving. Each-way hope in a tight handicap.\"\n\n16:55 Wolverhampton - Regal And Real (16/1)\nJ Morland: \"Regal And Real hasn't shown us much at home or on the track to be honest. The hope is the visors will contribute to a better performance today but I'll be surprised if he troubles the Judge.\"\n\n17:00 Southwell - Kylenoe Dancer (8/1)\nK Bailey & M Nicholls: \"Kylenoe Dancer hasn't been the easiest to train and has missed the winter. She wants good safe ground and we hope this will be suitable. She is fit and well and has place chances but capable of better.\"\n\n17:00 Southwell - My Fortune (15/2)\nB Pauling: \"We thought the tacky ground rather than going up in trip was the main reason for My Fortune's disappointing run last time at Ludlow. We're trying a first-time tongue-tie here and if that makes a difference he could go well.\"\n\n17:00 Southwell - Feet On The Ground (16/1)\nF M O'Brien: \"Feet On The Ground ran well in 2nd over the CD in December but has been well below that in two runs since. Although still a maiden, she has plenty of 2nd and 3rd places on her card and the hope is she will add to that tally at a big price today. Is it stretching optimism to say she might win? Probably.\"\n\n18:30 Wolverhampton - Top Biller (10/1)\nJ & S Birkett: \"Top Biller was a shade disappointing last run but is suited by this track where he is a CD winner. I'm not sure he will have his own way in front but Dylan Hogan is back on board and knows him well. Hopefully an each-way chance in this grade.\"\n\n20:30 Wolverhampton - Panama Black (11/2)\nB Meehan: \"Panama Black is coming now and this looks a good spot for him. He was only just denied 2nd place in an improved effort at Southwell last time and that gives him a great chance tonight.\"",

    processedAt: "2026-03-25T00:10:00Z",
    originalBody: "Taunton Racing Tips (Tuesday 24 March)\n\nTuesday's meeting at Taunton sees Paul Nicholls come to town at the Somerset rack. Across the seven-race card, he has four runners, with one of those among our tips.\n\n3.45 Taunton \u2013 Wicked Thoughts (1pt win \u2013 10/3)\n\nIt is worth forgiving Wicked Thoughts a fractious run at Exeter last time. Increasingly, it looks as though the seven-year-old is a better horse when fresh. Two of his three wins have come after over 100 days off the track. His other victory, in a four-runner Ascot maiden, is an outlier and came in his easiest winning assignment. As such his second run of this season, after only a 43-day break, is forgiven, as he won on return over course and distance in game fashion. Just 2lb higher than for that win, he should be capable of better yet over fences. To boot, his trainer Paul Nicholls has had more winners at Taunton than anywhere else in the last five years.\n\n4.15 Taunton \u2013 Khafre (1pt win \u2013 7/2)\n\nAn impressive win here last month could set Khafre up to win on his handicap debut. The selection won a point-to-point in January 2015 before debuting under rules this season. He ran well in mid-division in two strong maiden and novice events at Cheltenham and Wincanton respectively. Upped to 2m3f at this venue, he then beat two former winners in good style. He was receiving weight in penalties from those rivals, but that performance strongly suggested that he will win multiple races. An opening mark of 118 is not too harsh and Paddy Hanlon takes off a further 5lb.\n\nWolverhampton Racing Tips (Tuesday 24 March)\n\nWolverhampton hosts nine races across their bumper Tuesday card. We have two best bets in the classified contests.\n\n6.30 Wolverhampton \u2013 Top Star (1pt win \u2013 11/1)\n\nHaving slipped to a rating of 50, Top Star is now eligible for this classified race. His last run for Richard Hughes came at this track in September 2024, when a competitive fourth of eight. After being gelded and enduring a 495-day wait on the sidelines, he returned saddled by Dean Ivory at Chelmsford. His two runs at that Essex venue this term have been poor. However, he was second in between at Southwell, showing he still possesses some racing ability. Tapeta likely suits better than Polytrack and he drops into as winnable a race as possible here. The step up to 6f is not seen as a negative.\n\n7.00 Wolverhampton \u2013 Dr Ali (1pt win \u2013 10/3)\n\nAfter failing to win any of his first 17 starts, Dr Ali finally got his head in front at Kempton. That success in January came in a bunched finish, but was likely achieved in a stronger contest than this. In just his second run in a classified race, he was beaten just a neck over course and distance latest. He has learned to race more gamely than he did before and is joint highest-rated here. There is no issue with his draw and he should be heavily involved.\n\nGG Lucky 15 Tips \u2013 Tuesday 24 March\n\n3.45 Taunton \u2013 Wicked Thoughts\n4.15 Taunton \u2013 Khafre\n6.30 Wolverhampton \u2013 Top Star\n7.00 Wolverhampton \u2013 Dr Ali",

}

var selectedTipsters = null; // null = all selected (initialized on first render)

function getAllTipsters() {
  var seen = {};
  var list = [];
  ARTICLES.forEach(function(a) {
    var au = getAuthor(a);
    if (!seen[au]) { seen[au] = true; list.push(au); }
  });
  var allGrouped = [];
  for (var g in TIPSTER_GROUPS) { allGrouped = allGrouped.concat(TIPSTER_GROUPS[g]); }
  for (var m in META_GROUPS) { allGrouped = allGrouped.concat(META_GROUPS[m]); }
  allGrouped.forEach(function(t) { if (!seen[t]) { seen[t] = true; list.push(t); } });
  return list.sort();
}

function initTipsters() {
  if (selectedTipsters !== null) return;
  selectedTipsters = {};
  getAllTipsters().forEach(function(t) { selectedTipsters[t] = true; });
}

var tipsterDDDirty = false; // true when checkboxes changed while dropdown is open

function toggleTipster(name) {
  initTipsters();
  selectedTipsters[name] = !selectedTipsters[name];
  activeGroupFilter = detectActiveGroup();
  if (tipsterDDOpen) {
    tipsterDDDirty = true;
    updateTipsterDDInPlace();
  } else {
    render();
  }
}

function setAllTipsters(val) {
  initTipsters();
  getAllTipsters().forEach(function(t) { selectedTipsters[t] = val; });
  activeGroupFilter = val ? "all" : "none";
  if (tipsterDDOpen) {
    tipsterDDDirty = true;
    updateTipsterDDInPlace();
  } else {
    render();
  }
}

// Update checkboxes, checked styles, and count badge without re-rendering
function updateTipsterDDInPlace() {
  var panel = document.getElementById('tipsterDDPanel');
  if (!panel) return;
  var items = panel.querySelectorAll('.tipster-dd-item');
  items.forEach(function(item) {
    var cb = item.querySelector('input[type=checkbox]');
    if (!cb) return;
    // Extract tipster name from the text node (after the checkbox)
    var textContent = item.textContent.trim();
    var isChecked = false;
    getAllTipsters().forEach(function(t) {
      if (textContent === t && selectedTipsters[t]) isChecked = true;
    });
    cb.checked = isChecked;
    if (isChecked) { item.classList.add('checked'); } else { item.classList.remove('checked'); }
  });
  // Update the count badge
  var tipsters = getAllTipsters();
  var total = tipsters.length;
  var checked = tipsters.filter(function(t) { return selectedTipsters[t]; });
  var countLabel = checked.length === total ? 'All' : checked.length + '/' + total;
  var badges = document.querySelectorAll('.tipster-dd-count');
  badges.forEach(function(b) { b.textContent = countLabel; });
  // Update group pill active states
  var pills = document.querySelectorAll('.group-pill');
  pills.forEach(function(p) {
    var key = p.getAttribute('data-group');
    if (key) {
      if (key === activeGroupFilter) { p.classList.add('active'); } else { p.classList.remove('active'); }
    }
  });
}

function isTipsterSelected(name) {
  initTipsters();
  return selectedTipsters[name] !== false;
}

function selectFilterGroup(groupKey) {
  initTipsters();
  getAllTipsters().forEach(function(t) { selectedTipsters[t] = false; });
  if (groupKey === "all") {
    getAllTipsters().forEach(function(t) { selectedTipsters[t] = true; });
  } else if (META_GROUPS[groupKey]) {
    META_GROUPS[groupKey].forEach(function(t) { selectedTipsters[t] = true; });
  } else if (TIPSTER_GROUPS[groupKey]) {
    TIPSTER_GROUPS[groupKey].forEach(function(t) { selectedTipsters[t] = true; });
  } else {
    selectedTipsters[groupKey] = true;
  }
  activeGroupFilter = groupKey;
  render();
}

function detectActiveGroup() {
  initTipsters();
  var tipsters = getAllTipsters();
  var selected = tipsters.filter(function(t) { return selectedTipsters[t]; });
  if (selected.length === tipsters.length) return "all";
  if (selected.length === 0) return "none";
  for (var m in META_GROUPS) {
    var mg = META_GROUPS[m];
    if (selected.length === mg.length && mg.every(function(t) { return selectedTipsters[t]; }) && selected.every(function(t) { return mg.indexOf(t) !== -1; })) return m;
  }
  for (var g in TIPSTER_GROUPS) {
    var gg = TIPSTER_GROUPS[g];
    if (selected.length === gg.length && gg.every(function(t) { return selectedTipsters[t]; }) && selected.every(function(t) { return gg.indexOf(t) !== -1; })) return g;
  }
  return "custom";
}

function renderGroupPills() {
  var html = '';
  PILL_FILTERS.forEach(function(pf) {
    var safeKey = escapeHtml(pf.key).replace(/'/g, "\\'");
    html += '<span class="group-pill' + (activeGroupFilter === pf.key ? ' active' : '') + '" data-group="' + escapeHtml(pf.key) + '" onclick="selectFilterGroup(\'' + safeKey + '\')">' + escapeHtml(pf.label) + '</span>';
  });
  return html;
}

function timeAgo(d) { if(!d)return""; var m=Math.floor((Date.now()-new Date(d).getTime())/60000); if(m<1)return"now"; if(m<60)return m+"m"; var h=Math.floor(m/60); if(h<24)return h+"h"; return Math.floor(h/24)+"d"; }
function formatDate(d) { if(!d)return""; return new Date(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function dateLabel(d) { if(!d)return""; return new Date(d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function shortDateLabel(d) { if(!d)return""; var parts = d.split("-"); var dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function escapeHtml(t) { if(!t) return ""; var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }

// Extract time from race string for sorting, e.g. "Kempton 4.05" -> 405
function raceTime(raceStr) {
  var m = (raceStr || "").match(/(\d{1,2})[\.:]+(\d{2})/);
  if (m) return parseInt(m[1]) * 100 + parseInt(m[2]);
  return 9999;
}

// Get all unique tipDates (count = number of emails, not selections)
function getTipDates() {
  var dates = {};
  var deduped = getDeduplicatedArticles();
  deduped.forEach(function(a) {
    if (a.tipDate) {
      if (!dates[a.tipDate]) dates[a.tipDate] = 0;
      dates[a.tipDate] += 1;
    }
  });
  return Object.keys(dates).sort().reverse().map(function(d) { return { date: d, count: dates[d] }; });
}

// Get all selections for a date, sorted by race time
function getSelectionsForDate(tipDate) {
  var sels = [];
  ARTICLES.forEach(function(a) {
    if (tipDate !== "all" && a.tipDate !== tipDate) return;
    var auth = getAuthor(a);
    if (a.selections) {
      a.selections.forEach(function(s) {
        sels.push({
          race: s.race,
          horse: s.horse,
          odds: s.odds,
          stake: s.stake,
          category: s.category,
          analysis: s.analysis,
          tipster: auth,
          tipDate: a.tipDate
        });
      });
    }
  });
  sels.sort(function(a, b) { return raceTime(a.race) - raceTime(b.race); });
  return sels;
}

var pendingDeleteId = null;

function executeDelete() {

  if (el) el.remove();
  render();
}

// ─── DUPLICATE DETECTION ───
// Deduplicates articles by matching subject+tipDate, keeping the first occurrence
function getDeduplicatedArticles() {
  var seen = {};
  return ARTICLES.filter(function(a) {
    if (a.isAntepost) return false;
    // Normalise: strip "Amendment", "Fw:", leading/trailing spaces, lowercase
    var subj = (a.originalSubject || "").toLowerCase().replace(/\(amendment\)/g, "").replace(/^fw:\s*/i, "").replace(/^fwd:\s*/i, "").trim();
    var key = subj + "|" + (a.tipDate || "");
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
}

// ─── HOT CLASH DETECTION ───
function findHotClashes(sels) {
  var map = {};
  sels.forEach(function(s) {
    var key = (s.race + '|' + s.horse).toLowerCase().replace(/\s+/g, ' ').trim();
    if (!map[key]) map[key] = { race: s.race, horse: s.horse, tipsters: [], odds: s.odds };
    if (map[key].tipsters.indexOf(s.tipster) === -1) map[key].tipsters.push(s.tipster);
  });
  var clashes = [];
  for (var k in map) { if (map[k].tipsters.length >= 2) clashes.push(map[k]); }
  clashes.sort(function(a, b) { return b.tipsters.length - a.tipsters.length; });
  return clashes;
}
function isHotClash(race, horse, clashes) {
  var key = (race + '|' + horse).toLowerCase().replace(/\s+/g, ' ').trim();
  for (var i = 0; i < clashes.length; i++) {
    var ck = (clashes[i].race + '|' + clashes[i].horse).toLowerCase().replace(/\s+/g, ' ').trim();
    if (ck === key) return clashes[i];
  }
  return null;
}

    var venue = (s.race || "").replace(/\s*\d{1,2}[\.:]\d{2}\s*/, ' ').trim();
    html += '<td style="font-weight:600;white-space:nowrap">' + (tm ? escapeHtml(tm[1]) : '') + '</td>';
    html += '<td>' + escapeHtml(venue) + '</td>';
    html += '<td style="font-weight:600">' + escapeHtml(s.horse);
    if (clash) html += ' &#128293;';
    if (s.category) html += ' <span class="category-badge">' + escapeHtml(s.category) + '</span>';
    html += '</td>';
    html += '<td>' + escapeHtml(s.stake) + '</td>';
    html += '<td style="font-weight:600">' + escapeHtml(s.odds) + '</td>';
    html += '<td>' + tipsterPill(s.tipster) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ─── RENDER: ANTE-POST TAB (Collation View) ───
function renderAntepost() {
  // Collect all ante-post tips from ALL articles (not just isAntepost ones)
  var apTips = [];
  ARTICLES.forEach(function(a) {
    var auth = getAuthor(a);
    // Check antePost field
    if (a.antePost && a.antePost.trim()) {
      apTips.push({ text: a.antePost, author: auth, articleId: a.id, emailDate: a.emailDate, subject: a.originalSubject });
    }
    // Also check selections for ante-post races (containing "Ante-Post" in race field)
    if (a.selections && a.selections.length) {
      a.selections.forEach(function(s) {
        if (s.race && s.race.toLowerCase().indexOf('ante-post') !== -1) {
          apTips.push({ text: s.horse + ' at ' + s.odds + (s.stake ? ' (' + s.stake + ')' : '') + ' - ' + s.race, author: auth, articleId: a.id, emailDate: a.emailDate, subject: a.originalSubject, structured: { horse: s.horse, odds: s.odds, stake: s.stake, race: s.race, analysis: s.analysis } });
        }
      });
    }
  });

  // Parse tips into structured entries and group by event
  var events = {};
  var eventOrder = [];
  apTips.forEach(function(tip) {
    // Try to parse structured tips from the text
    var lines = tip.text.split('\n');
    lines.forEach(function(line) {
      line = line.trim();
      if (!line) return;
      var parsed = parseAntepostLine(line, tip);
      if (parsed) {
        var key = parsed.event.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!events[key]) { events[key] = { name: parsed.event, tips: [] }; eventOrder.push(key); }
        // Avoid duplicates (same horse + same author)
        var isDupe = events[key].tips.some(function(t) { return t.horse === parsed.horse && t.author === parsed.author; });
        if (!isDupe) events[key].tips.push(parsed);
      }
    });
  });

  var html = '<div class="content"><div class="ap-collation">';
  html += '<h2>Ante-Post Collation</h2>';
  html += '<p class="ap-subtitle">All ante-post suggestions gathered from across every tipster email</p>';

  // Summary stats
  var totalTips = 0;
  eventOrder.forEach(function(k) { totalTips += events[k].tips.length; });
  var totalEvents = eventOrder.length;
  var totalTipsters = {};
  eventOrder.forEach(function(k) { events[k].tips.forEach(function(t) { totalTipsters[t.author] = true; }); });

  if (totalTips === 0) {
    html += '<div class="ap-empty"><h3>No ante-post tips yet</h3><p>Ante-post suggestions will be collated here as tipsters mention them.</p></div>';
  } else {
    html += '<div class="ap-summary-bar">';
    html += '<div class="ap-stat"><div class="ap-stat-num">' + totalTips + '</div><div class="ap-stat-label">Tips</div></div>';
    html += '<div class="ap-stat"><div class="ap-stat-num">' + totalEvents + '</div><div class="ap-stat-label">Events</div></div>';
    html += '<div class="ap-stat"><div class="ap-stat-num">' + Object.keys(totalTipsters).length + '</div><div class="ap-stat-label">Tipsters</div></div>';
    html += '</div>';

    // Render each event group
    eventOrder.forEach(function(key) {
      var ev = events[key];
      html += '<div class="ap-event">';
      html += '<div class="ap-event-header">';
      html += '<div class="ap-event-icon">\u{1F3C7}</div>';
      html += '<div><div class="ap-event-name">' + escapeHtml(ev.name) + '</div></div>';
      html += '</div>';

      ev.tips.forEach(function(t) {
        html += '<div class="ap-tip-row">';
        html += '<span class="ap-horse">' + escapeHtml(t.horse) + '</span>';
        if (t.odds) html += '<span class="ap-odds">' + escapeHtml(t.odds) + '</span>';
        if (t.stake) html += '<span class="ap-stake">' + escapeHtml(t.stake) + '</span>';
        html += '<span class="ap-tipster"><a onclick="switchTab(\'emails\');setTimeout(function(){selectCard(\'' + t.articleId + '\')},100)">' + escapeHtml(t.author) + '</a></span>';
        html += '</div>';
        if (t.notes) {
          html += '<div class="ap-notes">' + escapeHtml(t.notes) + '</div>';
        }
      });

      html += '</div>';
    });
  }

  html += '</div></div>';
  return html;
}

// Parse an ante-post line into structured data
function parseAntepostLine(line, tip) {
  // Handle structured selection data passed through
  if (tip.structured) {
    var raceName = tip.structured.race.replace(/\s*\(Ante-Post\)\s*/i, '').trim();
    return { event: raceName, horse: tip.structured.horse, odds: tip.structured.odds, stake: tip.structured.stake || '', author: tip.author, articleId: tip.articleId, notes: tip.structured.analysis || '' };
  }

  // Pattern: "DateInfo – Event – Horse Odds Stake" (Ben's format)
  var benMatch = line.match(/^[\d]+(?:st|nd|rd|th)\s+\w+\s*[\u2013\-]\s*(.+?)\s*[\u2013\-]\s*(.+?)\s+([\d\/]+)\s+(.*)/i);
  if (benMatch) {
    return { event: benMatch[1].trim(), horse: benMatch[2].trim(), odds: benMatch[3].trim(), stake: benMatch[4].trim(), author: tip.author, articleId: tip.articleId, notes: '' };
  }

  // Pattern: "Horse to win/noted for Event at Odds" (Declan/Sporting Life format)
  var toWinMatch = line.match(/^(.+?)\s+to\s+(?:win|be noted for)\s+(?:the\s+)?(.+?)\s+at\s+([\d\/]+(?:\s*\([^)]*\))?)/i);
  if (toWinMatch) {
    var notesText = '';
    // Check if there's more text after the odds (extra notes)
    var remainder = line.substring(line.indexOf(toWinMatch[3]) + toWinMatch[3].length).trim();
    if (remainder && remainder.length > 3) {
      notesText = remainder.replace(/^[.,]\s*/, '');
    }
    return { event: toWinMatch[2].trim(), horse: toWinMatch[1].trim(), odds: toWinMatch[3].trim(), stake: '', author: tip.author, articleId: tip.articleId, notes: notesText };
  }

  // Pattern: Just an event name (Harry Wilson / Pricewise style: "Event, Venue, Date")
  var eventOnlyMatch = line.match(/^(.+,\s*.+,\s*.+)$/);
  if (eventOnlyMatch && tip.subject) {
    // These are typically the event headers for dedicated ante-post articles; link to the full article
    return { event: line.trim(), horse: 'See full article', odds: '', stake: '', author: tip.author, articleId: tip.articleId, notes: 'Full ante-post analysis in source email' };
  }

  // Fallback: treat as a general note for an "Other Ante-Post" bucket
  if (line.length > 10) {
    return { event: 'Other Ante-Post Notes', horse: line.substring(0, 50) + (line.length > 50 ? '...' : ''), odds: '', stake: '', author: tip.author, articleId: tip.articleId, notes: line.length > 50 ? line : '' };
  }

  return null;
}

function parseSelectionsFromText(text) {
  var selections = [];
  var lines = text.split(/\n/);
  var currentAnalysis = [];
  var lastSel = null;

  // Common patterns:
  // NAP: Horse Name - Venue Time - 9/1 (2pts win)
  // Horse Name - Venue Time - 9/1
  // NB: Horse Name @ 5/1 Venue Time
  // Horse Name 3.15 Taunton 9/1 2pts win

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) {
      if (lastSel && currentAnalysis.length > 0) {
        lastSel.analysis = currentAnalysis.join(" ").trim();
        currentAnalysis = [];
      }
      continue;
    }

    // Try to detect a selection line
    var sel = tryParseSelectionLine(line);
    if (sel) {
      // Save any accumulated analysis to previous selection
      if (lastSel && currentAnalysis.length > 0) {
        lastSel.analysis = currentAnalysis.join(" ").trim();
        currentAnalysis = [];
      }
      selections.push(sel);
      lastSel = sel;
    } else if (lastSel) {
      // Accumulate as analysis text for last selection
      if (line.length > 15) { // Skip very short non-selection lines
        currentAnalysis.push(line);
      }
    }
  }
  // Final analysis
  if (lastSel && currentAnalysis.length > 0) {
    lastSel.analysis = currentAnalysis.join(" ").trim();
  }

  return selections;
}

function tryParseSelectionLine(line) {
  var category = "";
  var cleaned = line;

  // Extract category (NAP, NB, TREBLE etc)
  var catMatch = cleaned.match(/^(NAP|NB|NEXT BEST|TREBLE|DOUBLE)[:\s\-]+/i);
  if (catMatch) {
    var catRaw = catMatch[1].toUpperCase();
    if (catRaw === "NEXT BEST") catRaw = "NB";
    if (catRaw === "NAP" || catRaw === "NB") category = catRaw;
    cleaned = cleaned.substring(catMatch[0].length).trim();
  }

  // Pattern 1: Venue Time - Horse - Odds/stake (e.g. "Kelso 3.48 - Gaelic Rover - 3 point win at 10/11")
  var m1a = cleaned.match(/^([A-Za-z]+\s+\d{1,2}[.:]\d{2})\s*[-\u2013]\s*([A-Za-z][A-Za-z'\s]+?)\s*[-\u2013]\s*(.+)$/i);
  if (m1a) {
    var rest = m1a[3].trim();
    var oddsMatch = rest.match(/(\d+\/\d+|evens?|SP|TBC)/i);
    var odds = oddsMatch ? oddsMatch[1] : "TBC";
    var stake = rest.replace(/(\d+\/\d+|evens?|SP|TBC)/i, "").replace(/[\(\)]/g, "").replace(/at\s*/i, "").trim();
    return { race: m1a[1].trim(), horse: toTitleCase(m1a[2].trim()), odds: odds, stake: stake || "", category: category, analysis: "" };
  }

  // Pattern 1b: Venue Time - Horse Odds (no second dash, e.g. "Taunton 3.15 - Scaredofnothing 9/1")
  var m1b = cleaned.match(/^([A-Za-z]+\s+\d{1,2}[.:]\d{2})\s*[-\u2013]\s*([A-Za-z][A-Za-z'\s]+?)\s+(\d+\/\d+|evens?|SP|TBC)(?:\s+(.+))?\s*$/i);
  if (m1b) {
    return { race: m1b[1].trim(), horse: toTitleCase(m1b[2].trim()), odds: m1b[3], stake: (m1b[4] || "").trim(), category: category, analysis: "" };
  }

  // Pattern 2: Horse - Venue Time - Odds (stake)
  var m2 = cleaned.match(/^([A-Za-z][A-Za-z'\s]+?)\s*[-\u2013]\s*([A-Za-z]+\s+\d{1,2}[.:]\d{2})\s*[-\u2013]\s*(\d+\/\d+|evens?|SP|TBC)(?:\s*[\(\,]\s*(.+?)[\)\,]?)?\s*$/i);
  if (m2) {
    return { race: m2[2].trim(), horse: toTitleCase(m2[1].trim()), odds: m2[3], stake: (m2[4] || "").trim(), category: category, analysis: "" };
  }

  // Pattern 3: Horse @ Odds Venue Time
  var m3 = cleaned.match(/^([A-Za-z][A-Za-z'\s]+?)\s*@\s*(\d+\/\d+|evens?|SP|TBC)\s+([\w\s]+?\s+\d{1,2}[.:]\d{2})/i);
  if (m3) {
    return { race: m3[3].trim(), horse: toTitleCase(m3[1].trim()), odds: m3[2], stake: "", category: category, analysis: "" };
  }

  // Pattern 4: Horse Name (Venue Time) Odds
  var m4 = cleaned.match(/^([A-Za-z][A-Za-z'\s]+?)\s*[\(\[]\s*([A-Za-z]+\s+\d{1,2}[.:]\d{2})\s*[\)\]]\s*(\d+\/\d+|evens?|SP|TBC)(?:\s+(.+))?\s*$/i);
  if (m4) {
    return { race: m4[2].trim(), horse: toTitleCase(m4[1].trim()), odds: m4[3], stake: (m4[4] || "").trim(), category: category, analysis: "" };
  }

  // Pattern 5: Time Venue Horse Odds
  var m5 = cleaned.match(/^(\d{1,2}[.:]\d{2})\s+([A-Za-z]+)\s+([A-Za-z][A-Za-z'\s]+?)\s+(\d+\/\d+|evens?|SP|TBC)(?:\s+(.+))?\s*$/i);
  if (m5) {
    return { race: m5[2].trim() + " " + m5[1].replace(".", ":"), horse: toTitleCase(m5[3].trim()), odds: m5[4], stake: (m5[5] || "").trim(), category: category, analysis: "" };
  }

  // Pattern 6: Horse Odds Venue Time
  var m6 = cleaned.match(/^([A-Za-z][A-Za-z'\s]{2,}?)\s+(\d+\/\d+|evens?)\s+([A-Za-z]+\s+\d{1,2}[.:]\d{2})(?:\s+(.+))?\s*$/i);
  if (m6) {
    return { race: m6[3].trim(), horse: toTitleCase(m6[1].trim()), odds: m6[2], stake: (m6[4] || "").trim(), category: category, analysis: "" };
  }

  // Pattern 7: Loose - just Horse and Odds on a line (e.g. "Gaelic Rover 10/11")
  var m7 = cleaned.match(/^([A-Za-z][A-Za-z'\s]{2,}?)\s+(\d+\/\d+|evens?)(?:\s+(.+))?\s*$/i);
  if (m7 && m7[1].trim().split(/\s+/).length <= 5) {
    return { race: "", horse: toTitleCase(m7[1].trim()), odds: m7[2], stake: (m7[3] || "").trim(), category: category, analysis: "" };
  }

  return null;
}

function toTitleCase(str) {
  return str.replace(/\w\S*/g, function(txt) { return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase(); });
}

  var clashes = findHotClashes(allSels);
  var hotTab = document.getElementById("tab-hotlist");
  if (hotTab) hotTab.innerHTML = '&#128293; Hot List' + (clashes.length > 0 ? '<span class="tab-count">' + clashes.length + '</span>' : '');

  // Antepost count — count all articles that have non-empty antePost OR ante-post selections
  var apCount = ARTICLES.filter(function(a) {
    if (a.antePost && a.antePost.trim()) return true;
    if (a.selections) { for (var i = 0; i < a.selections.length; i++) { if (a.selections[i].race && a.selections[i].race.toLowerCase().indexOf('ante-post') !== -1) return true; } }
    return false;
  }).length;
  var apTab = document.getElementById("tab-antepost");
  if (apTab) apTab.innerHTML = 'Ante-Post' + (apCount > 0 ? '<span class="tab-count">' + apCount + '</span>' : '');

  // Show/hide mark all read button
  var markBtn = document.getElementById("markAllReadBtn");
  if (markBtn) markBtn.style.display = unread > 0 ? 'block' : 'none';
}

function selectCard(id) {
  selectedId = selectedId === id ? null : id;
  if(id) { markRead(id); if(!activeView[id]) activeView[id] = "original"; }
  render();
  if(selectedId) { var r = document.querySelector('.reader'); if(r) r.scrollTop = 0; }
}
function setView(id, v) { activeView[id] = v; render(); }
function setAuthor(a) { filterAuthor = a; selectedId = null; render(); }

setInterval(function() { location.reload(); }, 300000);
try {
  if (sessionStorage.getItem("ri-go-home")) {
    sessionStorage.removeItem("ri-go-home");
    selectedDate = getDefaultDate();
    filterAuthor = "All";
    selectedId = null;
    activeTab = "emails";
    document.querySelectorAll(".page-tab").forEach(function(t) { t.classList.remove("active"); });
    var et = document.getElementById("tab-emails"); if (et) et.classList.add("active");
  }
} catch(e) {}
render();
</script>
</body>
</html>
