      originalBody: "Saturday 28th March\n\nNice winner for us yesterday with Power Fizz.\n\nDoncaster 1.50 - James\'s Delight\nAdvised Odds: 7/1 (General - 4 places)\nAdvised Bet: 1 point each-way\nPerformance Metrics: Group 2 winner last season and arrives unpenalised here, giving him a strong chance on ratings. The Ascot run can be forgiven in elite company and his previous effort in this race is better than it looks, having suffered significant interference. Proven at 6f with multiple wins across varying ground conditions.\nTrack Characteristics: Doncaster\'s straight 6f suits strong travellers, especially those who handle cut in the ground. Conditions look ideal and should allow him to produce his best form.\nRace Projection: In a highly competitive renewal, he brings high-class form without a penalty and looks well treated. If getting a clear run, he has the ability to be firmly involved and represents solid each-way value.\n\nKempton 2.08 - Anniversary\nAdvised Odds: 4/1 (General)\nAdvised Bet: 2 point win\nPerformance Metrics: Beat a subsequent Classic winner on debut and now runs off a mark that looks lenient in comparison. The latest Lingfield effort came in a slowly run race where he failed to settle, suggesting there is more to come. Blinkers return and a 5lb claim is applied, enhancing his profile.\nTrack Characteristics: Kempton\'s surface and trip should suit better with a more honest pace expected. The track allows strong travellers to settle and build into the race, which is key to unlocking improvement.\nRace Projection: With headgear reapplied and fitness improved, a stronger showing is expected. If settling better and getting a true pace to aim at, he looks capable of capitalising on a lenient mark.\n\nDoncaster 3.32 - Valvano\nAdvised Odds: 12/1 (Unibet - 6 places)\nAdvised Bet: 0.75 point each-way\nPerformance Metrics: Lightly raced and has run well in defeat in handicaps, including a close third over this C&D on heavy ground. His opening mark looks workable given past form against high-class opposition, and the application of first-time tongue-tie and blinkers could unlock further improvement.\nTrack Characteristics: Proven over this course and distance and effective on softer ground, with conditions likely to suit again. The draw setup ensures coverage whichever side proves advantageous.\nRace Projection: If the new headgear brings about improvement and he builds on previous C&D form, he has the potential to outrun his odds. In a competitive field, he makes solid each-way appeal.",
      originalHtml: "",
      selections: [
        {race: "Doncaster 1.50", horse: "James's Delight", odds: "7/1", stake: "1 point e/w (4 places)", category: "", analysis: "James\'s Delight arrives as a Group 2 winner from last season, unpenalised for that top level success, which gives him an outstanding chance on ratings alone. It is worth noting that his previous effort in this race is better than the bare result, having suffered significant interference that day. The Ascot run can be forgiven in elite company and he is proven at six furlongs across varying ground conditions. Doncaster\'s straight course suits strong travellers and conditions look ideal to allow him to produce his very best form. Don\'t say you weren\'t warned."},
        {race: "Kempton 2.08", horse: "Anniversary", odds: "4/1", stake: "2 point win", category: "", analysis: "Anniversary beat a subsequent Classic winner on debut and now runs off a mark that looks remarkably lenient in comparison to that outstanding piece of form. The latest Lingfield effort came in a slowly run race where he failed to settle, which suggests there is considerably more to come from this talented individual. It is worth noting that the blinkers return for this assignment and a valuable 5lb claim is applied, both of which significantly enhance his profile. Kempton\'s surface and a more honest pace should allow him to settle and build into the race."},
        {race: "Doncaster 3.32", horse: "Valvano", odds: "12/1", stake: "0.75 point e/w (6 places)", category: "", analysis: "Valvano is lightly raced and has shaped with considerable promise in defeat in handicaps, including a close third over this course and distance on testing ground. His opening mark looks workable given past form against high class opposition and the application of first time tongue tie and blinkers could unlock further improvement. It is worth noting that he is proven over this track and trip and effective on softer ground, with conditions likely to suit again. In a competitive field, he makes substantial each way appeal at a generous price."}

      originalBody: "BETSEVEN\n\nCurragh 1.55 - Stag Night - 1.5 point win at 11/2 (General)\nStag Night shaped with real encouragement when third on his reappearance a fortnight ago and that outing should have left him spot on for this assignment back down to the minimum trip on his preferred ground. It is worth noting that the handicapper has been generous throughout, dropping him 8lb during an enforced absence before a further 1lb concession after what was a perfectly respectable effort last time. He won cosily off a mark of 84 at Naas in October and everything points to him being ready to strike again from this sort of level. The return to five furlongs at the Curragh looks ideal.\n\nDoncaster 3.32 - Botanical - 0.75 point e/w at 12/1 (Bet365 - 6 places)\nBotanical is another who could be revitalised by a change of yard and looks interesting despite top weight. He shaped as though still capable of smart form last season without quite delivering, often competing in stronger races than this. This looks a more suitable starting point and his new connections are more than capable of improving him. The ground should be in his favour and, if returning to his best, he has the class to go close in a race where plenty arrive with questions to answer.\n\nChris Howard\nBetSeven",

The Cammidge is as tight a betting heat as you can get, but James\'s Delight, unpenalised for last season\'s Group 2 win at the Curragh, has as good a chance as any. He was only fifth when favourite against a similar field last year, but would\'ve been closer without winning had he not been knocked sideways by the runner-up, and he does tend to run his race when there\'s cut in the ground. The past two winners are the favourites, but Spycatcher has a 5lb penalty this time, while Montassib\'s three runs last season would be nowhere near good enough to win this.

Intrusively spent his first two seasons with Ed Bethell, and he managed to win only once at long odds-on as a juvenile. He went up 19lb to a rating of 102 for a close third in the Richmond Stakes at Glorious Goodwood when still a maiden and a 40-1 outsider. He had a difficult three-year-old campaign but ran well on occasions, not least when fourth of 14 despite a slow start to Desperate Dan in a course-and-distance handicap in October. He went to the sales after that and was snapped up by Mick Appleby for just 12,000gns. He\'s 5lb better off for two and a half lengths with the winner and runs as a first-time gelding on what is now a tempting rating of 85.

Marhaba Ghaiyyath was super consistent as a three-year-old until a long campaign got the better of him in the Cambridgeshire, and given the way his half-brothers Fujaira Prince and Nichols Canyon improved with age there could be an awful lot more to come. He\'s drawn in three, while the two ahead of him in the betting, Respond and El Burhan, are drawn in stalls ten and 11, and there hasn\'t been a winner from a double-figure stall in the past decade.

Greek Order is a big price for a horse who\'s been second in a Cambridgeshire, fourth in a Hunt Cup and fourth in a Golden Mile at Goodwood. That Cambridgeshire second is ancient form, but the last two were last season on Greek Order\'s first and third outings for Michael Bell. If he could return to his early-season best he\'d have a right chance. Given the stable form with five from the past six runners, he must be worth chancing from stall one.

Having been sidelined for most of last year, he was generously dropped 8lb to a mark of 84 on his return at Naas in October and capitalised in cosy fashion.

There haven\'t been many more interesting renewals of the William Hill Lincoln at Doncaster and there are loads of interesting horses in the line up that could be well ahead of their handicap marks.

La Botte and Eternal Force fit neatly into that category and there is every chance they are capable of a lot better than they have shown to date, but they are both short enough and there are a few other four-year-olds in the race that have just as much potential, starting with the two-time course winner Rogue Diplomat.

Rogue Diplomat has won his last four starts including the last two over 7f at this track and there is every reason to think that he will improve again, especially as the step up to a mile will be a help rather than a hindrance.

The contest he won on his last start was strong and he only went up 3lb, while connections have aimed him at the Lincoln ever since. His burgeoning trainer James Owen has made no bones about the fact that he has improved a lot physically over the winter and it\'s not hard to see him travelling well off the pace and being produced late by Harry Davies.

That is usually how the Lincoln is won and if stall five isn\'t a hindrance, there is absolutely no reason why Rogue Diplomat won\'t go extremely close.

Shout has similar credentials and could go well for the Crisford team, but it could be the yard\'s best chance of a winner is Treble Tee in the William Hill Doncaster Mile Stakes.

He has a lot to find on the form book if he is to compete with the Queen Anne winner Docklands and the Sussex Stakes winner Qirat, but there are doubts about those two on their seasonal reappearances.

Treble Tee looked exceptional when winning a strong handicap over the course and distance on St Leger day and had excuses for his two defeats afterwards. If he\'s back to his course form then Treble Tee will serve it up to the two Group 1 winners.

Classic Encounter shaped really well in some high-class handicaps last season and comes from the George Boughey yard that went within a nose of winning the Lincoln with a similar type last season.

There is a chance the ground might be too slow for Classic Encounter, but he stays a mile extremely well and he can race off a lower mark than when an unlucky fourth in a stronger race than this at Sandown. Expect him to be coming fast and late too.`,

      originalBody: `Saturday 28th March 2026

NAP (Best Bet)

My best bet of the day on Saturday this week comes from Kempton and in the 3.13, which is the Virgin Bet Snowdrop Fillies' Stakes, a Listed event over a mile on the all-weather. I'm strong on the chances of SURVIE here for George Boughey and Billy Loughnane. She's a Group 2 winner who's also been placed several times at Group 1 level, including on her most recent outing, where she finished third behind Royal Champion in the Neom Turf Cup in Riyadh last month. That's form which speaks for itself, and she'll also have race fitness on her side ahead of main market rivals Cathedral and Glittering Surf. She also won the Winter Derby Trial at Lingfield on her penultimate start in January, and I think that she looks very solid here.

3.13 Kempton - SURVIE - (7/4) (Win) (NAP)

NB (Next Best)

I turn my attention to Doncaster for my next best bet of the afternoon, and the 2.57, which is another Listed event in the form of the Doncaster Mile. The Harry Eustace-trained DOCKLANDS makes a lot of appeal here for the team of Harry Eustace and Jamie Spencer. He takes a significant drop in grade here, having been plying his trade at Grade 1 level for the large parts of last season, where he added a top-flight success to his CV when winning the Queen Anne Stakes at Royal Ascot last June. If he's anywhere near that level of form for this particular assignment, he'll be very tough to beat; however, it would still be disappointing if he didn't post a very bold bid. He's gone well fresh in the past, and should be bang there.

2.57 Doncaster - DOCKLANDS - (7/4) (Win) (NB)

3B (Third Best Bet)

My third-best bet of the day comes from the Curragh, and the 1.55, where we have a competitive five-furlong handicap. I'm fairly strong on the chances of STAG NIGHT in this particular affair for Willie McCreery and Billy Lee. He's an admirable campaigner at the age of eight and often gives a good account of himself in these types of races. He was third here last year off a five-pound higher mark, and made a pleasing return to the track when third here earlier this month over six furlongs and on heavy ground. He possibly tired on the surface on that occasion, and should be a lot sharper here back down to five. I think he's got a big chance off this mark, and a big run would be no surprise.

1.55 Curragh - STAG NIGHT - (7/1) (Win) (3B)

Each-Way Bet

I head back to Doncaster for my each-way bet of the day, and this comes within the 1.50, which is the Listed Cammidge Trophy Stakes over six furlongs. I've come down on JASOUR here for Clive Cox and Jason Hart. He hasn't been seen since finishing a very solid sixth of fourteen behind No Half Measures in the Group 1 July Cup at Newmarket, which is good form considering he was only two and three-quarters of a length behind the winner on that occasion. A repeat of that run would be enough to go very close in this, as he's taking a significant drop in class. His last win also came on good-to-soft ground, which it's likely to be here, and that win also came following a break.

1.50 Doncaster - JASOUR - (13/2) (Each-Way)

Longshot

My longshot of the day comes within the feature at Doncaster at 3.32, which is the Lincoln Handicap over the straight mile. It's always an ultra-competitive affair, and in this year's renewal, I'm taking a chance on BOTANICAL for Karl Burke and Sam James. He'll have no issue with the ground here, having won on both good and soft surfaces, and he's dropped down to a mark which is three pounds lower than his mark when he finished second of twenty in the John Smith's Cup at York a couple of seasons ago. He's no stranger to big-field competitive handicaps and makes his stable debut here for the Karl Burke yard. He's also run well fresh in the past, and is generally a useful sort on his day. I think he can outrun a big price here.

  originalBody: `The Laurels
Vying for favouritism are Slingshot Poppy and Romeo Steel but while they both are very fast dogs who should be suited to the contours of the Wolverhampton circuit, I'm taking both on.
Poppy as I feel she can't put three decent runs together in Cat 1 company to win it!
Steel can and has done but he's in a red hot heat with pace inside and outside him in Bower Sheeran and Droopys Aladdin. I want to see who makes it through from that contest before shelling out my hard earned on them Ante Post.

My first selection Wicky Ned is third in the betting and has to overcome a lengthy lay off, as he's not raced competitively since winning the Select Stakes at Nottingham last August.
He went to Shelbourne trialled for the Irish Derby but picked up an injury, then was going to run in the Eclipse Stakes but picked up a different injury which made him miss that.
Jimmy Fenwick thinks he's got him back now and was pleased with his recent spin round Dunstall Park.

It's a bit of a gamble taking on Ned being 100% but he's found a winnable heat and he's a class act.
If he stays injury free he can win the Laurels.

My second and Final selection is Not So Steady who can outrun his big odds imo, his trial stake run was impressive ducking under the 28sec mark and showing very good early.
It looks a track that suits him, yes he's a bit hit and miss but that's factored into his odds on offer.

Ante Post - The Laurels
Final 11th April 1/4 odds 4 places

Wicky Ned 1.5 points win @ 6/1 Bresbet (5/1 B365)
Not So Steady 0.5 point ew @ 40/1 Bresbet (33/1 B365)

Dunstall Dash
The front of the market looks the place to be in the supporting sprint competition.
Good Acclaim looks to be one of the best sprinters around at present and he's rightfully at the top of the market and he has winning form over C&D
He looks a solid play.

  "originalBody": "Today's Selections:\n\n2.50 - Wetherby - Cardamon Hill. 0.75 pts e/w. Available at 40/1. (Unibet, Bet365, BOG)\n\nEarly market prices suggest he may need this return from a 404 days absence and the balance of his form supports that theory. However every horse has his price and the odds quoted for Cardamon Hill look too big. He is now with a fledgling Trainer but he has won over this C/D, albeit a weak four runner affair, and his last win was from a two pound higher mark than he runs from today. That victory came in a better race than this one and the market may have over-reacted to his two subsequent efforts. The lack of headgear also points to there being other days for him but, at his current price, it won't take a large outlay to discover whether he is fit enough to do himself justice.\n\n3.20 - Wetherby:\nDaylatedollarshort. 3.5 pts win. Available at 4/1. (Generally available, BOG)\nDuel Au Soleil. 0.75 pts e/w. Available at 16/1. (Generally available - 1/5 odds first 5, BOG)\n\nDaylatedollarshort has been supported early on but he still appeals at his current odds. This is just his fourth start and it comes here on the back of a narrow C/D victory on his handicap debut. His hurdling in that victory left a little to be desired and it's likely he has been well schooled during his subsequent three month absence. If he has improved in that department a four pound higher mark may be of no consequence. The stable remain in good form and Sean Bowen returns to the saddle. He has shown he can handle ground from good through to soft and his breeding suggest he will carry on improving as he steps up in trip. The likely decent pace will suit this progressive five year old. Ben Pauling saddles three in an attempt to win this prize and, although Duel Au Soleil may not be main stable hope, he looks the most attractively priced given his progressive profile. He was last seen going down narrowly over an extended 23 furlongs at Ascot from a four pound lower mark. All his form to date has come on ground no worse than good to soft and he has a C/D win to his name. He has been given a three month break since he was last seen but fitness is rarely an issue with this yard and as a horse who stays further, Duel Au Soleil, will appreciated the likely generous pace.\n\n4.30 - Fontwell - Alright Dai. 3 pts win. Available at 5/1. (Generally available, BOG)\n\nOnly eight runners go to post for this valuable prize but, as you would expect, it's a very competitive affair. Preference is for the most unexposed Chaser in the field, Alright Dai. He was C/D winner on his Chasing debut and followed that up with a six length third over an extended 26 furlongs at Sedgefield. His fencing was far from perfect in the latter race and there is plenty of scope for improvement as he gains experience. The cheekpieces he has worn on his last three starts (two wins) are retained and his current mark of 105 looks very manageable. Represents a yard whose Chasers are always worth a second look and ridden by a jockey who has a decent strike rate at this track.\n\n4.50 - Wetherby - King Casey. 0.75 pts e/w. Available at 22/1. (Skybet - 1/5 odds first 5, BOG)\n\nYou can pick holes in most of this field but there are a handful who can improve on what they have so far shown. The favourite, Yummy, is certainly one of those but he is priced accordingly and worth taking on given the places on offer from many of the layers. King Casey has a profile which suggests he will be a big price in almost any race he pitches up in. He has mainly disappointed in his eleven starts to date and remains a maiden, placing just twice. However one of his best efforts came over this C/D on his penultimate start and he ran well to a point when fading over 27 furlongs at Sedgefield last time out. The drop back in trip and returning to this venue could illicit a performance that could see him get competitive from the same mark. Of course that run may have been a false dawn but that is built into his big price and the five places on offer by one layer look worth risking.\n\n7.00 - Newcastle - Roberta Caro. 1 pt e/w. Available at 14/1. (Generally available - 1/5 odds first 4, BOG)",

{
  "id": "19d2f4533dfdb89a",
  "originalSubject": "New Horse Racing Tip",
  "from": "Ben from The Racing Analyst <contact@theracinganalyst.com>",
  "author": "Ben",
  "emailDate": "2026-03-27T12:29:14Z",
  "tipDate": "2026-03-28",
  "processedAt": "2026-03-27T13:15:00Z",
  "originalBody": "HELLO ANDY\nHere are today's selections.\n\n28TH MARCH 2026\n\nIts the first day of the flat season and, whilst in past years I've gone all in, this year I'm going to take a step back. Historically we've come out of this day well ahead, but it's been the Lincoln that has made our day/got us out of jail - having backed the winner for 6 of the last 8 seasons.\n\nThis year, I'm going to tip the main race only and concentrate on the all weather card at Kempton, where conditions are a bit more predictable. Once we've seen if there are any pace or draw biases at Doncaster, and have an idea whose horses are more forward than others, we can get stuck into Sundays card there.\n\n2.42 KEMPTON MARHABA GHAIYYATH 7/1 1PT WIN 4 PLACES NAP\n3.15 KEMPTON PINA SONATA 10/1 1PT WIN NB\n0.5PT EACH WAY DOUBLE\n\n2.08 KEMPTON ANNIVERSARY 7/2 1PT WIN\n\n3.32 DONCASTER ETERNAL FORCE 10/1 1PT WIN (ADVISED ANTE-POST)\n3.32 DONCASTER VALVANO 12/1 0.75PT EW 6 PLACES\n\nMARHABA GHAIYYATH hasn't won for a bit and is 16lb higher than for that last win, however I think he's open to a load of improvement for this step up in trip and he could have a little in hand. That win at Redcar came over a mile and he was sent from there to Goodwood, only to be beaten on the line (rated 95) by a horse that went on to win a listed race next time out. In 3rd place that day was a horse called Fort George, who was in receipt of 7lb from the selection. That horse has since gone on to finish 3rd in the Cambridgeshire, won a Group 3 in Meydan and then 2nd to a Group 1 horse next time out over in Dubai. He's now rated 102. The selection hasn't been as good on his next two starts, but one came when held up last at York, which was never going to work and the other came when having his first start since gelded. He's had a winter break and is upped in trip here which, on pedigree, ought to bring out a world of improvement. He's a half brother to Fujiara Prince (group placed, HC winner up to 1m6f rated 118) and Nichols Canyon (Group placed, Listed winner up to 2m and Grade 1 winning hurdler rated 164). With Charlie Johnston's horses in good form, and Callum Shepherd riding well, he might be a shade underestimated at 7/1. He's well drawn and thoroughly unexposed on the all weather too (3 runs, 2 wins and a 2nd).\n\nThe form standard in this race is set by Survie and Cathedral who, on ratings, ought to be miles clear of the rest. However, I think Survie might be vulnerable over this trip and Cathedral simply seems to dislike winning.\n\nPINA SONATA represents the bang in form James Fanshawe yard, who might just be a lot better than her mark on this surface. On what she has achieved to date, her mark of 94 is probably fair. However, it's fair to assume that we haven't seen the best of this filly who is bred to excel on the all weather and, so far, has only raced on it once (winning with ease). She is a half sister to Sky Safari who has won plenty of all weather races and whose form on the synthetics reads 1111121, latterly a Group 3 over 1m2f. Coming here fresh shouldn't be an issue, given that she won first time out last year and Daniel Muscutt has opted to ride her over the yard's other entry.\n\nANNIVERSARY is one of two horses running today for the Ralph Beckett stable that ought to be rated a hell of a lot higher than they are. This horse beat Scandinavia on debut, at Newmarket, shaping as though stamina was going to be his forte. However, whilst that winner is now a Classic winner rated 117, this horse hasn't won a race since and is running off a mark of 91. Stepped up to this 2 mile trip first time out this year, he was backed off the boards but a failure to settle, along with arguably needing the race, resulted in a 5th place finish. Today he's back in blinkers, he will have the freshness out of him and he gets a further 5lb off his back thanks to Jack Dace, who has a 21% strike rate when riding for the stable.\n\nETERNAL FORCE is the Haggas yards sole runner in this years Lincoln and he's been working exceptionally well ahead of his first target. He's believed to be of Group class, he's well drawn and the ground ought to be perfect too. Since his gelding operation, he is unbeaten. All the hard work, in terms of securing the better prices, has been done. Nobody has won this race more than William Haggas and it was this same trainer/jockey combination that took this race last year.\n\nVALVANO is another that hasn't gone on from his debut promise and met 2000 Guineas winner Notable Speech that day. Whilst that winner is now rated 122, this lad comes here off a mark of 94. He's disappointed countless times since, but over the last few weeks he has been working the house down in his new headgear. If they have the desired effect on the racecourse, then this horse ought to run a big race here. He's drawn on the opposite side to Eternal Force too, so we hopefully have both bases covered should there be a draw bias.\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst\n\nANTE POST ALREADY ADVISED\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN",

{id:'19d2eee5d3b4cbff',originalSubject:'Zenith Betting - 27th March',from:'The Inside Rail <info@theinsiderail.co.uk>',author:'Zenith Betting',emailDate:'2026-03-27T10:54:26Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:57:39Z',originalBody:'ZENITH BETTING\n\nLive To Laugh landed us another winner from our only selection yesterday.\n\nWetherby 2.50 - Mixedwave - 1.5 point win at 5/1 (General)\nMixedwave has been running well without reward of late, and would probably have won last time out but for a couple of errors at crucial stages. Wetherby should suit him better and the trip and track look ideal. All being well, he should be very competitive.\n\nRegards\nThe Inside Rail',originalHtml:'',selections:[{race:'Wetherby 2.50',horse:'Mixedwave',odds:'5/1',stake:'1.5 points win',category:'',analysis:'Mixedwave has been running consistently well without the reward his efforts have merited and it is worth noting that he would very likely have prevailed last time out but for a couple of errors at crucial stages of the race. The switch to Wetherby looks a shrewd move by connections, with the trip and track appearing ideal for a horse whose consistency has been a feature of his recent campaign. The handicapper has kept faith with a lenient assessment and everything points towards this being a prime winning opportunity. All the ingredients are in place for a bold showing.'}],doubles:'',antePost:''},
{id:'19d2ee56b6449219',originalSubject:'Today\'s Qualifiers [ 27th March ] Amendment',from:'BetRate <admin@betrate.co.uk>',author:'BetRate',emailDate:'2026-03-27T10:44:40Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:57:39Z',originalBody:'Apologies for the error today, I sent yesterday\'s again. Now updated.\n\nWe did it again yesterday with another nicely priced winner. Spirit Of Bowland (6/1) was very well backed and got the job done easily. Sargent Dennis (20/1) ran on late but couldn\'t quite make the frame.\n\nToday\'s Qualifiers\n\nWetherby 2.50 - Mixedwave (5/1)\nLingfield 4.12 - Thunderhoof (11/4)\nNewcastle 6.30 - Velvet Skies (11/2)\nNewcastle 7.30 - Mr Mistoffelees (7/1) 4 places\n\n(Recommended stakes - win bet (below 6/1), e/w bet (6/1 or bigger)\n\nBe lucky\nAlex\nBetrate',originalHtml:'',selections:[{race:'Wetherby 2.50',horse:'Mixedwave',odds:'5/1',stake:'1 point win',category:'',analysis:''},{race:'Lingfield 4.12',horse:'Thunderhoof',odds:'11/4',stake:'1 point win',category:'',analysis:''},{race:'Newcastle 6.30',horse:'Velvet Skies',odds:'11/2',stake:'1 point win',category:'',analysis:''},{race:'Newcastle 7.30',horse:'Mr Mistoffelees',odds:'7/1',stake:'1 point e/w',category:'',analysis:''}],doubles:'',antePost:''},
{id:'19d2eddfd083aad6',originalSubject:'Apex Bet - 27th March',from:'BetHub <tips@bethub.pro>',author:'Apex Bet',emailDate:'2026-03-27T10:36:32Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:39:39Z',originalBody:'APEX BET\n\nNewcastle 7.00 - Sergeant Wilko (15/2) Unibet 4 Places\nSergeant Wilko has solid C&D form at a higher level and is now well treated, sitting below his last winning mark. The recent run here in stronger company reads well and he remains in good order. This drop in grade gives him a big chance.\n1 point e/w.\n\nNewcastle 7.30 - Rogue Encore (11/2) General 4 Places\nRogue Encore is a three-time C&D winner who clearly thrives at this track. The Southwell run is best ignored and he has been moving well since. Back under the same rider and in the right conditions, confidence is high he can bounce back.\n1.5 point e/w.\n\nWill\nApex Bet',originalHtml:'<p>APEX BET</p><p>NEWCASTLE 7.00 \\u2013 SERGEANT WILKO (15/2) UNIBET 4 PLACES<br/>Sergeant Wilko has solid C&amp;D form at a higher level and is now well treated, sitting below his last winning mark. The recent run here in stronger company reads well and he remains in good order. This drop in grade gives him a big chance.<br/>1 point e/w.</p><p>NEWCASTLE 7.30 \\u2013 ROGUE ENCORE (11/2) GENERAL 4 PLACES<br/>Rogue Encore is a three-time C&amp;D winner who clearly thrives at this track. The Southwell run is best ignored and he has been moving well since. Back under the same rider and in the right conditions, confidence is high he can bounce back.<br/>1.5 point e/w.</p><p>Will<br/>Apex Bet</p>',selections:[{race:'Newcastle 7.00',horse:'Sergeant Wilko',odds:'15/2',stake:'1 point e/w',category:'',analysis:'Sergeant Wilko shaped with considerable promise when contesting stronger company at this venue on his latest outing and that form reads particularly well in the context of this engagement. It is worth noting that the handicapper has relented sufficiently to place him below his last winning mark, which represents a significant concession given the quality of his course and distance record. The application to four place terms adds further appeal and this drop in grade looks a deliberate and well timed move by connections. Don\'t say you weren\'t warned.'},{race:'Newcastle 7.30',horse:'Rogue Encore',odds:'11/2',stake:'1.5 points e/w',category:'',analysis:'Rogue Encore boasts an impressive record of three victories at this course and distance, a statistic that demands respect in a contest of this nature. The Southwell effort can be confidently dismissed as an aberration on unsuitable ground and those who have observed him in his work since report encouraging signs. The retention of a rider who knows him well is a positive and conditions look ideal for this confirmed track specialist to rediscover his best form. Expect a bold bid from a horse whose course record speaks for itself.'}],doubles:'',antePost:''},

field 4.42 – My Ambition – 0.75 point e/w at 12/1 (General – 3 places)<br/>Beat Royal Jet over C&amp;D last September and he’s a whopping 19lb better off with that rival in this field today. Denis Coakley’s yard is flying at 100% from their last three runners, which is a stat that jumps off the page. He’s won after a break before and the Spotlight says watch the market. Worth having on side at double figures.</p>',selections:[{race:'Wetherby 3.20',horse:'Bras D\'Or',odds:'3/1',stake:'2 points win',category:'',analysis:'Bras D\'Or represents a fascinating proposition on his handicap debut for the shrewd David Pipe yard. The form book reveals solid efforts in maiden and novice company, including a creditable fifth behind the useful Soldier Reeves at the Cheltenham Festival and a second behind Un Sens A La Vie at Ludlow. It is worth noting that an opening mark of 114 could prove generous given what he has achieved and the deliberate step up in trip to two miles five at Wetherby suggests connections know plenty about this fellow. The addition of a tongue tie for the first time adds further intrigue to the puzzle.'},{race:'Lingfield 4.42',horse:'My Ambition',odds:'12/1',stake:'0.75 points e/w',category:'',analysis:'My Ambition produced a telling performance when defeating Royal Jet over this course and distance last September and connections will note with considerable interest that he meets that rival on terms a full 19lb more favourable today. The form received a further boost from the Denis Coakley yard operating at a perfect strike rate from their last three runners, a statistic that demands attention. It is worth noting that this gelding has proven his ability to win fresh and the market will prove an invaluable guide. At double figure odds he represents outstanding each way value.'}],doubles:'',antePost:''},

{id:'19d2ed4309ddfe6b',originalSubject:'Daily AI Analysis [ 27th March ]',from:'IQ Racing <info@iqracing.net>',author:'IQ Racing',emailDate:'2026-03-27T10:25:51Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:36:13Z',originalBody:'Friday 27th March\n\nNewcastle 7.00 - Power Fizz\nAdvised Odds: 3/1 (General)\nAdvised Bet: 2 point win\nPerformance Metrics: Lightly raced with three wins to his name, including on the all-weather, and showed useful handicap form on turf last season. The Goodwood effort reads well and there is clear scope for improvement following a gelding operation, especially given the yard\'s excellent strike rate with similar types returning to action.\nTrack Characteristics: Newcastle\'s straight 6f should suit a strong traveller, particularly with plenty of pace on offer to ensure a well-run race. Proven on the all-weather and the drop in trip looks manageable given his running style.\nRace Projection: Returning from a break but with clear upside, he looks primed for a big run. With the yard sending just this runner and conditions likely to suit, he rates a major player and can make a winning reappearance.',originalHtml:'',selections:[{race:'Newcastle 7.00',horse:'Power Fizz',odds:'3/1',stake:'2 points win',category:'',analysis:'Power Fizz shaped with considerable promise on turf last season and the Goodwood form reads particularly well in the context of this assignment. It is worth noting that the gelding operation over the winter could unlock further improvement from a horse who has won three of his handful of starts. The yard\'s record with similar types returning to action from a break deserves the utmost respect and the straight six furlongs at Newcastle ought to play to his strengths. A well supported runner with plenty in his favour. Don\'t say you weren\'t warned.'}],doubles:'',antePost:''},
{id:'19d2ed07cd351d4c',originalSubject:'Bet Sage - 27th March',from:'BetHub <tips@bethub.pro>',author:'Bet Sage',emailDate:'2026-03-27T10:21:47Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:36:13Z',originalBody:'BET SAGE\n\nLingfield 2.12 - Pleasant Man - 2 point win at 7/2 (General)\nGalileo gelding who\'s been running well over further and now drops back to a mile and a quarter on a surface he handles. Two solid runs on the bounce and he\'s 2lb ahead of the handicapper, which gives him an edge in a race like this. The amateur riders\' element adds a layer of unpredictability but this fella has the class to overcome that.\n\nBET SAGE',originalHtml:'<p>BET SAGE</p>\n<p>Lingfield 2.12 – Pleasant Man – 2 point win at 7/2 (General)<br />\nGalileo gelding who’s been running well over further and now drops back to a mile and a quarter on a surface he handles. Two solid runs on the bounce and he’s 2lb ahead of the handicapper, which gives him an edge in a race like this. The amateur riders’ element adds a layer of unpredictability but this fella has the class to overcome that.</p>\n<p>BET SAGE</p>',selections:[{race:'Lingfield 2.12',horse:'Pleasant Man',odds:'7/2',stake:'2 points win',category:'',analysis:'Pleasant Man is a well bred Galileo gelding who has been running with credit over further distances and this drop back to a mile and a quarter on a surface he clearly handles could see him in an even more favourable light. It is worth noting that he arrives here off the back of two solid performances and sits a useful 2lb ahead of the assessor, which gives him a tangible edge over his rivals. The amateur riders element adds a degree of uncertainty but the class advantage he holds over the majority of these should prove decisive.'}],doubles:'',antePost:''},
{id:'19d2ecccdeb1c60a',originalSubject:'From The Stables - 27/03/2026',from:'From The Stables <postmaster@mg.fromthestables.com>',author:'From The Stables',emailDate:'2026-03-27T10:17:42Z',tipDate:'2026-03-27',processedAt:'2026-03-27T10:36:13Z',originalBody:'Friday, 27th March, 2026\n\nTODAY\'S FEATURED STABLES: B Pauling, C Longsdon, F M O\'Brien, J Morland, J Snowden, K Bailey & M Nicholls, N Richards, O Sangster, R Teal, S Dow, W Greatrex\n\nFTS FEATURE BETS\n\nTONY\'S NAP\n15:00 Fontwell Park: Kylenoe Dancer (3/1)\n"Kylenoe Dancer was meant to have run at Southwell the other day but we thought the ground was too quick. She won here at the beginning of the season and heads there fit and well and with a great chance."\n\nTONY\'S NEXT BEST\n17:17 Lingfield Park: Jack Langley (3/1)\n"Jack Langley is a multiple course winner over shorter but there\'s no reason why he won\'t be as effective over this trip, especially in this grade. He needs an even gallop and the last run was messy so he can easily be given another chance. May be more to come on turf as he matures."\n\nTONY\'S TREBLE\n15:50 Wetherby: Parramount (9/2)\n"Parramount has been a good friend to this column in the past. If Charlie\'s versatile star can handle fences, he could be very hard to catch up the Wetherby straight."\n\nTODAY\'S FTS RUNNERS\n\n14:20 Wetherby - Our Guide (5/4)\nTrainer: J Snowden - "By Soldier of Fortune, Our Guide is the brother to multiple winners Radetzky March, Hunters Hoof, Anightinlambourn, and the black-type mare Rosie and Millie. He won a Galway bumper on his sole start last October, and the form has been well advertised by the 3rd horse who was 3rd in the Grade 1 Turners at Cheltenham this month. He jumps well, and should go close here on his hurdling debut, although he will improve for the experience."\n\n14:20 Wetherby - Collanisi (25/1)\nTrainer: B Pauling - "Collanisi shaped well when a close 3rd in a bumper last season but hasn\'t run to anything like that in his two starts over hurdles. This is another deep race and he probably will do better later on in handicaps."\n\n14:20 Wetherby - Asta La Vista (80/1)\nTrainer: C Longsdon - "I hope the better ground will work in Asta La Vista\'s favour. He could be one for further down the line."\n\n14:20 Wetherby - Double Tiger (9/1)\nTrainer: W Greatrex - "Double Tiger put in a really pleasing performance first time over hurdles and he will have come on for that. The drop back in trip shouldn\'t be a problem and I expect him to go well."\n\n14:30 Fontwell Park - Ka Mate Du Brivet (7/1)\nTrainer: W Greatrex - "Ka Mate Du Brivet shows much more at home than he did in his bumper run. I\'m looking forward to getting him started over hurdles."\n\n14:42 Lingfield Park - Marra Donna (4/1)\nTrainer: O Sangster - "We\'re altering the headgear on Marra Donna today and dropping him back a little in trip. If the changes work he could have a nice chance although he is drawn a little wider than ideal."\n\n14:42 Lingfield Park - Solar Invincible (6/1)\nTrainer: R Teal - "I thought Solar Invincible was a bit unlucky last time, missing the break under young Toby Moore and then finishing very strongly. This is a trappy race where any of them can win but Billy Loughnane, who won on him the time before, is back on board and Solar Invincible is in good order. Hopeful."\n\n14:50 Wetherby - Youdecide (13/8)\nTrainer: B Pauling - "Youdecide has shaped promisingly in his two runs over fences. His one hurdles win came on good ground just over a year ago and under similar conditions we are hopeful he can get his chase career into motion."\n\n15:00 Fontwell Park - Kylenoe Dancer (3/1)\nTrainer: K Bailey & M Nicholls - "Kylenoe Dancer was meant to have run at Southwell the other day but we thought the ground was too quick. She won here at the beginning of the season and heads there fit and well and with a great chance."\n\n15:00 Fontwell Park - Wot You Wearing (8/1)\nTrainer: F M O\'Brien - "Wot You Wearing posted her best effort yet for the yard last time in a similar race for inexperienced riders. She is capable of running well off her basement mark here today but is not one to rely on entirely."\n\n15:20 Wetherby - Duel Au Soleil (12/1)\nTrainer: B Pauling - "Duel Au Soleil was an emphatic winner over the CD on his return from a break last October. Both his runs since then have been solid, especially the latest at Ascot when he was just edged out. Has to be a factor."\n\n15:20 Wetherby - Jhentong Enki (8/1)\nTrainer: B Pauling - "Jhentong Enki has won his last two races in grand style and Ben stays with him with three to choose from. He\'s had a break but should be bang there once more."\n\n15:20 Wetherby - King Of The Road (18/1)\nTrainer: B Pauling - "King Of The Road is the most experienced of our trio, but hasn\'t been too consistent. His run two back was a creditable 2nd at Kempton on Boxing Day over this trip, but he then put in a lesser performance. Has the ability to go close in a very competitive event."\n\n15:20 Wetherby - Freshers Week (25/1)\nTrainer: C Longsdon - "Freshers Week didn\'t seem to stay 3m last time so he\'s back a little in trip today. This qualifier is very competitive but I think he can run a nice race, hopefully getting into the places."\n\n15:30 Fontwell Park - Tom Desjy (7/4)\nTrainer: W Greatrex - "Chasing will be Tom Desjy\'s game. The first-time cheek-pieces should see him put in an enthusiastic performance. Can go close."\n\n15:42 Lingfield Park - Yachtsman (11/2)\nTrainer: J Morland - "Yachtsman made a very nice debut for us at Wolverhampton but then missed his next race owing to a stalls incident. He\'s in very good form at home and I think he\'ll enjoy going up to 7f. It\'s an open race but I\'m expecting a strong run."\n\n15:50 Wetherby - Parramount (9/2)\nTrainer: C Longsdon - "I know Parramount is age 10, but I have been trying to persuade his owner to let me run him in a chase for a while now. This track and ground should be ideal and if he handles this new discipline it could open up an extra dimension to his career."\n\n15:50 Wetherby - Koapey (2/1)\nTrainer: W Greatrex - "Koapey has had a wind-op and a bit of a break since his last run, and seems to have benefited from it. We should see a much-improved performance from him today."\n\n16:00 Fontwell Park - Last Round (11/2)\nTrainer: B Pauling - "Last Round has been given tough tasks in his two hurdles starts to date. This race isn\'t quite so deep but the favourite\'s 5th in the EBF Final this month stands out. We should be competing for a place."\n\n16:12 Lingfield Park - Marveling (66/1)\nTrainer: O Sangster - "Marveling hasn\'t shown us much yet. She will do better when able to run in handicaps in her own grade."\n\n16:12 Lingfield Park - Stella Lucente (4/1)\nTrainer: J Morland - "Stella Lucente made a very promising start around here six months ago. She has been going nicely at home and should be thereabouts today. The Harry Eustace horse looks the one to beat."\n\n16:20 Wetherby - Jupiter Des Mottes (9/4)\nTrainer: N Richards - "Jupiter Des Mottes made an impressive winning bumper debut for us two years ago after which he was sold and moved to another yard. He\'s now back with us and while he pulled up on his comeback run at Haydock, he was still in there when brought to a standstill by a horse falling in front of him. Hoping for better luck in running this time in which case he would have to hold a good chance."\n\n16:30 Fontwell Park - Alien Storm (12/1)\nTrainer: C Longsdon - "Alien Storm is the best horse in the race but he has a very big weight and it\'s just a case of whether he can handle it. Hoping for a place at least."\n\n17:17 Lingfield Park - Jack Langley (3/1)\nTrainer: S Dow - "Jack Langley is a multiple course winner over shorter but there\'s no reason why he won\'t be as effective over this trip, especially in this grade. He needs an even gallop and the last run was messy so he can easily be given another chance. May be more to come on turf as he matures."\n\n17:22 Wetherby - Matador St Georges (6/5)\nTrainer: B Pauling - "We bought Matador St Georges, a son of No Risk At All, last summer and he shapes very nicely. This small-field bumper might be the ideal starting point for his career."',originalHtml:'',selections:[{race:'Fontwell 3.00',horse:'Kylenoe Dancer',odds:'3/1',stake:'1 point win',category:'NAP',analysis:'Kylenoe Dancer was denied an intended outing at Southwell where the ground was deemed unsuitable, and connections have shrewdly rerouted to Fontwell where she carries a winning course form figure from earlier in the campaign. It is worth noting that the mare heads to post fit and well, and with trainer Kim Bailey confident enough to earmark this as the headline selection of the day, she carries considerable claims. The form received a significant boost by the manner of her previous Fontwell victory and she looks very well placed to follow up.'},{race:'Lingfield 5.17',horse:'Jack Langley',odds:'3/1',stake:'1 point win',category:'NB',analysis:'Jack Langley is a proven Lingfield performer with multiple course victories to his name over shorter distances and there is every reason to believe he will prove equally effective stepped up to this trip. It is worth noting that his previous outing was conducted in something of a messy fashion and he can comfortably be given another chance on the strength of his earlier course exploits. Simon Dow has found what looks an ideal opportunity and there may well be further improvement to come on turf as he continues to mature.'},{race:'Wetherby 3.50',horse:'Parramount',odds:'9/2',stake:'1 point win',category:'',analysis:'Parramount may be ten years of age but that should not discourage the astute punter from taking a keen interest. Trainer Charlie Longsdon has been eager to test this versatile campaigner over fences for some time and the combination of track and ground conditions look ideal for the experiment. It is worth noting that his hurdles form entitles him to go very close in a race of this nature and if he takes to the larger obstacles with any degree of fluency, he could prove extremely hard to catch up the Wetherby straight. Don\'t say you weren\'t warned.'}],doubles:'Treble: Kylenoe Dancer, Jack Langley, Parramount',antePost:''},

  {
    id: "19d2b4edbdc59d17",
    originalSubject: "New Horse Racing Tip",
    from: "Ben from The Racing Analyst <contact@theracinganalyst.com>",
    author: "Ben",
    emailDate: "2026-03-26T18:01:15Z",
    tipDate: "2026-03-27",
    processedAt: "2026-03-26T18:06:41Z",
    originalBody: "HELLO ANDY\nHere are today's selections.\n\n27TH MARCH 2026\nSpot on with GET UP MUSH, quite comfortably the best horse in the race and he's one for Ayr next month, but Harry Skelton would like that ride back today. He should have won quite comfortably.\nOne to run, heavily backed into favourite, for another good day.\nIt's been another excellent month to date, landing plenty of doubles throughout.\n\nWe landed a double this time last week, there haven't been many tips since. Two more this Friday\n\n3.20 WETHERBY BRAS DOR 11/2 1PT WIN 5 PLACES\n7.00 NEWCASTLE POWER FIZZ 7/2 1PT WIN 4 PLACES\n0.5PT EACH WAY DOUBLE\n\nI've had BRAS DOR in the tracker for a while now, waiting for a step up in trip and a venture into handicaps. Admittedly, I wasn't hoping for a race this deep and, long term, I'm most interested in when he goes over a fence. However, this mark looks a winnable one and this is a rare trip to Wetherby for the trainer. He caught the eye first time out this season, over 2 miles, at Cheltenham when travelling sweetly into the race but simply beaten by a combination of fitness and pace late on. Two further efforts have been decent, finishing 2nd and 3rd, but on neither occasion has he been all out and both times tenderly handled. The form of all three starts this season, though, has been excellent and he's constantly sandwiched winners. Based on what he's done so far, remember over a trip too short, I'd have him rated in the early 120's, so this mark of 114 ought to be well acheivable sooner or later. He steps up 5f here, which ought to be perfect on pedigree and the better ground should suit more than the deep stuff at Ayr last time. This is only the 2nd time in the last year that Pipe has brought a horse to Wetherby and he's fitted this lad with a first time tongue tie too (12% strike rate & \u00a317 level stakes profit). Jack Tudor comes up for just this one ride.\n\nThere are plenty in here that could win this and the race looks like it'll be run perfectly for the likes of BADRI with so many front runners in this field. However, it's full of exposed handicappers who we know a lot about, bar one horse. That horse is POWER FIZZ of William Haggas' and he makes his seasonal debut on the all weather, fresh from a gelding op which, as you will read, might be significant. Firstly the horse is well bred and is half brother to a top class sprinter Pink Crystal for these connections. Having done very little wrong to date, he's won some very good races, he was gelded after a decent effort at Goodwood on his last start, the form of which is strong. It's the gelding op, along with the form and pedigree, which is significant though because William Haggas has a quite remarkable 43% strike rate with his horses having their first start on the all weather, following the op. Having been running over 7f, and making all, he steps down to 6f here but with so many front runners in the race he will probably be held up just off it, and be able to use his stamina for further to good use. This is Haggas only runner on the card, fresh from their first winner of the season last Friday (landing us a double). They look set to have another great start to the season with a couple of big chances over the weekend.\n\nENJOY AND GOOD LUCK!\nBen at The Racing Analyst\n\nANTE POST ALREADY ADVISED\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN",
    originalHtml: "",

    originalBody: "Friday 27th March 2026\n\nNAP (Best Bet)\nMy best bet of the day on Friday comes from Wetherby, and in the 5.22, which is a Class 5 National Hunt Flat Race over two miles. The Skeltons could have another decent one on their hands here with A SIGHT TO SEA, who currently heads the betting on his rules debut here at the time of writing. He was a six-length winner of a point back in November, and was subsequently purchased for \u00a3190,000. This is far from the deepest of contests for him on his stable bow, and it would be no surprise to see him post a bold bid here for his all-conquering connections.\n\n5.22 Wetherby - A SIGHT TO SEA - (5/4) (Win) (NAP)\n\nNB (Next Best Bet)\nI turn to the all-weather for my next best bet of the day, and the 4.12 at Lingfield, which is a Class 5 maiden, which is ridden over a distance of seven furlongs. I'm quite strong on the chances of THUNDERHOOF here for the team of Harry Eustace and Kaiya Fraser. He posted a very encouraging effort on his debut at Southwell last month, where he finished third of eight, just a length and a quarter behind the winner. He also didn't get a clear run on that occasion, so you could mark the run up further, and he should naturally take a big step forward coming into his second start here.\n\n4.12 Lingfield - THUNDERHOOF - (11/8) (Win) (NB)\n\n3B (Third Best Bet)\nMy third best bet of the day on Friday comes back at Wetherby, and within the 3.20, A Class 4 handicap hurdle over two miles and five and a half furlongs. I think that BRAS D'OR can have a big say here for David Pipe and Jack Tudor, who's currently trading at a best price of 11/2. He makes his handicap debut here, and I think he could be a fair bit better than his opening mark of 114. He has some solid form in maiden and novice company, despite not getting his head in front. He was fifth behind Soldier Reeves at Cheltenham and November, and followed up when second behind the useful Un Sens A La Vie at Ludlow. He could be well in here, and has every chance of going close.\n\n3.20 Wetherby - BRAS D'OR - (11/2) (Win) (3B)\n\nEach-Way Bet\nI'm heading to Fontwell for my each-way bet of the day, and the 4.30, where we have a Class 2 handicap chase over two miles and three and a half furlongs. I like ALIEN STORM here for Charlie Longsdon and David Bass. He comes into the race in fantastic form, having won his last two outings, which came in the form of a six-length success at Plumpton, before following up at Doncaster the following month. He hasn't been seen since; however, he's likely been waiting for better ground, which he should get here. He's also just three pounds higher than his Doncaster success, and could still be on the upgrade.\n\n4.30 Fontwell - ALIEN STORM - (6/1) (Each-Way)\n\nLongshot\nMy longshot on Friday comes within the 7.00 at Newcastle, which is a Class 3 handicap on the all-weather over six furlongs. I'm taking a chance on SERGEANT WILKO in this competitive-looking affair for Kevin Ryan and Kevin Stott. He's currently trading at a best price of 12/1, which could be a tad on the big side. Just a couple of starts ago, he finished fourth of fourteen over course and distance in a Class 2 event off a two-pound higher mark, and he was only a length and three-quarters behind the winner on that occasion. He's also four pounds below his last winning mark, and has won over track and trip previously. I think that he's got a solid chance to outrun his price.\n\n7.00 Newcastle - SERGEANT WILKO - (12/1) (Each-Way) (4 places)",

    originalBody: `From The Stables - Thursday, 26th March, 2026

17:20 Chepstow - Lord Du Gouet (11/4)
"Lord Du Gouet joined the Jamie Snowden stable for £70k after winning his maiden Irish point by a length. The horse he beat that day joined him from the same sale - for £165k! Maybe this one is a bargain, then, but in any case, Jamie is terrific at winning first time out with his Irish point captures."

TONY'S NEXT BEST
16:30 Warwick - New Order (9/2)
"This final carries a 20k first prize. Surely Charlie's consistent chaser New Order deserves to win it. His form says he can."

TONY'S TREBLE
19:00 Chelmsford - Smokey Malone (5/1)
"Three-in-a-row has brought Smokey Malone onto a rating of 59. Several of his career's 11 wins have come off higher and clearly the Birkett girls have the eight-year-old in terrific form."

TODAY'S FTS RUNNERS

14:07 Southwell - Life After Love (3/1)

14:07 Southwell - Mythical Night (11/2)
Trainer D Cunha: "Mythical Night was beaten a head when meeting today's rival Life After Love over this CD early last month. She didn't seem to last home when a weakening 3rd at Newcastle last time, but now on this easier track and with a 3lb pull, she has a great chance of reversing the form."

15:37 Southwell - Immediate Jewel (80/1)

15:58 Warwick - Pure Seduction (11/1)

16:30 Warwick - New Order (9/2)
Trainer C Longsdon: "New Order has been mixing it with some high-class handicap chasers all season and has never run a bad race, although testing ground and 3m2f rather found him out at Doncaster last time. I prefer to judge him on his previous good 2nd in the Great Yorkshire there the time before and this final looks a more winnable opportunity. Hopeful."

17:00 Warwick - Saint Argente (9/2)

17:20 Chepstow - Lord Du Gouet (11/4)

17:20 Chepstow - Roccobye (33/1)

20:30 Chelmsford - Pantile's Gift (15/2)

  {
    id: "19d29209a66115b3",
    originalSubject: "Stephen Harris - 26th March",
    from: "Stephen Harris (via Rob)",
    author: "Stephen Harris",
    emailDate: "2026-03-26T07:51:33Z",
    tipDate: "2026-03-26",
    processedAt: "2026-03-26T08:17:00Z",
    originalBody: "Thursday, March the 26th, off up to the Midlands, the Warwick on Thursday. A pretty competitive card, fairly small fields, good ground expected. Warwick, a very sharp left-handed track on the chase course. The fences come up very quickly in the back straight. It can be quite demanding.\n\nDrumheller and Ip Up are the two selections. Usually pays to race handily, certainly on dry and good ground.\n\nNAP - Warwick 3.28 - Drumheller\n\nWe start off with our daily nap. This goes in the 3.28. It is a novice handicap chase, a class 5 over two mile four for 5-year-olds and upwards. Nearly 4,000 the winner. And I think this is a good opportunity for Drumheller to win for Nick Gifford on chasing debut.\n\nDrumheller is quite a promising maiden hurdler. Ran in a couple of bumpers, seven runs over timber without winning, but did shape with promise on a couple of occasions, notably over three mile one on the 17th of November when finishing second behind one of Henderson's, Final Straw, racing with real zest throughout on the good ground there and running really well, pulling well clear of the third.\n\nHe did then disappoint slightly back at Plumpton on the 15th of December, but perhaps ground conditions were a little bit soft there. I have no doubt at all that he can win over fences from a mark of 87. Hopefully a positive ride on the card from James Davis dropping back in trip to 2 mile 4 against some rivals with some experience but at a pretty modest level and I am confident that if there is a fluent round of jumping in Drumheller first time up he will take plenty of beating. He has not run for 101 days but I would imagine that is more about waiting for the ground to dry up rather than anything else. So Nick Gifford horses generally speaking in the spring tend to run well.\n\nValue - Warwick 3.58 - Ip Up\n\nOur value angle selection goes in the 3.58. It is a mares handicap hurdle class 4 for four year olds and upwards over 2 miles. 4,750 quid to the winner. A gilt-edged opportunity for Ip Up to defy top weight for Jedd O'Keeffe.\n\nNow, this 8-year-old mare tried chasing, zero from eight in that sphere, but three from 20 over hurdles. She ran really well, sent over to France last time out at Fontainebleau on the 26th of February. And her previous effort at Ludlow on goodish ground, similar to today, was a really credible one, finishing second behind Railway Bell, who is a very progressive and consistent performer for Fergal O'Brien. That form is by far the best on offer here. I think this test of speed will suit Ip Up back at 2 miles under Craig Nichol.\n\nNow she has got 12-2 to lump which is never easy for mares but this is a pretty weak race and I think she will do them for speed at the business end under a patient ride.\n\nBest of luck on Thursday everyone.",
    originalHtml: "",
    selections: [

        horse: "Drumheller",
        odds: "TBC",
        stake: "1 point win",

  {
    id: "19d2719d580996a5",
    originalSubject: "David Jennings - 26th March",
    from: "David Jennings (via Rob)",
    author: "David Jennings",
    emailDate: "2026-03-25T22:24:52Z",
    tipDate: "2026-03-26",
    processedAt: "2026-03-25T22:45:00Z",
    originalBody: "David Jennings is mad keen on an improving chaser at Clonmel on Thursday\n\nLive To Laugh\n3.42 Clonmel\n2pts win\n\nPolepatrick\n4.12 Clonmel\n1pt win\n\nThe handicapper has not held back in shovelling 10lb on to Live To Laugh\'s handicap mark, but such was the ease with which he won at Thurles he might well be able to defy that hefty hike in the 2m7.5f novice handicap chase (3.42) at Clonmel.\n\nIt is not a bad race for the grade and Nettuno Italia is a fascinating contender on his chasing debut, while Brown Boots has been a model of consistency since the turn of the year.\n\nBut there was a real swagger about the way Live To Laugh got the job done 21 days ago. He looks just the type to leave his moderate hurdles form well behind over fences.\n\nLive To Laugh shaped with promise on his sole point outing for Thomas Byrne in a race where the now 117-rated High Tea was more than 15 lengths behind him.\n\nSince then he has been disappointing over hurdles and is 0-10 in that sphere.\n\nIt was no surprise to see Peter Fahey send him over fences in January and he caught my eye when a solid third at Cork on his chasing debut. He came down at the first next time at Thurles, when a horse jumped across him, but last time back at that venue he jumped for fun and could be called the winner some way from home.\n\nHe posted a Racing Post Rating of 109, and although a 10lb rise from 94 to 104 seems severe, it wouldn\'t surprise me if he was rated in the 120s by the end of the campaign. He has the size and scope to keep climbing the ladder over fences.\n\nEthan O\'Sullivan got a great tune out of him at Thurles and his 7lb claim will once again be a big asset here. He should be hard to beat.\n\nThe only other bet that appeals on the card is Polepatrick on his stable debut for Henry de Bromhead in the 2m maiden hurdle (4.12).\n\nWe have not seen him for 410 days, but there was enough promise in two of his three bumper runs for Dermot McLoughlin to make me think an average maiden hurdle like this would be within his grasp.\n\nHe was only a head behind the now 128-rated hurdler Frankie John when fifth in a hot Navan bumper the last time we saw him in February 2025.",
    selections: [
      { race: "Clonmel 3.42", horse: "Live To Laugh", odds: "TBC", stake: "2 points win", category: "", analysis: "Live To Laugh shaped with real authority when getting off the mark over fences at Thurles 21 days ago and it would be no surprise to see him defy a 10lb rise here. It is worth noting that he has always looked a chaser in the making, having shown promise on his sole point outing where the now 117-rated High Tea finished well behind. The form received a boost from his Cork chasing debut where he caught the eye in third. Ethan O\'Sullivan\'s 7lb claim is a significant asset and Peter Fahey\'s charge has the size and scope to keep climbing the ladder over fences. Don\'t say you weren\'t warned." },
      { race: "Clonmel 4.12", horse: "Polepatrick", odds: "TBC", stake: "1 point win", category: "", analysis: "Polepatrick makes his stable debut for Henry de Bromhead after 410 days off the track and there is enough in his bumper form to suggest an average maiden hurdle like this would be well within his compass. It is worth noting that he was only a head behind the now 128-rated Frankie John when fifth in a hot Navan bumper on his last start. That form sets the standard in a race of this nature and the de Bromhead yard would not be sending him here without confidence that the ability remains intact. One to follow with interest." }
    ],
    doubles: "",

  {
    id: "19d26e35c21c3fe4",
    originalSubject: "Paul Kealy - 26th March",
    from: "Paul Kealy (via PPR)",
    author: "Paul Kealy",
    emailDate: "2026-03-25T21:23:28Z",
    tipDate: "2026-03-26",
    processedAt: "2026-03-25T21:45:00Z",
    originalBody: "Paul Kealy with three Thursday selections\n\nStellar Stream\n3.50 Chepstow\n1pt win\n\nYes Day\n4.30 Warwick\n1pt win\n\nTeorie\n4.50 Chepstow\n1pt each-way with firms offering four places\n\nWarwick has been doing its fair share of watering to ensure conditions don\'t get too quick, but high winds will be taking the moisture out of the ground as quick as it goes down and I wouldn\'t want to be relying on anything that wants plenty of cut.\n\nThe good-ground horses deserve their days out, too, though, even at the Cheltenham Festival (take note, Willie Mullins), and this could be the day to catch Yes Day in the 3m handicap chase (4.30) which doubles up as a Challenger Staying Chase Series Final.\n\nThe Jonjo and AJ O\'Neill-trained eight-year-old doesn\'t exactly boast encouraging seasonal form figures (PF6306), but he was favourite and going well off a mark of 122 on his first outing after a break in October before falling four out, and he\'s been dropped 7lb since then.\n\nIn his two other runs on decent ground he wasn\'t beaten that far, beaten 14 and a half lengths behind Konfusion (30lb higher now) at Wetherby, and six and a quarter lengths down on Toothless when third over an inadequate 2m4f in January.\n\nA marathon chase on bottomless ground at Windsor was never going to be for him, but he didn\'t shape at all badly when sixth of eight at Sandown just under three weeks ago, again when the ground was too soft. That was in a Class 3 and this is a Class 2, but the labelling on these series finals doesn\'t chime with reality, and the Sandown race was clearly a much classier affair.\n\nYes Day hit form for the O\'Neills in this month last year, winning easily off a mark of 116 on good ground at Hereford and then following up off 5lb higher on good to firm at Exeter. It wouldn\'t be a major surprise if he follows suit now.\n\nThe 3m6.5f handicap chase at Chepstow (3.50) could give Stellar Stream a chance to bounce back to form for Kayley Woollacott. The trainer has had her best season by some margin, but it\'s fair to say Stellar Stream hasn\'t been a part of that as he\'s been out of form since a decent third to Esperti at Ffos Las in November.\n\nHowever, he didn\'t shape that badly in a couple of runs back over hurdles without his usual headgear on his last two starts, and with the yard going so well (3-8 in the past fortnight) he makes some appeal with the cheekpieces back on.\n\nAfter running second to the then lowly rated Katate Dori at this course last January, Stellar Stream actually went off favourite for this race off 10lb higher than he is now.\n\nLater on the card a chance is taken on Teorie in the 2m7.5f handicap hurdle (4.50). He hasn\'t won over hurdles since February 2024, but an opening mark of 120, off which he was tenth of 22 in the Fred Winter, didn\'t really help his cause. He shaped a fair bit better upped to 3m on drying ground at Wincanton last time, and if he can build on that just a little bit he could be competitive at a likely big price. The form of his final three runs last spring, two of them second places, all on good ground off marks at least 10lb higher than he is off now, would certainly make him a major player.",
    selections: [
      { race: "Chepstow 3.50", horse: "Stellar Stream", odds: "TBC", stake: "1 point win", category: "", analysis: "Stellar Stream has been out of form since a decent third to Esperti at Ffos Las in November but there are grounds for optimism that the Kayley Woollacott yard can coax a revival. It is worth noting that the trainer has had her best season by some margin, with three winners from eight runners in the past fortnight alone. The application of cheekpieces looks a positive and he ran with credit on a couple of occasions back over hurdles without headgear on his last two starts. After running second at this course last January, he went off favourite for this very race off 10lb higher than his current mark, which tells its own story about his ability when conditions align." },
      { race: "Warwick 4.30", horse: "Yes Day", odds: "TBC", stake: "1 point win", category: "", analysis: "Yes Day has every chance of hitting form at this time of year for the Jonjo and AJ O\'Neill team. It is worth noting that he struck twice in quick succession during March last year, winning easily off 116 on good ground at Hereford before following up off 5lb higher on good to firm at Exeter. He was favourite and travelling powerfully on his seasonal return before falling four out off a mark of 122, and has been dropped 7lb since. The recent sixth at Sandown came on ground too soft for his liking in a much classier affair than this series final. Back on a sound surface at a track that should suit, he looks very well treated." },
      { race: "Chepstow 4.50", horse: "Teorie", odds: "TBC", stake: "1 point e/w", category: "", analysis: "Teorie has not won over hurdles since February 2024 but there were signs of encouragement when he shaped with more promise upped to three miles on drying ground at Wincanton last time. It is worth noting that an opening mark of 120, off which he finished tenth in the Fred Winter, never gave him a fair chance in handicap company. The form of his final three runs last spring, two of them second places and all on good ground off marks at least 10lb higher than his current rating, would make him a formidable player if anywhere close to that level. At a likely generous price, he looks well worth chancing." }
    ],
    doubles: "",
    antePost: ""
  },

    originalBody: "Thursday 26th March 2026\n\nNAP (Best Bet)\n\nThe best bet of the day on Thursday comes within the 5.00 at Warwick, and this is a Class 5 National Hunt Flat Race over two miles. Ivor Bear sets the standard here and should be tough to beat for the Twiston-Davies team. He was fourth on his rules debut in a Listed event at Cheltenham, before finishing second at Doncaster last time out behind a potentially useful sort in Friendly Glance. Whilst he couldn\'t land a glove on that rival, he was six lengths clear of the third on that occasion. He should take another step forward here, which makes him the one to beat.\n\n5.00 Warwick - Ivor Bear - (11/10) (NAP)\n\nNB (Next Best Bet)\n\nIt\'s over to Chepstow for my next best on Thursday, and the 4.50, which is a Class 5 handicap hurdle that\'s contested over two miles and seven and a half furlongs. Crystello is a big player here for Harry Derham and Paul O\'Brien. He won on his handicap debut at Musselburgh last month, with the front two on that occasion pulling fourteen lengths clear. He\'s up just four pounds for that particular success, and you\'d like to think there is still considerable improvement to come from him. Another bold effort would be no shock.\n\n4.50 Chepstow - Crystello - (9/4) (NB)\n\n3B (Third Best Bet)\n\nI\'m staying at Chepstow for what I rank as my third-best bet of the afternoon, and the 3.50, a Class 4 handicap chase over a marathon distance of three miles and six and a half furlongs. Rebecca Curtis is no stranger to winning a staying chase, and she could hold the key here with River Voyage, who\'s the mount of five-pound claimer Toby McCain-Mitchell. He kept on well to win over three miles on heavy ground at Ffos Las last time, giving the impression that he\'s got every chance of handling this further step up in distance. He\'s also up just three pounds for that success, and there should be more to come from him over fences.\n\n3.50 Chepstow - River Voyage - (7/2) (3B)\n\nEach Way Bet\n\nI now turn to Southwell for my each-way bet of the day, and the 4.07, which is a Class 6 handicap over seven furlongs. I like Maximum Velocity here for Nigel Tinkler and Rowan Scott. He returned to the track for the first time since August at Newcastle earlier this month, where he showed significant improvement on his handicap debut when upped in trip, to finish third of twelve, and just a length and three-quarters behind the winner. He remains on the same mark here, and that has to make him of serious interest if he takes another step forward.\n\n4.07 Southwell - Maximum Velocity - (9/2) (Each-Way)\n\nLongshot\n\nMy longshot on Thursday comes from Chelmsford and within the 5.30, which is a Class 5 maiden over six furlongs. I\'m taking a chance on a newcomer here in the form of Sargent Dennis for Jack Channon and George Bass. He cost 20,000 euros as a yearling, and notably, he is related to a couple of all-weather winners. Channon also doesn\'t do badly with three-year-olds on the all-weather, and he actually shows a profit for the last five seasons with his three-year-old runners on this surface. This doesn\'t look like a necessarily deep race, and he could go well on debut at a nice price.\n\n5.30 Chelmsford - Sargent Dennis - (20/1) (Each-Way)",

    originalBody: "3.07 Southwell\nSpirit Of Bowland\n5/1 - EACH WAY (B365)\n9/2 - EACH WAY (Skybet) *4 Places Paid\n\nThe only previous CD winner in the field and he wasn\'t given the best of rides from Paul Mulrennan in a recent classified Stakes race when 3rd, the selection was very well supported that day too which makes you think Connections reckon he\'s in a good place.\n\nIt\'s also interesting and looks positive with the change of jockey, Callum Rodriguez has a great record on this horse having won on him in 3 of the horse\'s 4 career wins to date, including his last win which came over today\'s CD in April (2025) from a higher mark, in a standard cl6 and obviously a higher all round standard of race, not to mention he couldn\'t have won much easier that day.\n\nA similar run to that this time around will definitely see him go close at the very least, if he opens up at the price expected I would imagine he would be hammered in the betting so we will need to get on quick just in case.\n\n5.07 Southwell\nWinchurch\n15/2 - EACH WAY (B365)\n9/1 - EACH WAY (Skybet) *4 Places Paid\n\nA horse who\'s been desperately out of form, he\'s not even managed to hit the frame in any of his last 10 starts after winning at Leicester last June.\n\nAll of his 3 Wins to date have been over the minimum distance (5f), including here when winning on racecourse debut.\n\nHowever he slightly caught my eye last time with a much improved performance when tried again up to 6f at Lingfield, he wasn\'t given a particularly hard time with some delicate handling and being held well off the pace, the way he picked up with little encouragement close home offers some hope that he can build on that, if up nearer the pace and a willing ride he could certainly run a decent race and some value again at an expected outsider opening price from a career low mark.\n\nHe\'s previously finished ahead of horses in the mid 70s on several occasions and he\'s also 9lb below his last turf winning mark, he\'s won on this surface previously however so should be able to give it a go with a more positive and aggressive ride. Harry Davies takes over for the first time today, the draw without doubt could\'ve been kinder but he\'s not the quickest away so should hopefully drop in if not losing too much ground from the gates and of course getting a clean/clear run which isn\'t always a given as we well know.\n\n7.00 Chelmsford\nFiddlers Green\n11/2 - EACH WAY (B365)\n15/2 - EACH WAY (Skybet)\n\nFar from disgraced when finishing just over 3 lengths behind the front 4 when running well out of the weights in a cl4 last time at Wolves over slightly further.\n\nHe\'s got a better record on the grass but his last Win did come on the AW (Kempton) and he\'s dropped down 2 grades into cl6 company today from a lower mark. He\'s still 4lb above that winning mark, however he finished a head 2nd from 1lb lower to a 70 rated horse at Kempton in December (2025), that horse went on to win again the race after now rated 76.\n\nThe selection ran a 2 length 2nd in the race after that again at Kempton but under a 3lb penalty for that close finish, that mark is 2lb higher than what he runs from today which for me puts him in the picture today.\n\nHe will come off the bridle and under a strong drive a distance from home but watching Luke Morris on him last time he kept at him in a much tougher race, if horse and jockey do the same today in a much weaker field he shouldn\'t be too far away at all.",

    originalBody: "26TH MARCH 2026\n\nIt's been a very quiet week due to the standard of racing. In truth, it isn't a great deal better on Thursday, but there are a couple of open races worth chancing.\n\n4.20 CHEPSTOW - LAURIER DES OBEAUX 5/1 1PT WIN\nWe've not seen a great deal from Laurier Des Obeaux up to now, but I suspect that he's merely been running for experience and we're possibly about to see a bit more of what this horse is about on handicap debut. He's been running ok, without ever looking like threatening, but he's done enough to suggest that the mark he's been given here might be a little lenient. Two starts ago, we possibly saw his best run in terms of form. Beaten 16 lengths into 5th that day at Newbury, the form has worked out well with the 1st, 3rd and 4th all winning since, the 4th is now rated 116 while the winner 135. He was pitched into a deep novice hurdle last time out, again at Newbury, with the 2nd horse rated 132 and the winner highly regarded. That run came after 2 months off, so should have put him spot on for this and this handicap mark of 105, on the bare form, is certainly a winnable one. The booking of Tom Cannon, who has a 21% strike rate for the yard this year and is only here for this ride, looks a noteworthy one too. The yard are in good form.\n\n4.30 WARWICK - GET UP MUSH 7/2 1PT WIN NAP\nA bit gutted that the price has shortened so much, but I can understand why, he looks like he's been trained for this. In honesty, on what he's done so far this season, there's nothing to recommend about him. However, he clearly came into this season after setback because he's missed the previous 15 months, having previously looked very progressive. This year has been dreadful, but there's reason to ignore it. He was well entitled to need the first run, the middle two came on soft ground which he clearly doesn't like and the last came going right handed (he's never run well that way round). Today he's back on a left handed track, he's back on good ground and he's well suited by Warwick's flat track too, having won here on his only previous visit. Rated 110, he's 8lb below his last winning mark and, if I'm right about the race being a target, he should be hard to beat for a Skelton yard that are weeks away, hopefully, from that maiden champion trainer title.\n\n7.30 CHELMSFORD - CLOVER TIME 10/3 1PT WIN\nI don't like backing horses with a row of 2s and 3s next to their name, especially when they've never won a race. However, Clover Time might just fall in here. He's the only horse in this race that hasn't just made the running, but has raced handy too and, granted a soft lead, he might not be caught around this front runners track. He's had a layoff since his last run, to freshen up, and is here running under Rab Havlin, for Rab's only ride on the card. He's gone well fresh, stall 1 is perfect and he's found himself in a race full of horses who also don't like winning. If he can't win this, he won't win any.\n\n0.25PT WIN TRIXIE\n\nANTE POST ALREADY ADVISED\n28TH MARCH - LINCOLN HANDICAP - ETERNAL FORCE 10/1 1PT WIN\n11TH APRIL - GRAND NATIONAL - CAPTAIN CODY 25/1 1PT WIN\n\nEnjoy and good luck!\nBen at The Racing Analyst",
